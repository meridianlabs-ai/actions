name: Release Please — Python package (reusable)

# Reusable workflow: Release Please for a Python package (release-type python;
# repos use hatch-vcs, so RP owns the changelog + creates the tag/GitHub
# Release, and hatch-vcs derives the version from the tag at build time).
#
# This workflow does release-please only (it does NOT publish — PyPI trusted
# publishing can't run from a cross-repo reusable workflow). Publishing lives in
# the package repo: either an in-repo publish job gated on `release_created`
# (retrofit style), or the repo's publish.yaml triggered `on: release`.
#
# Approval ping: this workflow can post the "awaiting approval" ping itself.
# It deep-links to `github.run_id` — CORRECT when the caller's publish job runs
# in the SAME run (retrofit style: release.yml has release-please + publish).
# For repos where publish is a SEPARATE run (publish.yaml `on: release`), set
# `approval-ping: false` here and post the ping from publish.yaml via the
# meridianlabs-ai/actions/slack-approval-ping composite action (so it deep-links
# to the actual paused run).
#
# Caller (retrofit style — publish in the same run):
#   jobs:
#     release-please:
#       permissions: { contents: write, pull-requests: write }
#       uses: meridianlabs-ai/actions/.github/workflows/release-please-python.yml@v1
#       with: { approvers: "login1 login2" }
#       secrets: inherit
#     publish: { needs: release-please, if: ..., ... }

on:
  workflow_call:
    inputs:
      config-file:
        type: string
        default: ".release-please-config.json"
      manifest-file:
        type: string
        default: ".release-please-manifest.json"
      approvers:
        description: "Space/comma-separated GitHub logins to @-mention in the approval ping (via slack-ids.json)."
        type: string
        default: ""
      approval-ping:
        description: "Post the approval ping from this workflow (deep-links to github.run_id). Set false if publish is a separate run and you ping from there instead."
        type: boolean
        default: true
      target-branch:
        description: "Branch Release Please manages. Leave empty for the default branch (normal releases); set to a maintenance branch (e.g. hotfix/1.4.x) to cut a hotfix release from a released tag."
        type: string
        default: ""
    secrets:
      RELEASE_PLEASE_APP_ID:
        required: true
      RELEASE_PLEASE_APP_PRIVATE_KEY:
        required: true
      SLACK_APPROVALS_WEBHOOK_URL:
        required: false
    outputs:
      release_created:
        description: "true when the release PR was merged and a release cut"
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: "tag of the created release, if any"
        value: ${{ jobs.release-please.outputs.tag_name }}
      html_url:
        description: "URL of the created GitHub Release (for announcements)"
        value: ${{ jobs.release-please.outputs.html_url }}
      body:
        description: "release notes body of the created release (for announcements)"
        value: ${{ jobs.release-please.outputs.body }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      html_url: ${{ steps.release.outputs.html_url }}
      body: ${{ steps.release.outputs.body }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          # No release-type here: in manifest mode it must come from the
          # config-file. Setting it as an input puts the action in simple mode
          # and silently overrides the config's per-package options (versioning
          # strategy, include-v-in-tag, changelog-sections).
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          # Default to the branch the run was triggered from (github.ref_name):
          # push to main → main; a workflow_dispatch from a maintenance branch →
          # that branch. This keeps the Release Please target and the publish
          # checkout on the SAME branch, so a hotfix is driven solely by the
          # "Use workflow from" branch selector — no separate input to mismatch.
          # The target-branch input remains an optional explicit override.
          target-branch: ${{ inputs.target-branch != '' && inputs.target-branch || github.ref_name }}

      # Release Please's changelog template hard-codes "### ⚠ BREAKING CHANGES"
      # (no config option changes it) and rewrites the release PR on every
      # update. Rename it to "### Breaking Changes" in the open release PR's
      # body, which becomes the GitHub Release notes when the PR is merged, and
      # in the newest section of CHANGELOG.md on its branch. Changes nothing
      # when the heading is absent or already renamed. The commit is made with
      # the App token, so it starts the release PR's pull_request checks. A
      # failure must not block a release, so the step continues on error; the
      # next run renames what it missed.
      - name: Rename the breaking changes heading
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ inputs.target-branch != '' && inputs.target-branch || github.ref_name }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, subprocess, sys, tempfile

          HEADING_RE = re.compile(r"^### \u26a0 BREAKING CHANGES(?=\r?$)", re.MULTILINE)
          HEADING = "### Breaking Changes"
          SECTION_RE = re.compile(r"^## ", re.MULTILINE)
          CHANGELOG = "CHANGELOG.md"
          CREATE_COMMIT = "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }"


          def gh(*args, payload=None):
              """Run gh; with `payload`, send it as the JSON request body."""
              if payload is None:
                  return subprocess.run(["gh", *args], check=True, capture_output=True, text=True).stdout
              with tempfile.NamedTemporaryFile("w", suffix=".json", delete=False) as f:
                  json.dump(payload, f)
              try:
                  return gh(*args, "--input", f.name)
              finally:
                  os.unlink(f.name)


          def rename(text):
              return HEADING_RE.sub(HEADING, text)


          def rename_newest_section(changelog):
              starts = [m.start() for m in SECTION_RE.finditer(changelog)]
              if not starts:
                  return changelog
              end = starts[1] if len(starts) > 1 else len(changelog)
              return changelog[: starts[0]] + rename(changelog[starts[0] : end]) + changelog[end:]


          def release_prs(repo, target):
              """Open release PRs on `target` from this repository's Release Please branches."""
              prs = json.loads(gh("pr", "list", "--repo", repo, "--base", target, "--state", "open", "--label", "autorelease: pending", "--limit", "100", "--json", "number,body,headRefName,isCrossRepository"))
              branch = f"release-please--branches--{target}"
              return [pr for pr in prs if not pr["isCrossRepository"] and (pr["headRefName"] == branch or pr["headRefName"].startswith(branch + "--components--"))]


          def read_changelog(repo, sha):
              try:
                  blob = gh("api", f"repos/{repo}/contents/{CHANGELOG}?ref={sha}", "-H", "Accept: application/vnd.github.object", "--jq", ".sha").strip()
              except subprocess.CalledProcessError as e:
                  if "(HTTP 404)" in (e.stderr or ""):
                      return None
                  raise
              return base64.b64decode(gh("api", f"repos/{repo}/git/blobs/{blob}", "--jq", ".content")).decode("utf-8")


          def fix(repo, pr):
              branch = pr["headRefName"]
              head = gh("api", f"repos/{repo}/branches/{branch}", "--jq", ".commit.sha").strip()
              changelog = read_changelog(repo, head)
              if changelog is None:
                  print(f"{branch} has no {CHANGELOG}")
              elif (renamed := rename_newest_section(changelog)) != changelog:
                  commit = {
                      "branch": {"repositoryNameWithOwner": repo, "branchName": branch},
                      # A push after the head was read fails the commit instead of being overwritten.
                      "expectedHeadOid": head,
                      "message": {"headline": f"chore: use the Breaking Changes heading in {CHANGELOG}"},
                      "fileChanges": {"additions": [{"path": CHANGELOG, "contents": base64.b64encode(renamed.encode("utf-8")).decode("ascii")}]},
                  }
                  gh("api", "graphql", payload={"query": CREATE_COMMIT, "variables": {"input": commit}})
                  print(f"Renamed the heading in {CHANGELOG} on {branch}")
              if (body := rename(pr["body"])) != pr["body"]:
                  gh("api", "-X", "PATCH", f"repos/{repo}/pulls/{pr['number']}", payload={"body": body})
                  print(f"Renamed the heading in the body of #{pr['number']}")


          def main():
              repo, target = os.environ["REPO"], os.environ["TARGET_BRANCH"]
              prs = release_prs(repo, target)
              if not prs:
                  print(f"No open release PR on {target}")
              for pr in prs:
                  fix(repo, pr)


          if __name__ == "__main__":
              try:
                  main()
              except subprocess.CalledProcessError as e:
                  print(f"::error::{' '.join(e.cmd)} failed: {(e.stderr or '').strip()}")
                  sys.exit(1)
          PY

      # Approval ping (retrofit style: publish runs in this same run, so
      # github.run_id is the run that will pause on the pypi environment).
      - name: Fetch Slack ID map
        if: ${{ inputs.approval-ping && steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: meridianlabs-ai/actions
          ref: v1
          sparse-checkout: slack-ids.json
          sparse-checkout-cone-mode: false
          path: _meridian_actions

      - name: Notify Slack — release awaiting publish approval
        if: ${{ inputs.approval-ping && steps.release.outputs.release_created == 'true' }}
        env:
          SLACK_APPROVALS_WEBHOOK_URL: ${{ secrets.SLACK_APPROVALS_WEBHOOK_URL }}
          APPROVERS: ${{ inputs.approvers }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_APPROVALS_WEBHOOK_URL" ]; then
            echo "SLACK_APPROVALS_WEBHOOK_URL not set — skipping Slack notification"
            exit 0
          fi
          mentions=""
          map=_meridian_actions/slack-ids.json
          if [ -f "$map" ] && [ -n "$APPROVERS" ]; then
            for login in $(echo "$APPROVERS" | tr ',' ' '); do
              id=$(jq -r --arg l "$login" '.[$l] // empty' "$map")
              if [ -n "$id" ] && [ "$id" != "TODO" ]; then
                mentions="$mentions <@$id>"
              fi
            done
          fi
          text=":rocket: *${REPO}* ${TAG} release created — PyPI publish is *awaiting approval*.${mentions} Review: ${RUN_URL}"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg t "$text" '{text: $t}')" \
            "$SLACK_APPROVALS_WEBHOOK_URL"
