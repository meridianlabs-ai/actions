---
name: Inspect AI Scheduled Tests

"on":
  schedule:
    # Run every 2 hours
    - cron: "0 */2 * * *"
  push:
    branches:
      - "**" # Run on all branches for testing
    # This is valuable during action development cycle
  workflow_dispatch:
    inputs:
      run_slow_tests:
        description: "Run slow tests"
        required: false
        default: true
        type: boolean
      test_slack_access:
        description: "Test Slack channel access"
        required: false
        default: false
        type: boolean
      inspect_ai_ref:
        description: "inspect_ai branch/tag/commit to checkout"
        required: false
        default: ""
        type: string
      pytest_args:
        description: "Additional arguments to pass to pytest (as a single string)"
        required: false
        default: ""
        type: string

jobs:
  # Resolve the inspect_ai commit to test and skip if it was already tested
  # successfully (SHA recorded as an artifact by the report job below).
  check-commit:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.run_slow_tests }}
    runs-on: ubuntu-latest
    outputs:
      skip_tests: ${{ steps.check_commit_artifact.outputs.skip_tests }}
      sha: ${{ steps.inspect_commit.outputs.sha }}
      short_sha: ${{ steps.inspect_commit.outputs.short_sha }}
      ref: ${{ steps.inspect_commit.outputs.ref }}

    steps:
      - name: Download last tested inspect_ai SHA artifact from previous run
        id: download_artifact
        run: |
          # Find the most recent successful run that actually has the artifact
          echo "Searching for a successful run with the 'last-inspect-ai-sha' artifact..."

          # Get successful runs and check each one for the artifact
          RUN_ID=""
          for run_id in $(gh api repos/${{ github.repository }}/actions/workflows/inspect-ai-scheduled-tests.yml/runs \
            --jq '.workflow_runs[] | select(.conclusion == "success") | .id' | head -10); do

            echo "Checking run $run_id for artifacts..."
            artifact_count=$(gh api repos/${{ github.repository }}/actions/runs/$run_id/artifacts \
              --jq '.artifacts[] | select(.name == "last-inspect-ai-sha") | .name' | wc -l)

            if [ "$artifact_count" -gt 0 ]; then
              RUN_ID=$run_id
              echo "Found run with artifact: $RUN_ID"
              break
            fi
          done

          if [ -n "$RUN_ID" ]; then
            # Create directory for artifact
            mkdir -p .last-inspect-ai-sha

            # Download the artifact from the actions repository (where this workflow runs)
            if gh run download $RUN_ID --name last-inspect-ai-sha --dir .last-inspect-ai-sha --repo ${{ github.repository }}; then
              echo "Successfully downloaded artifact from run $RUN_ID"

              # Read the SHA immediately and store it as output (before checkout wipes it)
              if [ -f ".last-inspect-ai-sha/last_sha.txt" ]; then
                last_sha=$(cat ".last-inspect-ai-sha/last_sha.txt")
                echo "last_sha=$last_sha" >> $GITHUB_OUTPUT
                echo "Found previously tested commit: $last_sha (from run $RUN_ID)"
              else
                echo "last_sha=" >> $GITHUB_OUTPUT
                echo "Downloaded artifact but could not find last_sha.txt file"
              fi
            else
              echo "last_sha=" >> $GITHUB_OUTPUT
              echo "Artifact download failed for run $RUN_ID"
            fi
          else
            echo "last_sha=" >> $GITHUB_OUTPUT
            echo "No previous successful runs with artifacts found"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Checkout inspect_ai repository
        uses: actions/checkout@v6
        with:
          repository: UKGovernmentBEIS/inspect_ai
          ref: ${{ inputs.inspect_ai_ref || '' }}
          fetch-depth: 0

      - name: Get inspect_ai commit info
        id: inspect_commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "ref=${{ inputs.inspect_ai_ref || 'main' }}" >> $GITHUB_OUTPUT

      - name: Check if commit was already tested
        id: check_commit_artifact
        run: |
          current_sha="${{ steps.inspect_commit.outputs.sha }}"
          last_sha="${{ steps.download_artifact.outputs.last_sha }}"

          echo "Current commit: $current_sha"

          if [ -n "$last_sha" ]; then
            echo "Found previously tested commit: $last_sha"
            if [ "$current_sha" = "$last_sha" ]; then
              echo "skip_tests=true" >> $GITHUB_OUTPUT
              echo "Commit $current_sha was already tested successfully, skipping"
              exit 0
            else
              echo "Current commit $current_sha differs from last tested commit $last_sha"
            fi
          else
            echo "No previous artifact found or could not read commit SHA"
          fi
          echo "skip_tests=false" >> $GITHUB_OUTPUT
          echo "Proceeding with tests for commit $current_sha"

      - name: Skip notification
        if: github.event_name == 'schedule' && (steps.check_commit_artifact.outputs.skip_tests == 'true')
        run: |
          echo "🔄 Skipping tests - no changes detected in inspect_ai repository"
          echo "Last tested commit: ${{ steps.inspect_commit.outputs.sha }}"
          echo "Current commit: ${{ steps.inspect_commit.outputs.sha }}"

  # The asyncio and trio passes are independent pytest invocations, so run
  # them as parallel matrix legs (previously sequential steps in one job,
  # roughly doubling wall-clock time). Both legs test the exact commit
  # resolved by check-commit.
  slow-tests:
    needs: check-commit
    if: needs.check-commit.outputs.skip_tests != 'true'
    # Larger GitHub-hosted runner (8-core / 32 GB / 300 GB SSD); the suite's
    # -n logical xdist parallelism and docker churn scale with cores.
    runs-on: slow_test_runner
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: asyncio
            pytest_flags: ""
            test_timeout: 900
          - mode: trio
            pytest_flags: "--runtrio"
            test_timeout: 1500

    steps:
      # Critical: Setup modern Docker build system
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest
          driver-opts: |
            network=host
          buildkitd-flags: |
            --allow-insecure-entitlement security.insecure
            --allow-insecure-entitlement network.host

      - name: Checkout inspect_ai repository
        uses: actions/checkout@v6
        with:
          repository: UKGovernmentBEIS/inspect_ai
          ref: ${{ needs.check-commit.outputs.sha }}
          fetch-depth: 0

      # Checking out a pinned SHA leaves a detached HEAD with no local `main`
      # branch. inspect_ai's sandbox-tools install-state check runs
      # `git diff main` to detect edits to sandbox-tools code and treats a
      # failure to resolve `main` as "edited", which resolves a `-dev` helper
      # binary that doesn't exist in CI (SandboxInjectionError in all
      # sandbox-tools tests). Recreate `main` at the tested commit's closest
      # ancestor on origin/main (the commit itself for scheduled runs) so the
      # check sees exactly the sandbox-tools changes the commit carries
      # relative to real main.
      - name: Create local main ref for inspect_ai install-state check
        run: git branch -f main "$(git merge-base HEAD origin/main)"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/setup.py', '**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache built wheels
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip/wheels
          key: ${{ runner.os }}-wheels-${{ hashFiles('**/pyproject.toml', '**/setup.py', '**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-wheels-

      - name: Install dependencies
        # -e is required so that the tests can find dependent media files
        # that are not part of the package.
        run: |
          python -m pip install --upgrade pip
          # Install inspect_ai with development dependencies for testing
          pip install --only-binary=all -e ".[dev]"
          pip install pytest-timeout
          # Pre-install the test fixture extension package so inspect_ai's
          # ensure_test_package_installed() short-circuits instead of
          # pip-installing it mid-run on the xdist critical path (~9s).
          pip install --no-deps ./tests/test_package

      - name: Run slow tests (${{ matrix.mode }})
        timeout-minutes: 180
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain
          BUILDX_CACHE_FROM: type=local,src=/tmp/.buildx-cache
          BUILDX_CACHE_TO: type=local,dest=/tmp/.buildx-cache,mode=max
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        run: |
          echo "Running ${{ matrix.mode }} slow tests..."
          # --timeout-method=thread mirrors the main repo's CI test job
          # (build.yml). The suite is latency-bound (serial provider API
          # calls and docker container churn), not CPU-bound, so xdist
          # parallelism cuts wall-clock dramatically. -n logical (not auto):
          # with psutil installed, auto counts physical cores — 4 on this
          # hyperthreaded 8-vCPU runner — while logical uses all 8.
          # --dist worksteal (not xdist's default load): load hands each
          # worker a large upfront chunk, so one worker stuck with slow tests
          # runs long after the others finish; worksteal rebalances idle
          # workers onto the remaining queue.
          pytest ${{ matrix.pytest_flags }} --runslow --runapi --ignore=tests/agent/test_agent_human.py -k "not test_mcp_sampling_fn" -n logical --dist worksteal --timeout=${{ matrix.test_timeout }} --timeout-method=thread ${{ inputs.pytest_args }}

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker system prune -f
          docker volume prune -f

  # Static analysis (the CI-safe equivalent of inspect_ai's `make check`)
  # against a fresh dependency resolution. inspect_ai's own CI gates run
  # mypy/ruff via `uv run`, which syncs the env against uv.lock — so upstream
  # static analysis only ever validates the locked dependency versions. This
  # job installs with plain pip (the frontier resolution a new user would
  # get), where newer deps can break mypy — it reads installed packages'
  # types/stubs — in ways the locked gate never sees. Separate job rather
  # than a step in the asyncio/trio matrix so it runs once, not twice.
  # Mirrors inspect_ai's `make check` recipe, which mutates (`ruff check
  # --fix` auto-fixes, `ruff format` rewrites), swapped for the check-only
  # equivalents. If that recipe changes upstream, this job drifts; accepted
  # to keep the no-inspect_ai-changes constraint.
  static-analysis:
    needs: check-commit
    if: needs.check-commit.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout inspect_ai repository
        uses: actions/checkout@v6
        with:
          repository: UKGovernmentBEIS/inspect_ai
          ref: ${{ needs.check-commit.outputs.sha }}
          # All refs/commits so setuptools_scm sees tags (a shallow clone
          # yields a bogus 0.1.dev version that conflicts with inspect-scout's
          # inspect-ai>=… pin), but blob:none to skip historical file
          # contents — the full pack is ~400MB. Same pattern as inspect_ai's
          # own CI.
          fetch-depth: 0
          fetch-tags: true
          filter: "blob:none"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/setup.py', '**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=all -e ".[dev]"

      - name: Run ruff
        run: |
          ruff check
          ruff format --check

      - name: Run ruff (inspect_tool_support)
        working-directory: src/inspect_tool_support/src
        run: |
          ruff check
          ruff format --check

      - name: Run mypy
        run: mypy --exclude tests/test_package src tests

  # Once-per-run bookkeeping: record the tested SHA (so later scheduled runs
  # skip it) and post the Slack notification. Runs after both matrix legs
  # and the static-analysis job.
  report:
    needs: [check-commit, slow-tests, static-analysis]
    if: always() && needs.check-commit.result == 'success' && needs.check-commit.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Save tested inspect_ai SHA as artifact
        if: needs.slow-tests.result == 'success' && needs.static-analysis.result == 'success' && github.event_name == 'schedule'
        run: |
          mkdir -p .last-inspect-ai-sha
          echo "${{ needs.check-commit.outputs.sha }}" > .last-inspect-ai-sha/last_sha.txt

      - name: Upload tested SHA artifact
        if: needs.slow-tests.result == 'success' && needs.static-analysis.result == 'success' && github.event_name == 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: last-inspect-ai-sha
          path: .last-inspect-ai-sha/last_sha.txt

      - name: Report test results to Slack
        id: slack_notification
        if: always() && needs.check-commit.outputs.ref == 'main' && needs.slow-tests.result != 'cancelled' && needs.static-analysis.result != 'cancelled'
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "${{ (needs.slow-tests.result == 'success' && needs.static-analysis.result == 'success') && '✅ Scheduled Tests Passed' || '🚨 Scheduled Tests Failed' }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ (needs.slow-tests.result == 'success' && needs.static-analysis.result == 'success') && '✅ Scheduled Tests Passed' || '🚨 Scheduled Tests Failed' }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Trigger:*\n${{ github.event_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Tested:*\n<https://github.com/UKGovernmentBEIS/inspect_ai/commit/${{ needs.check-commit.outputs.sha }}|inspect_ai@${{ needs.check-commit.outputs.ref }}#${{ needs.check-commit.outputs.short_sha }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Slow Tests:*\n${{ needs.slow-tests.result == 'success' && '✅' || '❌' }} ${{ needs.slow-tests.result }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Static Analysis:*\n${{ needs.static-analysis.result == 'success' && '✅' || '❌' }} ${{ needs.static-analysis.result }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ (needs.slow-tests.result != 'success' || needs.static-analysis.result != 'success') && '<!channel> The scheduled tests have failed. Please investigate.' || 'All tests and static analysis completed successfully! 🎉' }}"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Actor: ${{ github.actor }}"
                    }
                  ]
                }
              ]
            }

      - name: Upload Slack thread info for triage
        if: always() && (needs.slow-tests.result != 'success' || needs.static-analysis.result != 'success') && steps.slack_notification.outcome == 'success'
        run: |
          mkdir -p .triage
          cat > .triage/slack_thread.json <<EOF
          {
            "channel": "${{ steps.slack_notification.outputs.channel_id || secrets.SLACK_CHANNEL_ID }}",
            "thread_ts": "${{ steps.slack_notification.outputs.ts }}",
            "inspect_ai_sha": "${{ needs.check-commit.outputs.sha }}",
            "inspect_ai_ref": "${{ needs.check-commit.outputs.ref }}"
          }
          EOF

      - name: Upload triage artifact
        if: always() && (needs.slow-tests.result != 'success' || needs.static-analysis.result != 'success') && steps.slack_notification.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: triage-context
          path: .triage/slack_thread.json
          retention-days: 7

  test-slack-access:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_slack_access }}
    runs-on: ubuntu-latest

    steps:
      - name: Test Slack Channel Access
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: |
              🧪 **Slack Integration Test**

              This is a test message to verify GitHub Actions can successfully post to this Slack channel.

              • Repository: ${{ github.repository }}
              • Branch: ${{ github.ref_name }}
              • Actor: ${{ github.actor }}
              • Run ID: ${{ github.run_id }}

              If you see this message, the integration is working correctly! ✅

      - name: Test Result
        run: |
          echo "✅ Slack channel access test completed successfully!"
          echo "Check your Slack channel for the test message."
