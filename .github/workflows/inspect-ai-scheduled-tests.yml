---
# The slow test suite of upstream inspect_ai against the provider APIs, every
# two hours, with a Slack report and two artifacts for later trusted
# consumers.
#
# slow-tests and static-analysis execute code this repository does not
# control: `pip install -e ".[dev]"` resolves upstream's whole dev closure
# against PyPI on the day (no lock file, on purpose: the point of the run is
# the frontier resolution a new user would get), and pytest and mypy then
# import it together with upstream's tests. SECURITY.md names that code as an
# adversary that can take over its job's runner and read what is there (the
# provider keys). What these jobs must not have is anything that reaches
# beyond that one job:
#
# - The job token is declared read-only (workflow-level `permissions`), so
#   its reach does not depend on the repository's default token setting, and
#   no checkout persists it into .git/config (`persist-credentials: false`).
#   The logs of runs before this hardening showed the token already read-only
#   (Contents/Metadata/Packages: read); the declaration makes that a property
#   of the file rather than of a setting.
# - No Actions cache is restored or saved by a job that runs that code. A
#   cache saved after the closure ran would be restored by every later
#   scheduled run and installed from before the keys-bearing step, and it
#   would outlive the offending release and a key rotation. Every job installs
#   fresh; setup-python has no `cache:` input here.
# - The two artifacts (`last-inspect-ai-sha`, `triage-context`) are uploaded
#   by the report job, which runs only after those jobs have finished. Their
#   names are claimable by any job of the run attempt (a re-run is a new
#   attempt and legitimately uploads the names again), so the report job
#   refuses a name taken since its attempt started (no `overwrite`), and the
#   triage consumer trusts only the artifact id and digest this job records
#   in its own log (triage-test-failures.yml, "Resolve the trusted triage
#   context"). The skip-cache consumer (check-commit) takes
#   `last-inspect-ai-sha` only from a run whose conclusion is success, which
#   a refused upload prevents, and the newest of that name in it.
#
# tests/test_scheduled_workflows.py checks the permissions, checkout and
# cache contract and runs the scripts below.
name: Inspect AI Scheduled Tests

"on":
  schedule:
    # Run every 2 hours
    - cron: "0 */2 * * *"
  # A push runs the suite only when this workflow file itself changes, on any
  # branch: the development cycle for this workflow keeps its per-push checks,
  # while pushes to unrelated branches no longer attach slow-test results to
  # their PRs. workflow_dispatch remains for running it on any branch by hand.
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/inspect-ai-scheduled-tests.yml"
  workflow_dispatch:
    inputs:
      run_slow_tests:
        description: "Run slow tests"
        required: false
        default: true
        type: boolean
      test_slack_access:
        description: "Test Slack channel access"
        required: false
        default: false
        type: boolean
      inspect_ai_ref:
        description: "inspect_ai branch/tag/commit to checkout"
        required: false
        default: ""
        type: string
      pytest_args:
        description: "Additional arguments to pass to pytest (space-separated; letters, digits and _./=:,- only, so no quoting)"
        required: false
        default: ""
        type: string

# Read-only job token everywhere; the jobs that read this repository's
# run and artifact data add actions: read for themselves.
permissions:
  contents: read

jobs:
  # Resolve the inspect_ai commit to test and skip if it was already tested
  # successfully (SHA recorded as an artifact by the report job below).
  check-commit:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.run_slow_tests }}
    runs-on: ubuntu-latest
    # actions: read lists this workflow's runs and downloads the
    # last-inspect-ai-sha artifact with the job token.
    permissions:
      contents: read
      actions: read
    outputs:
      skip_tests: ${{ steps.check_commit_artifact.outputs.skip_tests }}
      sha: ${{ steps.inspect_commit.outputs.sha }}
      short_sha: ${{ steps.inspect_commit.outputs.short_sha }}
      ref: ${{ steps.inspect_commit.outputs.ref }}

    steps:
      - name: Download last tested inspect_ai SHA artifact from previous run
        id: download_artifact
        run: |
          # Only a scheduled run on the default branch is a trusted producer:
          # the report job uploads the artifact only on `schedule`, while a
          # push or dispatch run executes whatever copy of this workflow its
          # branch carries. The query narrows the page to such runs; the jq
          # filter enforces it on what comes back. Within the run, the name is
          # not enough on its own: a run's artifact list spans its attempts,
          # so a re-run that passed can carry both its report job's artifact
          # and an artifact of the same name a test job of an earlier, failed
          # attempt made (the report job refuses the name only within its own
          # attempt, and only the run's conclusion is checked here). The
          # newest of the name (highest id) is the one to take: the report
          # job of the successful attempt uploads after every job of that
          # attempt, and had a job of that attempt taken the name first the
          # report job would have failed and the run would not be a success.
          echo "Searching for a successful scheduled run on $DEFAULT_BRANCH with the 'last-inspect-ai-sha' artifact..."

          RUN_ID=""
          ARTIFACT_ID=""
          for run_id in $(gh api "repos/${{ github.repository }}/actions/workflows/inspect-ai-scheduled-tests.yml/runs?event=schedule&branch=$DEFAULT_BRANCH&status=success" \
            | jq -r --arg branch "$DEFAULT_BRANCH" \
              '.workflow_runs[] | select(.conclusion == "success" and .event == "schedule" and .head_branch == $branch) | .id' \
            | head -10); do

            echo "Checking run $run_id for artifacts..."
            artifact_id=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "last-inspect-ai-sha" and .expired == false) | .id] | max // empty' \
              | sort -n | tail -1)

            if [[ "$artifact_id" =~ ^[0-9]+$ ]]; then
              RUN_ID=$run_id
              ARTIFACT_ID=$artifact_id
              echo "Found run with artifact: $RUN_ID (artifact $ARTIFACT_ID)"
              break
            fi
          done

          if [ -n "$RUN_ID" ]; then
            # Create directory for artifact
            mkdir -p .last-inspect-ai-sha

            # Download that artifact by id from the actions repository (where this workflow runs)
            if gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > .last-inspect-ai-sha/artifact.zip \
               && unzip -o -q .last-inspect-ai-sha/artifact.zip last_sha.txt -d .last-inspect-ai-sha; then
              echo "Successfully downloaded artifact from run $RUN_ID"

              # Read the SHA immediately and store it as output (before checkout wipes it).
              # The content is only a step output if it is exactly a 40-hex SHA;
              # anything else is dropped without being echoed, so a crafted file
              # can neither add outputs nor reach a later shell.
              if [ -f ".last-inspect-ai-sha/last_sha.txt" ]; then
                last_sha=$(cat ".last-inspect-ai-sha/last_sha.txt")
                if [[ "$last_sha" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "last_sha=$last_sha" >> "$GITHUB_OUTPUT"
                  echo "Found previously tested commit: $last_sha (from run $RUN_ID)"
                else
                  echo "last_sha=" >> "$GITHUB_OUTPUT"
                  echo "Ignoring artifact from run $RUN_ID: last_sha.txt is not a 40-character hex SHA"
                fi
              else
                echo "last_sha=" >> "$GITHUB_OUTPUT"
                echo "Downloaded artifact but could not find last_sha.txt file"
              fi
            else
              echo "last_sha=" >> "$GITHUB_OUTPUT"
              echo "Artifact download failed for run $RUN_ID"
            fi
          else
            echo "last_sha=" >> "$GITHUB_OUTPUT"
            echo "No previous successful scheduled runs with artifacts found"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The schedule payload may not carry the repository object.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        continue-on-error: true

      # Fail before the checkout so an invalid ref gets this message rather
      # than a fetch error, and so the ref that later becomes a step output
      # (and a Slack payload field) can hold nothing but ref characters.
      - name: Validate inspect_ai_ref input
        env:
          INSPECT_AI_REF: ${{ inputs.inspect_ai_ref }}
        run: |
          if [ -n "$INSPECT_AI_REF" ] && { ! [[ "$INSPECT_AI_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$INSPECT_AI_REF" == -* || "$INSPECT_AI_REF" == *..* ]]; }; then
            echo "::error::inspect_ai_ref must be a branch, tag or commit: letters, digits and ._/- only, no leading '-' and no '..'"
            exit 1
          fi

      - name: Checkout inspect_ai repository
        uses: actions/checkout@v6
        with:
          repository: UKGovernmentBEIS/inspect_ai
          ref: ${{ inputs.inspect_ai_ref || '' }}
          fetch-depth: 0
          # Public repository, local git only from here on.
          persist-credentials: false

      - name: Get inspect_ai commit info
        id: inspect_commit
        env:
          INSPECT_AI_REF: ${{ inputs.inspect_ai_ref }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "ref=${INSPECT_AI_REF:-main}" >> "$GITHUB_OUTPUT"

      - name: Check if commit was already tested
        id: check_commit_artifact
        env:
          CURRENT_SHA: ${{ steps.inspect_commit.outputs.sha }}
          LAST_SHA: ${{ steps.download_artifact.outputs.last_sha }}
        run: |
          echo "Current commit: $CURRENT_SHA"

          if [ -n "$LAST_SHA" ]; then
            echo "Found previously tested commit: $LAST_SHA"
            if [ "$CURRENT_SHA" = "$LAST_SHA" ]; then
              echo "skip_tests=true" >> "$GITHUB_OUTPUT"
              echo "Commit $CURRENT_SHA was already tested successfully, skipping"
              exit 0
            else
              echo "Current commit $CURRENT_SHA differs from last tested commit $LAST_SHA"
            fi
          else
            echo "No previous artifact found or could not read commit SHA"
          fi
          echo "skip_tests=false" >> "$GITHUB_OUTPUT"
          echo "Proceeding with tests for commit $CURRENT_SHA"

      - name: Skip notification
        if: github.event_name == 'schedule' && (steps.check_commit_artifact.outputs.skip_tests == 'true')
        env:
          SHA: ${{ steps.inspect_commit.outputs.sha }}
        run: |
          echo "🔄 Skipping tests - no changes detected in inspect_ai repository"
          echo "Last tested commit: $SHA"
          echo "Current commit: $SHA"

  # The asyncio and trio passes are independent pytest invocations, so run
  # them as parallel matrix legs (previously sequential steps in one job,
  # roughly doubling wall-clock time). Both legs test the exact commit
  # resolved by check-commit.
  slow-tests:
    needs: check-commit
    if: needs.check-commit.outputs.skip_tests != 'true'
    # Larger GitHub-hosted runner (8-core / 32 GB / 300 GB SSD); the suite's
    # -n auto xdist parallelism and docker churn scale with cores.
    runs-on: slow_test_runner
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: asyncio
            pytest_flags: ""
            test_timeout: 900
          - mode: trio
            pytest_flags: "--runtrio"
            test_timeout: 1500

    steps:
      - name: Checkout inspect_ai repository
        uses: actions/checkout@v6
        with:
          repository: UKGovernmentBEIS/inspect_ai
          ref: ${{ needs.check-commit.outputs.sha }}
          fetch-depth: 0
          # The dependency closure and upstream's tests run in this tree; the
          # job token stays out of its .git/config (the `main` ref below and
          # the install-state check are local git).
          persist-credentials: false

      # Checking out a pinned SHA leaves a detached HEAD with no local `main`
      # branch. inspect_ai's sandbox-tools install-state check runs
      # `git diff main` to detect edits to sandbox-tools code and treats a
      # failure to resolve `main` as "edited", which resolves a `-dev` helper
      # binary that doesn't exist in CI (SandboxInjectionError in all
      # sandbox-tools tests). Recreate `main` at the tested commit's closest
      # ancestor on origin/main (the commit itself for scheduled runs) so the
      # check sees exactly the sandbox-tools changes the commit carries
      # relative to real main.
      - name: Create local main ref for inspect_ai install-state check
        run: git branch -f main "$(git merge-base HEAD origin/main)"

      # No pip cache (`cache:` on setup-python, actions/cache on ~/.cache/pip
      # or its wheels directory): see the header. The install below is a
      # fresh resolution on a fresh runner every time.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        # -e is required so that the tests can find dependent media files
        # that are not part of the package.
        run: |
          python -m pip install --upgrade pip
          # Install inspect_ai with development dependencies for testing
          pip install --only-binary=all -e ".[dev]"
          pip install pytest-timeout
          # Pre-install the test fixture extension package so inspect_ai's
          # ensure_test_package_installed() short-circuits instead of
          # pip-installing it mid-run on the xdist critical path (~9s).
          pip install --no-deps ./tests/test_package

      - name: Run slow tests (${{ matrix.mode }})
        timeout-minutes: 180
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTEST_ARGS: ${{ inputs.pytest_args }}

        run: |
          echo "Running ${{ matrix.mode }} slow tests..."
          # pytest_args reaches this step through env: and is split on
          # spaces into an array, so bash never parses it as syntax in a
          # step that holds the provider keys. The allowlist admits flags,
          # node ids and -k names but no quotes, so a -k expression with
          # spaces is not supported (use node ids or --deselect).
          allowed='^[A-Za-z0-9 _./=:,-]*$'
          if ! [[ "$PYTEST_ARGS" =~ $allowed ]]; then
            echo "::error::pytest_args may only contain letters, digits, spaces and _./=:,-"
            exit 1
          fi
          read -ra extra_args <<< "$PYTEST_ARGS"
          # --timeout-method=thread mirrors the main repo's CI test job
          # (build.yml). The suite is latency-bound (serial provider API
          # calls and docker container churn), not CPU-bound, so xdist
          # parallelism cuts wall-clock dramatically. -n logical (not auto):
          # with psutil installed, auto counts physical cores — 4 on this
          # hyperthreaded 8-vCPU runner — while logical uses all 8.
          pytest ${{ matrix.pytest_flags }} --runslow --runapi --ignore=tests/agent/test_agent_human.py -k "not test_mcp_sampling_fn" -n logical --timeout=${{ matrix.test_timeout }} --timeout-method=thread "${extra_args[@]}"

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker system prune -f
          docker volume prune -f

  # Static analysis (the CI-safe equivalent of inspect_ai's `make check`)
  # against a fresh dependency resolution. inspect_ai's own CI gates run
  # mypy/ruff via `uv run`, which syncs the env against uv.lock — so upstream
  # static analysis only ever validates the locked dependency versions. This
  # job installs with plain pip (the frontier resolution a new user would
  # get), where newer deps can break mypy — it reads installed packages'
  # types/stubs — in ways the locked gate never sees. Separate job rather
  # than a step in the asyncio/trio matrix so it runs once, not twice.
  # Mirrors inspect_ai's `make check` recipe, which mutates (`ruff check
  # --fix` auto-fixes, `ruff format` rewrites), swapped for the check-only
  # equivalents. If that recipe changes upstream, this job drifts; accepted
  # to keep the no-inspect_ai-changes constraint.
  static-analysis:
    needs: check-commit
    if: needs.check-commit.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout inspect_ai repository
        uses: actions/checkout@v6
        with:
          repository: UKGovernmentBEIS/inspect_ai
          ref: ${{ needs.check-commit.outputs.sha }}
          # All refs/commits so setuptools_scm sees tags (a shallow clone
          # yields a bogus 0.1.dev version that conflicts with inspect-scout's
          # inspect-ai>=… pin), but blob:none to skip historical file
          # contents — the full pack is ~400MB. Same pattern as inspect_ai's
          # own CI.
          fetch-depth: 0
          fetch-tags: true
          filter: "blob:none"
          # The dependency closure runs under mypy in this tree; no token in
          # its .git/config (setuptools_scm reads local tags).
          persist-credentials: false

      # No pip cache here either (see the header): this job runs the closure
      # under mypy, and a cache it saved afterwards would be restored by
      # slow-tests, which holds the provider keys.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=all -e ".[dev]"

      - name: Run ruff
        run: |
          ruff check
          ruff format --check

      - name: Run ruff (inspect_tool_support)
        working-directory: src/inspect_tool_support/src
        run: |
          ruff check
          ruff format --check

      - name: Run mypy
        run: mypy --exclude tests/test_package src tests

  # Once-per-run bookkeeping: record the tested SHA (so later scheduled runs
  # skip it) and post the Slack notification. Runs after both matrix legs
  # and the static-analysis job.
  report:
    needs: [check-commit, slow-tests, static-analysis]
    if: always() && needs.check-commit.result == 'success' && needs.check-commit.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    # actions: read for the artifact-name check below (this run's own
    # artifact list). The uploads use the runner's artifact service, not the
    # job token.
    permissions:
      contents: read
      actions: read

    steps:
      # This job is the only intended producer of `last-inspect-ai-sha` and
      # `triage-context`, but an artifact name is claimable by any job of the
      # run attempt, and slow-tests and static-analysis, which run third-party
      # code, finish before this job starts. Names are unique within an
      # attempt: actions/upload-artifact refuses a name that already exists
      # (409) unless `overwrite` is set, which it deliberately is not, while a
      # re-run is a new attempt and may upload the names again, so a run's
      # artifact list can legitimately hold one of each name per attempt
      # (@actions/artifact documents reruns as a source of same-named
      # artifacts). So the policy is per attempt: an artifact with one of
      # these names created since this attempt started can only be another
      # job's, and is refused as tampering before the upload would fail on
      # it; one created before this attempt started is a previous attempt's
      # and is noted, not refused. The consumers are fail-closed either way:
      # check-commit accepts `last-inspect-ai-sha` only from a run whose
      # conclusion is success, which this step's failure prevents, and takes
      # the newest of that name; triage accepts only the `triage-context`
      # artifact whose id and digest the step after the upload records in
      # this job's log. The Slack report below still goes out (always());
      # only the uploads are withheld.
      - name: Refuse an artifact name another job of this attempt took
        id: names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          UPLOAD_TESTED_SHA: ${{ needs.slow-tests.result == 'success' && needs.static-analysis.result == 'success' && github.event_name == 'schedule' }}
          UPLOAD_TRIAGE_CONTEXT: ${{ needs.slow-tests.result != 'success' || needs.static-analysis.result != 'success' }}
        run: |
          set -uo pipefail
          names=()
          [ "$UPLOAD_TESTED_SHA" != "true" ] || names+=(last-inspect-ai-sha)
          [ "$UPLOAD_TRIAGE_CONTEXT" != "true" ] || names+=(triage-context)
          if [ "${#names[@]}" = 0 ]; then
            echo "This run uploads no artifact."
            exit 0
          fi
          if ! existing=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
                            --jq '.artifacts[] | select(.expired == false) | "\(.name) \(.id) \(.created_at)"'); then
            echo "::error::Could not list this run's artifacts, so the artifact names cannot be checked; uploading nothing."
            exit 1
          fi
          # The current attempt's start (run_started_at is the latest
          # attempt's): an artifact created before it is a previous attempt's,
          # one created since was made during this attempt by a job that ran
          # before this one. Both timestamps are the API's, ISO 8601 UTC, so
          # they compare as strings.
          if ! started=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.run_started_at' 2>/dev/null) \
             || ! [[ "$started" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "::error::Could not read when attempt $RUN_ATTEMPT started, so an existing artifact cannot be told from a squat; uploading nothing."
            exit 1
          fi
          conflict=0
          for name in "${names[@]}"; do
            while read -r n id created; do
              [ "$n" = "$name" ] || continue
              if [[ "$created" < "$started" ]]; then
                echo "An artifact named $name (id $id, created $created) exists from before attempt $RUN_ATTEMPT started ($started): a previous attempt's. This attempt uploads its own; its consumer takes this job's recorded one, or the newest."
              else
                conflict=1
                echo "::error::An artifact named $name (id $id, created $created) already exists in this run, created during attempt $RUN_ATTEMPT (started $started) before this job ran. Only this job uploads that name, and the jobs before it execute third-party code (SECURITY.md), so treat this as tampering. The consumers ignore an artifact this job did not produce, and this job uploads nothing under that name."
              fi
            done <<<"$existing"
          done
          [ "$conflict" = 0 ] || exit 1
          echo "No job of attempt $RUN_ATTEMPT has taken the name(s) ${names[*]}."

      - name: Save tested inspect_ai SHA as artifact
        if: needs.slow-tests.result == 'success' && needs.static-analysis.result == 'success' && github.event_name == 'schedule'
        env:
          SHA: ${{ needs.check-commit.outputs.sha }}
        run: |
          mkdir -p .last-inspect-ai-sha
          echo "$SHA" > .last-inspect-ai-sha/last_sha.txt

      - name: Upload tested SHA artifact
        if: needs.slow-tests.result == 'success' && needs.static-analysis.result == 'success' && github.event_name == 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: last-inspect-ai-sha
          path: .last-inspect-ai-sha/last_sha.txt

      - name: Report test results to Slack
        id: slack_notification
        if: always() && needs.check-commit.outputs.ref == 'main' && needs.slow-tests.result != 'cancelled' && needs.static-analysis.result != 'cancelled'
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "${{ (needs.slow-tests.result == 'success' && needs.static-analysis.result == 'success') && '✅ Scheduled Tests Passed' || '🚨 Scheduled Tests Failed' }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ (needs.slow-tests.result == 'success' && needs.static-analysis.result == 'success') && '✅ Scheduled Tests Passed' || '🚨 Scheduled Tests Failed' }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Trigger:*\n${{ github.event_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Tested:*\n<https://github.com/UKGovernmentBEIS/inspect_ai/commit/${{ needs.check-commit.outputs.sha }}|inspect_ai@${{ needs.check-commit.outputs.ref }}#${{ needs.check-commit.outputs.short_sha }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Slow Tests:*\n${{ needs.slow-tests.result == 'success' && '✅' || '❌' }} ${{ needs.slow-tests.result }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Static Analysis:*\n${{ needs.static-analysis.result == 'success' && '✅' || '❌' }} ${{ needs.static-analysis.result }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ (needs.slow-tests.result != 'success' || needs.static-analysis.result != 'success') && '<!channel> The scheduled tests have failed. Please investigate.' || 'All tests and static analysis completed successfully! 🎉' }}"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Actor: ${{ github.actor }}"
                    }
                  ]
                }
              ]
            }

      - name: Upload Slack thread info for triage
        if: always() && steps.names.outcome == 'success' && (needs.slow-tests.result != 'success' || needs.static-analysis.result != 'success') && steps.slack_notification.outcome == 'success'
        env:
          CHANNEL: ${{ steps.slack_notification.outputs.channel_id || secrets.SLACK_CHANNEL_ID }}
          THREAD_TS: ${{ steps.slack_notification.outputs.ts }}
          SHA: ${{ needs.check-commit.outputs.sha }}
          REF: ${{ needs.check-commit.outputs.ref }}
        run: |
          mkdir -p .triage
          # jq builds the JSON so every value is a string, whatever it contains.
          jq -n --arg channel "$CHANNEL" --arg thread_ts "$THREAD_TS" --arg sha "$SHA" --arg ref "$REF" \
            '{channel: $channel, thread_ts: $thread_ts, inspect_ai_sha: $sha, inspect_ai_ref: $ref}' \
            > .triage/slack_thread.json

      - name: Upload triage artifact
        id: triage_context
        if: always() && steps.names.outcome == 'success' && (needs.slow-tests.result != 'success' || needs.static-analysis.result != 'success') && steps.slack_notification.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: triage-context
          path: .triage/slack_thread.json
          retention-days: 7

      # Triage's proof that this job produced the context: the id and digest
      # of the artifact the step above uploaded, on one line of this job's log,
      # which no other job of the run can write to. Triage
      # (triage-test-failures.yml, "Resolve the trusted triage context") finds
      # this job through the jobs API for the attempt it triages, reads the
      # line from the job's log, downloads that artifact id and checks the
      # digest of what it got; a same-named artifact with another id, or a
      # run whose report job wrote no line, gives it no context. The runner
      # echoes this script into the log too, with `$ARTIFACT_ID` unexpanded,
      # which the consumer's pattern (digits, 64 hex) does not match.
      - name: Record the triage-context artifact identity
        if: always() && steps.triage_context.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.triage_context.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.triage_context.outputs.artifact-digest }}
        run: |
          if ! [[ "$ARTIFACT_ID" =~ ^[0-9]+$ && "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::upload-artifact returned no artifact id and digest (id '$ARTIFACT_ID'); triage will run without this context."
            exit 1
          fi
          echo "triage-context-artifact id=$ARTIFACT_ID digest=sha256:$ARTIFACT_DIGEST"

  test-slack-access:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_slack_access }}
    runs-on: ubuntu-latest

    steps:
      - name: Test Slack Channel Access
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: |
              🧪 **Slack Integration Test**

              This is a test message to verify GitHub Actions can successfully post to this Slack channel.

              • Repository: ${{ github.repository }}
              • Branch: ${{ github.ref_name }}
              • Actor: ${{ github.actor }}
              • Run ID: ${{ github.run_id }}

              If you see this message, the integration is working correctly! ✅

      - name: Test Result
        run: |
          echo "✅ Slack channel access test completed successfully!"
          echo "Check your Slack channel for the test message."
