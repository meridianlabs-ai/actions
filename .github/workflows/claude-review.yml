# The read-only reviewer for this repo, on demand only: comment @review on a
# PR (or on an External-labeled issue) to run it. Auto-review on PR open /
# ready_for_review is deliberately OFF here (decision: Ransom, 2026-09-14,
# after #110 was reviewed unasked when marked ready) — the pull_request
# trigger that meridianlabs-ai/agents examples/claude-review-stub.yml ships with
# has been removed, together with its `if` clause. To restore auto-review,
# copy both back from that example.
# Independent of the dev agent (claude.yml) — different trigger, different
# (lower) permissions.
#
# Caveat: @review needs write access. The job's `if` skips other commenters
# cheaply (the author_association filter, below); the reusable's trig check
# is the authority, before checkout.

name: Review

on:
  issue_comment:
    types: [created]

jobs:
  review:
    # Run on a PR comment containing @review (works on drafts, and on fork
    # PRs when the commenter has write access — see the header), or on an
    # @review comment on an External-labeled issue. `@review` does not
    # collide with the dev agent's `@claude` trigger.
    # The two comment gates exclude the reviewer's own comments: reviewing
    # files that contain the trigger token makes it routine for the review
    # summary's prose to mention that token, which passes this cheap
    # substring gate and spawns a Review run whose newest-wins concurrency
    # CANCELS the very run that posted the summary, before it posts the
    # verdict marker; the loop then never engages (observed: agents#36
    # round 2, 2026-08-31 — a backticked mention; agents#20 round 2,
    # 2026-08-27 — a bare mention followed by '/'). The reusable's
    # word-boundary trig gate rejects both shapes, so the spawned run only
    # ever no-ops — but its concurrency entry does the damage the moment
    # the job starts, so it must not start at all. Hence two exclusions:
    # a backticked token (mirrors the word-boundary gate's deliberate
    # blindness to backticked mentions; deterministic) and the
    # claude-review-comment marker the reviewer is prompted to stamp on
    # every top-level comment it posts (covers bare non-word-boundary
    # mentions like agents#20's; prompt-driven). Cost: a comment carrying
    # either alongside a genuine bare trigger is wrongly skipped — rare,
    # recoverable by re-commenting the bare token alone.
    # author_association filter (OWNER/MEMBER/COLLABORATOR) on both arms: a
    # COST filter, not the gate (same shape as the `@auto` filter in
    # claude.yml, agents#93 / actions#108). On a public repo anyone can
    # comment `@review`; without this every such comment spun a runner that
    # receives MARVIN_TOKEN and a pull-requests: write token. It is not
    # authoritative — CONTRIBUTOR is anyone with a merged commit, and whether
    # org members show as MEMBER depends on org settings — so the reusable
    # workflow's trig check (a fail-closed permission lookup on the actor,
    # before checkout) remains the authority. A collaborator whose
    # association is reported looser than expected is dropped here silently;
    # the trig check would refuse them anyway. The loops' `@review` hand-back
    # still passes: marvin is a User with write access, so it reports
    # COLLABORATOR.
    if: >
      (github.event.issue.pull_request != null &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       contains(github.event.comment.body, '@review') &&
       !contains(github.event.comment.body, '`@review`') &&
       !contains(github.event.comment.body, '<!-- claude-review-comment -->')) ||
      (github.event.issue.pull_request == null &&
       contains(github.event.issue.labels.*.name, 'External') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       contains(github.event.comment.body, '@review') &&
       !contains(github.event.comment.body, '`@review`') &&
       !contains(github.event.comment.body, '<!-- claude-review-comment -->'))
    uses: meridianlabs-ai/agents/.github/workflows/claude-review.yml@main
    # Machine-account PAT for the deterministic ack/stage steps only (eyes
    # reaction + board stage); never handed to the review agent, which stays
    # read-only. Absent -> those steps no-op.
    secrets:
      MARVIN_TOKEN: ${{ secrets.MARVIN_TOKEN }}
      # codex engine (design/codex-engine.md in the agents repo):
      # consumed only on items labeled engine:codex; optional.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
