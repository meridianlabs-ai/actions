---
# Unit tests for the workflows' run: scripts and permission rules and for the
# slack-release-announce converter (tests/). The scripts are lifted from the
# workflow YAML and run under bash, so a change to a workflow is tested here
# before it runs against a real scheduled run. Every path a test covers must
# be listed below, or a change to it will not run its tests.
name: tests

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/claude.yml"
      - ".github/workflows/claude-review.yml"
      - ".github/workflows/claude-auto.yml"
      - ".github/workflows/inspect-ai-ci-perf.yml"
      - ".github/workflows/triage-test-failures.yml"
      - ".github/workflows/inspect-ai-scheduled-tests.yml"
      - ".github/workflows/inspect-swe-nightly-tests.yml"
      - ".github/workflows/docs-link-check.yml"
      - ".github/lychee.toml"
      - ".github/workflows/release-please-vscode.yml"
      - ".github/workflows/tests.yml"
      - ".github/workflows/keep-alive.yml"
      - ".github/workflows/pr-title-lint.yml"
      - ".github/workflows/release-please-python.yml"
      - "slack-release-announce/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/claude.yml"
      - ".github/workflows/claude-review.yml"
      - ".github/workflows/claude-auto.yml"
      - ".github/workflows/inspect-ai-ci-perf.yml"
      - ".github/workflows/triage-test-failures.yml"
      - ".github/workflows/inspect-ai-scheduled-tests.yml"
      - ".github/workflows/inspect-swe-nightly-tests.yml"
      - ".github/workflows/docs-link-check.yml"
      - ".github/lychee.toml"
      - ".github/workflows/release-please-vscode.yml"
      - ".github/workflows/tests.yml"
      - ".github/workflows/keep-alive.yml"
      - ".github/workflows/pr-title-lint.yml"
      - ".github/workflows/release-please-python.yml"
      - "slack-release-announce/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      # The VS Code release tests run the publish job's cross-check step against
      # vsce's own reader: install the vsce release-please-vscode.yml pins.
      - run: npm install -g --ignore-scripts @vscode/vsce@3.9.2
      # The docs link check tests run lychee against a local server: install
      # the release docs-link-check.yml pins, checked against its digest.
      - name: Install lychee
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o lychee.tar.gz https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  lychee.tar.gz" | sha256sum -c -
          tar -xzf lychee.tar.gz
          install -D lychee-x86_64-unknown-linux-gnu/lychee "$RUNNER_TEMP/lychee/bin/lychee"
          echo "$RUNNER_TEMP/lychee/bin" >> "$GITHUB_PATH"
      - run: python3 -m pytest -q tests
