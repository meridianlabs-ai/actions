---
# Triage of a failed scheduled inspect_ai test run, in two jobs with a runner
# boundary between them (the landing design in the agents repo,
# design/architecture.md → "Landing job"; this repo's issue #106).
#
# agent downloads the failed run's logs and its triage-context artifact (only
# the one the run's report job recorded in its own log, by id and digest: the
# run's test jobs execute third-party code and could otherwise supply a
# same-named artifact), validates the artifact's fields before using any of
# them, checks out UKGovernmentBEIS/inspect_ai at the tested commit and runs
# the Claude triage agent. The agent's input is test output, which any code the tests exercise
# can shape, and public fork issues, which anyone can write, so this job
# holds only the job token (read-only): no MARVIN_TOKEN, no Slack token, and
# not the Anthropic key either. The key (TRIAGE_ANTHROPIC_API_KEY, a key from
# a dedicated Anthropic Console workspace with a spend cap, separate from the
# ANTHROPIC_API_KEY the test suites run with) is held by two Unix users the
# agent is not: the model broker (.github/actions/model-broker) reads it into
# a process running as the model-broker user and forwards Messages API calls,
# and nothing else, to api.anthropic.com; the Claude triage agent runs as a
# third, unprivileged user (.github/actions/isolated-agent) whose whole
# process tree gets only the broker's per-run token as ANTHROPIC_API_KEY (good
# only for 127.0.0.1 while the broker is alive) and the broker as
# ANTHROPIC_BASE_URL. That agent cannot read the broker user's key file or
# memory, cannot read the runner process's memory or its .NET diagnostic
# socket (where the runner keeps every job secret for masking), cannot sudo or
# reach Docker, and gets none of the runner command files or OIDC request
# variables in its environment. So disclosing its token through a network
# request, an issue body or the Slack text yields nothing reusable, which is
# why the landing bodies are not screened for a key. Until the secret exists
# the broker step fails, and the land job reports the failed triage to the
# Slack thread.
#
# harden-runner blocks egress to every host but Anthropic (the broker's
# upstream), GitHub and the action's installer, so no tool the agent runs can
# reach a host of its choosing. It does NOT disable sudo/containers: that
# hardening runs in harden-runner's `pre` hook, before the broker start and
# the agent-user setup, both of which need sudo (review round 1, B1); the
# agent is powerless because it runs as an unprivileged user, not because the
# runner's sudo was removed. The allow-list does not stop an upload to an
# attacker's own github.com resource with a credential the attacker placed in
# the text the agent reads; what that can carry is what the agent can read,
# the read-only job token (this repository, expires with the job) and the
# triage inputs. The isolated-agent action runs its own isolation check as the
# agent user and fails the job before the agent if any of the boundary above
# does not hold. The agent's tools are reads plus file writes under the
# landing directory, and instead of creating issues, commenting or posting to
# Slack it describes those writes in a landing manifest, which emit-landing
# uploads as an artifact.
#
# land runs on a fresh runner the agent never had, with no checkout. The
# `land` composite validates the manifest and only then creates, comments
# on, reopens and assigns the fork's tracking issues as marvin — putting
# each issue it creates or adopts on Atlas at Todo by node ID — and posts
# the Slack message to the channel and thread the agent job validated
# (never to a destination the manifest names). The marvin identity (the
# app secrets MARVIN_APP_CLIENT_ID / MARVIN_APP_PRIVATE_KEY, the token they
# mint, and the MARVIN_TOKEN fallback) and the SLACK_* secrets appear in
# `land` only.
#
# The manifest's `slack` field, `issues[].assignees` / `issues[].reopen`,
# land's `slack-*` inputs and the Atlas Todo status came to the landing pair
# with meridianlabs-ai/agents#102 (merged 2026-09-15; `@main` has carried it
# since). A validator from before it refuses a manifest carrying `slack` or
# those issue fields, which is why tests/test_triage_workflow.py xfails its
# cross-check on such a TRIAGE_VALIDATOR_REF.
name: Triage Test Failures

"on":
  workflow_run:
    workflows: ["Inspect AI Scheduled Tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of a failed Inspect AI Scheduled Tests run to triage"
        required: true
        type: string

# Agent runs restore caches, never save them: the platform enforces this on
# every job's token (meridianlabs-ai/agents design/agent-cache-scope.md).
cache-mode: read

env:
  # Tracking issues are created in the meridianlabs-ai fork of inspect_ai,
  # not in this repo. The agent job only reads them (public repo, job
  # token); the land job writes them as marvin, with a token minted for
  # that one repository, and refuses any other repo.
  ISSUES_REPO: meridianlabs-ai/inspect_ai
  # Owner of every tracking issue: the board's working views filter on
  # assignee, so an unassigned issue is invisible (inspect_ai#444). Read by
  # the compose step (which sets it) and by the land job (whose validator
  # admits no other assignee), so the two cannot drift.
  ISSUE_ASSIGNEE: ransomr

jobs:
  # UNTRUSTED once the agent has run: job token only; the Anthropic key is
  # in the model broker, not in this job's environment.
  agent:
    # Only triage failed scheduled runs (not push/dev runs, not successes).
    # workflow_dispatch lets humans re-run triage against a specific run_id.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    # Matches the broker's lifetime-minutes below, so the job cannot outlive
    # its model access (a wedged agent would otherwise hold the runner for
    # GitHub's six-hour default with no model). Triage runs took 2 to 12
    # minutes over 47 runs, 2026-09-03 to 2026-09-22; 60 is a wide margin.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      # Validated in "Validate the triage context" below; the land job's
      # Slack destination comes from here, never from the manifest.
      channel: ${{ steps.context.outputs.channel }}
      thread_ts: ${{ steps.context.outputs.thread_ts }}

    env:
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      UPSTREAM_RUN_URL: ${{ github.event.workflow_run.html_url || format('https://github.com/{0}/actions/runs/{1}', github.repository, inputs.run_id) }}

    steps:
      # This repo's own code at the workflow's commit, for the local
      # model-broker and isolated-agent actions. The fetch is to github.com,
      # which the egress allow-list permits.
      - name: Check out the isolation actions
        uses: actions/checkout@v6
        with:
          path: actions-repo
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Start the model broker
        id: broker
        uses: ./actions-repo/.github/actions/model-broker
        with:
          api-key: ${{ secrets.TRIAGE_ANTHROPIC_API_KEY }}
          lifetime-minutes: "60"   # = the job's timeout-minutes above

      # Egress allow-list for the rest of the job. The endpoints are ci-perf's
      # observed set (inspect-ai-ci-perf.yml, "Egress") minus the Python
      # package indexes, which triage does not use: Anthropic for the broker,
      # GitHub for gh and the checkout, the action's Claude Code installer and
      # its npm install. GitHub Actions infrastructure (artifact downloads
      # included) is allowed without listing. A blocked call shows in the
      # harden-runner step summary and as a job annotation. sudo and containers
      # are deliberately NOT disabled: harden-runner does that in its `pre`
      # hook, which runs before the broker start and the agent-user setup, both
      # of which need sudo (review round 1, B1). The untrusted agent instead
      # runs as its own unprivileged user (the isolated-agent action), which
      # cannot alter the firewall or read another user's files as root.
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            api.github.com:443
            github.com:443
            claude.ai:443
            downloads.claude.ai:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      # Every read of the upstream run below is of one attempt, resolved here
      # once: the attempt whose completion fired this run, or, for a dispatch
      # that names a run, its latest. A triage that starts late or is re-run
      # after the upstream run gained another attempt would otherwise read
      # attempt 2's failures and installed packages (unqualified `gh run view`
      # serves the latest attempt) beside attempt 1's tested SHA and Slack
      # thread. The failed log, the run metadata, the failing run's install
      # log and the trusted context all take this value; the passing baseline
      # is a different run, selected on its own.
      - name: Resolve the upstream run attempt
        id: attempt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
        run: |
          set -uo pipefail
          attempt="$EVENT_ATTEMPT"
          if [ -z "$attempt" ]; then
            attempt=$(gh api "repos/$REPO/actions/runs/$UPSTREAM_RUN_ID" --jq '.run_attempt' 2>/dev/null || true)
          fi
          if ! [[ "$attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Could not resolve the attempt of run $UPSTREAM_RUN_ID to triage (got '$attempt')."
            exit 1
          fi
          { echo "attempt<<EOF"; echo "$attempt"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "Triaging attempt $attempt of run $UPSTREAM_RUN_ID"

      - name: Download failed logs from upstream run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          UPSTREAM_RUN_ATTEMPT: ${{ steps.attempt.outputs.attempt }}
        run: |
          mkdir -p triage
          echo "Fetching logs for run $UPSTREAM_RUN_ID attempt $UPSTREAM_RUN_ATTEMPT"
          gh run view "$UPSTREAM_RUN_ID" --attempt "$UPSTREAM_RUN_ATTEMPT" \
            --repo "$REPO" \
            --log-failed > triage/failed.log 2>&1 || echo "No failed-step logs available"
          gh run view "$UPSTREAM_RUN_ID" --attempt "$UPSTREAM_RUN_ATTEMPT" \
            --repo "$REPO" \
            --json jobs,conclusion,displayTitle,headBranch,headSha,url,createdAt \
            > triage/run.json
          # Truncate very long logs so we fit in the context window.
          # Keep the last 2MB — failures are almost always near the end.
          if [ -f triage/failed.log ]; then
            size=$(wc -c < triage/failed.log)
            if [ "$size" -gt 2000000 ]; then
              echo "Log is $size bytes; truncating to last 2MB"
              tail -c 2000000 triage/failed.log > triage/failed.log.trimmed
              mv triage/failed.log.trimmed triage/failed.log
            fi
          fi

      # The triage-context artifact is trusted for who produced it, not for
      # its name. A run's artifact namespace is shared by all its jobs, and
      # the scheduled run's slow-tests and static-analysis jobs execute
      # third-party code (the day's dependency closure, upstream's tests)
      # before the report job uploads: a process there can create an artifact
      # named triage-context with a channel, thread and SHA of its choosing,
      # after which the report job's own upload in that attempt fails on the
      # name conflict (a later attempt may upload the name again).
      # The run-level gate above (a failed scheduled run) does not see that,
      # and shape checks on the fields do not either. So this step downloads
      # nothing by name. It finds the report job of the attempt being triaged
      # through the jobs API, requires its upload step to have succeeded,
      # reads from that job's log (which no other job can write to) the
      # artifact id and digest the report job recorded for what it uploaded
      # (inspect-ai-scheduled-tests.yml, "Record the triage-context artifact
      # identity"), checks that id against the run's artifact list and the
      # downloaded bytes against the digest, and only then extracts
      # slack_thread.json for the validation step below. Anything short of
      # that is "no context": default Slack destination, inspect_ai main,
      # exact=false. A report job whose upload step failed is reported as a
      # possible squat; a same-named artifact with another id is named and
      # ignored. The attempt matters: a re-run has its own report job and its
      # own log, and the run's artifact list spans attempts (each attempt may
      # upload the name again).
      - name: Resolve the trusted triage context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # The attempt every other read of the upstream run uses (resolved above).
          UPSTREAM_RUN_ATTEMPT: ${{ steps.attempt.outputs.attempt }}
        run: |
          set -uo pipefail
          mkdir -p triage
          none() {
            echo "$1"
            echo "No trusted triage context: triage posts to the default Slack destination and investigates inspect_ai main (exact=false)."
            exit 0
          }
          attempt="$UPSTREAM_RUN_ATTEMPT"
          [[ "$attempt" =~ ^[1-9][0-9]*$ ]] || none "No resolved attempt for run $UPSTREAM_RUN_ID (got '$attempt')."
          # The producer: exactly one job named report in that attempt, whose
          # upload step succeeded.
          if ! raw=$(gh api --paginate "repos/$REPO/actions/runs/$UPSTREAM_RUN_ID/attempts/$attempt/jobs?per_page=100" \
                       --jq '.jobs[] | select(.name == "report")
                             | {id, conclusion, upload: ([.steps[]? | select(.name == "Upload triage artifact") | .conclusion][0] // "absent")}' 2>/dev/null); then
            none "Could not list the jobs of attempt $attempt of run $UPSTREAM_RUN_ID."
          fi
          jobs=$(jq -sc '.' <<<"$raw")
          count=$(jq -r 'length' <<<"$jobs")
          [ "$count" = "1" ] || none "Attempt $attempt of run $UPSTREAM_RUN_ID has $count jobs named report; the context needs exactly one producer."
          job_id=$(jq -r '.[0].id' <<<"$jobs")
          upload=$(jq -r '.[0].upload' <<<"$jobs")
          [[ "$job_id" =~ ^[0-9]+$ ]] || none "The report job of attempt $attempt has no numeric id."
          case "$upload" in
            success) ;;
            skipped | absent)
              none "The report job (attempt $attempt) uploaded no triage context (upload step: $upload): the run passed, or its Slack notification failed." ;;
            *)
              echo "::warning::The report job's triage-context upload ended '$upload' in attempt $attempt of run $UPSTREAM_RUN_ID. If that was a name conflict, a job that ran third-party code created an artifact named triage-context before the report job could; that artifact is not the report job's and is ignored (SECURITY.md)."
              none "The report job's upload did not succeed." ;;
          esac
          # What the report job says it uploaded, from its own log.
          if ! log=$(gh api "repos/$REPO/actions/jobs/$job_id/logs" 2>/dev/null); then
            none "Could not read the log of report job $job_id."
          fi
          recorded=$(tr -d '\r' <<<"$log" | grep -E '^[^ ]+ triage-context-artifact id=[0-9]+ digest=sha256:[0-9a-f]{64}$' \
                     | sed -E 's/^[^ ]+ //' | sort -u || true)
          lines=$(grep -c . <<<"$recorded" || true)
          [ "$lines" = "1" ] || none "The report job's log (job $job_id) records $lines triage-context artifact identities; exactly one is needed."
          id=$(sed -E 's/^triage-context-artifact id=([0-9]+) .*/\1/' <<<"$recorded")
          digest=$(sed -E 's/.* digest=(sha256:[0-9a-f]{64})$/\1/' <<<"$recorded")
          # That id must be in the run's artifact list, unexpired, under the
          # expected name and with the recorded digest.
          if ! raw=$(gh api --paginate "repos/$REPO/actions/runs/$UPSTREAM_RUN_ID/artifacts?per_page=100" \
                       --jq '.artifacts[] | {id, name, digest, expired}' 2>/dev/null); then
            none "Could not list the artifacts of run $UPSTREAM_RUN_ID."
          fi
          artifacts=$(jq -sc '.' <<<"$raw")
          match=$(jq -c --argjson id "$id" '[.[] | select(.id == $id)]' <<<"$artifacts")
          [ "$(jq -r 'length' <<<"$match")" = "1" ] || none "Artifact $id, which the report job recorded, is no longer in run $UPSTREAM_RUN_ID (deleted or replaced); no other artifact is trusted."
          jq -e --arg d "$digest" '.[0].name == "triage-context" and .[0].expired == false and .[0].digest == $d' <<<"$match" >/dev/null \
            || none "Artifact $id is not the unexpired triage-context artifact with digest $digest that the report job recorded; ignoring it."
          others=$(jq -r --argjson id "$id" '[.[] | select(.name == "triage-context" and .id != $id) | .id] | join(", ")' <<<"$artifacts")
          [ -z "$others" ] || echo "::warning::Run $UPSTREAM_RUN_ID also carries triage-context artifact(s) $others that the report job of attempt $attempt did not produce (another job of the run, or a previous attempt); ignored."
          zip=triage/triage-context.zip
          gh api "repos/$REPO/actions/artifacts/$id/zip" > "$zip" 2>/dev/null || { rm -f "$zip"; none "Could not download artifact $id."; }
          actual="sha256:$(shasum -a 256 "$zip" | cut -d' ' -f1)"
          [ "$actual" = "$digest" ] || { rm -f "$zip"; none "Downloaded artifact $id has digest $actual, not the $digest the report job recorded; ignoring it."; }
          unzip -o -q "$zip" slack_thread.json -d triage || { rm -f triage/slack_thread.json; none "Artifact $id holds no slack_thread.json."; }
          echo "Trusted triage context: artifact $id ($digest), uploaded by report job $job_id in attempt $attempt of run $UPSTREAM_RUN_ID."

      # Dependency versions float in the scheduled tests (`pip install -e
      # ".[dev]"` resolves against PyPI on the day, not inspect_ai's uv.lock),
      # so a failure with no relevant inspect_ai commit is often a package
      # release (inspect_ai#499: openai 3.14.0 -> 3.14.1). `--log-failed`
      # holds only the failed steps, so the install step's `Successfully
      # installed ...` line is not in failed.log: take it from the full log of
      # the failed run and of the last scheduled run before it that passed and
      # installed (a run that skipped an already-tested commit is green with
      # no install; a real pass uploads `last-inspect-ai-sha`), record that
      # run's tested inspect_ai SHA, and diff the two package sets so the
      # agent reads a table rather than comparing two 300-package lines. Log
      # text is data: grepped and written to files, never evaluated; the SHA
      # is kept only when it is 40 hex.
      - name: Collect installed package versions (failed run and last passing run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TESTS_WORKFLOW: Inspect AI Scheduled Tests
          # The failed run is read at the attempt being triaged; a passing
          # run's latest attempt is the one that passed.
          UPSTREAM_RUN_ATTEMPT: ${{ steps.attempt.outputs.attempt }}
        run: |
          set -uo pipefail
          export LC_ALL=C
          dir=triage/versions
          mkdir -p "$dir"
          # The `Successfully installed ...` lines of a run's full log (job name
          # first), into $2; further arguments go to `gh run view` (`--attempt N`).
          installed() {
            local run=$1 out=$2
            shift 2
            gh run view "$run" --repo "$REPO" "$@" --log 2>/dev/null | grep -F "Successfully installed" > "$out" || true
            [ -s "$out" ]
          }
          # name<TAB>version per package named on those lines (the version follows the last `-`).
          packages() {
            sed 's/.*Successfully installed //' "$1" | tr ' ' '\n' | sed -E 's/^(.+)-([^-]+)$/\1\t\2/' | sort -u
          }
          installed "$UPSTREAM_RUN_ID" "$dir/failing.txt" --attempt "$UPSTREAM_RUN_ATTEMPT" \
            || echo "No install log found for the failed run $UPSTREAM_RUN_ID" > "$dir/failing.txt"
          created=$(jq -r 'if type == "object" and (.createdAt | type) == "string" then .createdAt else "" end' triage/run.json 2>/dev/null || true)
          passing=""; passing_at=""; passing_sha=""
          # Only runs before the failed one (`--created` puts the cutoff in the query,
          # so a re-triage of an old failure is not crowded out by newer successes;
          # the jq check repeats it), newest first by our own sort: the runs API has
          # returned pages out of order.
          candidates=$(gh run list --repo "$REPO" --workflow "$TESTS_WORKFLOW" --event schedule --status success \
                         --created "<${created:-1970-01-01T00:00:00Z}" --limit 40 --json databaseId,createdAt 2>/dev/null \
                       | jq -r --arg t "$created" '[.[] | select((.databaseId | type) == "number" and (.createdAt | type) == "string" and .createdAt < $t)]
                                                   | sort_by(.createdAt) | reverse | .[0:20][] | "\(.databaseId) \(.createdAt)"' 2>/dev/null || true)
          while read -r id at; do
            [ -n "$id" ] || continue
            rm -rf "$dir/artifact"
            gh run download "$id" --repo "$REPO" --name last-inspect-ai-sha --dir "$dir/artifact" 2>/dev/null || continue
            installed "$id" "$dir/passing.txt" || continue
            passing="$id"; passing_at="$at"
            sha=$(tr -d '[:space:]' < "$dir/artifact/last_sha.txt" 2>/dev/null || true)
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && passing_sha="$sha"
            break
          done <<<"$candidates"
          rm -rf "$dir/artifact"
          if [ -n "$passing" ]; then
            jq -n --arg id "$passing" --arg at "$passing_at" --arg repo "$REPO" --arg sha "$passing_sha" \
              '{run_id: ($id | tonumber), url: "https://github.com/\($repo)/actions/runs/\($id)", created_at: $at, inspect_ai_sha: $sha}' \
              > "$dir/passing-run.json"
            if grep -qF "Successfully installed" "$dir/failing.txt"; then
              {
                printf 'package\tpassing run %s\tfailing run %s\n' "$passing" "$UPSTREAM_RUN_ID"
                # Every distinct version a run installed is kept: jobs that disagree
                # show as `a|b`, never as whichever job happened to sort last.
                awk -F'\t' 'FILENAME == ARGV[1] { p[$1] = ($1 in p) ? p[$1] "|" $2 : $2; next } { f[$1] = ($1 in f) ? f[$1] "|" $2 : $2 }
                  END { for (k in p) if (!(k in f)) print k "\t" p[k] "\t(absent)"
                        for (k in f) if (!(k in p)) print k "\t(absent)\t" f[k]; else if (p[k] != f[k]) print k "\t" p[k] "\t" f[k] }' \
                  <(packages "$dir/passing.txt") <(packages "$dir/failing.txt") | sort
              } > "$dir/diff.txt"
              echo "Installed-version diff against passing run $passing: $(($(wc -l < "$dir/diff.txt") - 1)) package(s) differ"
            else
              echo "No install log for the failed run, so no version diff" > "$dir/diff.txt"
            fi
          else
            echo "No passing scheduled run with an install log found before this one" | tee "$dir/passing.txt" > "$dir/diff.txt"
            echo '{}' > "$dir/passing-run.json"
          fi

      # Every field of the artifact is data until it matches its shape:
      # inspect_ai_sha becomes a checkout ref, channel and thread_ts select
      # the Slack destination, and all three become step outputs. A value
      # that fails its check is dropped (the SHA falls back to main with
      # exact=false). Outputs are written with heredoc delimiters, never
      # `echo "key=$value"`, so a newline in a value cannot add an output.
      # triage/slack_thread.json exists only when the step above proved the
      # report job produced it; this step checks shape, not provenance.
      - name: Validate the triage context
        id: context
        run: |
          set -uo pipefail
          sha=""; channel=""; thread_ts=""
          # Only the slack_thread.json artifact carries the inspect_ai SHA.
          # run.json.headSha is the *actions* repo SHA and must not be used.
          if [ -f triage/slack_thread.json ]; then
            field() {
              jq -r --arg k "$1" 'if type == "object" and (.[$k] | type) == "string" then .[$k] else "" end' \
                triage/slack_thread.json 2>/dev/null || true
            }
            sha=$(field inspect_ai_sha)
            channel=$(field channel)
            thread_ts=$(field thread_ts)
          fi
          if [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            exact="true"
          else
            if [ -n "$sha" ]; then
              echo "::warning::triage-context inspect_ai_sha is not a 40-hex SHA; ignoring it."
            else
              echo "No tested inspect_ai SHA available."
            fi
            echo "Falling back to main (not the exact tested commit)."
            sha="main"
            exact="false"
          fi
          if ! [[ "$channel" =~ ^[CG][A-Z0-9]{8,}$ ]]; then
            [ -z "$channel" ] || echo "::warning::triage-context channel is not a Slack channel ID; ignoring it."
            channel=""
          fi
          if ! [[ "$thread_ts" =~ ^[0-9]+\.[0-9]+$ ]]; then
            [ -z "$thread_ts" ] || echo "::warning::triage-context thread_ts is not a Slack timestamp; ignoring it."
            thread_ts=""
          fi
          {
            echo "sha<<EOF"; echo "$sha"; echo "EOF"
            echo "exact<<EOF"; echo "$exact"; echo "EOF"
            echo "channel<<EOF"; echo "$channel"; echo "EOF"
            echo "thread_ts<<EOF"; echo "$thread_ts"; echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Triaging against inspect_ai@$sha (exact tested commit: $exact); Slack channel '${channel:-<default>}' thread '${thread_ts:-<root>}'"

      - name: Checkout inspect_ai at tested commit
        uses: actions/checkout@v6
        with:
          repository: UKGovernmentBEIS/inspect_ai
          ref: ${{ steps.context.outputs.sha }}
          path: inspect_ai
          fetch-depth: 0
          # The agent never fetches or pushes; leave no token in .git/config.
          persist-credentials: false

      # The commit the agent investigates — emit-landing's start-sha (the
      # agent commits nothing, so head_sha equals it) — and the landing
      # directory the agent writes its manifest and body files into, created
      # here so it exists, runner-owned, before the agent starts.
      - name: Record the checked-out SHA and prepare the landing directory
        id: base
        env:
          LANDING_DIR: ${{ runner.temp }}/landing
        run: |
          set -euo pipefail
          sha=$(git -C inspect_ai rev-parse HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not read the inspect_ai HEAD"; exit 1; }
          { echo "sha<<EOF"; echo "$sha"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          mkdir -p "$LANDING_DIR"
          echo "inspect_ai checkout is at $sha; landing directory $LANDING_DIR"

      # No MARVIN_TOKEN, no Slack env, no Anthropic key: the agent needs only
      # reads — fork issues (public) and this run's own data via the job
      # token — file writes under the landing directory, and the model
      # broker on loopback (ANTHROPIC_BASE_URL; its per-run token is the
      # anthropic_api_key, which the action passes to Claude Code as
      # ANTHROPIC_API_KEY). The job token is passed as github_token so the
      # action skips its App-token exchange: the App token would carry
      # contents/issues/pull-requests WRITE on this repo, the job token is
      # contents:read + actions:read.
      #
      # Tools: the allow list is reads plus Edit (which governs Write too)
      # under the landing directory, given as an absolute-path rule (`//`
      # prefix). git runs as `git -C inspect_ai <verb>` (the clone is a
      # subdirectory and `cd` is not granted; Bash rules match each
      # subcommand of a compound command on its own). No `sed -n`: sed's `w`
      # command writes a file and no pattern denies it without also denying
      # `/warning/p`; the Read tool's offset/limit covers line ranges. The
      # deny list closes the gh verbs and the gh-api flags that write, git's
      # `--output` (log and show write a file with it), curl/wget (the old
      # Slack channel), and the gh options that pick a host (`--hostname`),
      # add a header (`-H`, `--header`) or attach a field in its `-f=`/`-F=`
      # spelling; deny beats allow. These rules are tool hygiene, not the
      # boundary: gh's `--repo HOST/OWNER/REPO` and pflag's joined `-Fk=v`
      # have no glob that does not also match legitimate searches, and what
      # stops a request to a host of the agent's choosing is harden-runner's
      # egress allow-list, while what makes the request worthless is that
      # the agent holds no reusable credential to put in it.
      # tests/test_triage_workflow.py checks these rules against the write
      # vectors named here. Guard rails: the boundary is that nothing in this
      # job can write as marvin or reach Slack — the land job does both, from
      # the validated manifest.
      #
      # A Bash allow rule is one check, not the whole decision. Claude Code
      # checks the target of an output redirect (`>`, `>>`, `2>` and the
      # other forms) separately, against the file-write rules — the Edit
      # allow and deny rules, its protected paths and the working
      # directories — as if the agent had written that file itself, so
      # `Bash(grep *)` allows grep and not `grep ... >> <a path outside
      # landing>`; in a headless run a target that would prompt is refused
      # (https://code.claude.com/docs/en/permissions#redirections). This is
      # the CLI's own permission engine, not an OS sandbox: it does not
      # reach what an allowed program writes through its own options (hence
      # the `git *--output*` deny), and it is a property of the Claude Code
      # release the action installs — the revision `@v1` resolves to pins
      # one internally, and the tag moves. The rule matcher in
      # tests/test_triage_workflow.py approximates only the Bash-pattern
      # step of this decision; SECURITY.md → "Verification notes" records
      # which releases were checked against these settings and when to
      # recheck.
      #
      # The whole Claude process runs as a dedicated unprivileged user (the
      # isolated-agent action), pointed at the broker on loopback with its
      # per-run token; the reusable key is never in this agent's environment,
      # files or reachable processes (not the broker's, not the runner's .NET
      # worker). The action's isolation check fails the job before the agent if
      # that does not hold. `conclusion` (success/failure) is read by the
      # compose step below. write-dir is the landing directory the agent writes
      # its manifest and body files into.
      - name: Run Claude triage agent
        id: claude
        uses: ./actions-repo/.github/actions/isolated-agent
        with:
          base-url: ${{ steps.broker.outputs.base-url }}
          token: ${{ steps.broker.outputs.token }}
          github-token: ${{ github.token }}
          write-dir: ${{ runner.temp }}/landing
          # `opus` is the Claude Code alias for the Opus family; Claude Code
          # resolves it to that family's latest release, so triage follows new
          # models without a PR per release. Default reasoning effort on
          # purpose: no effort flag.
          claude-args: "--model opus"
          settings: |
            {
              "permissions": {
                "allow": [
                  "Read", "Grep", "Glob",
                  "Read(/${{ runner.temp }}/landing/**)",
                  "Edit(/${{ runner.temp }}/landing/**)",
                  "Bash(gh issue list *)", "Bash(gh issue view *)",
                  "Bash(gh run view *)", "Bash(gh api repos/*)",
                  "Bash(git -C inspect_ai log *)", "Bash(git -C inspect_ai show *)", "Bash(git -C inspect_ai blame *)",
                  "Bash(grep *)"
                ],
                "deny": [
                  "Bash(gh issue create *)", "Bash(gh issue comment *)",
                  "Bash(gh issue edit *)", "Bash(gh issue reopen *)", "Bash(gh issue close *)",
                  "Bash(gh api *-X*)", "Bash(gh api *--method*)", "Bash(gh api *--input*)",
                  "Bash(gh api *-f *)", "Bash(gh api *-F *)", "Bash(gh api *--field*)", "Bash(gh api *--raw-field*)",
                  "Bash(gh api *-f=*)", "Bash(gh api *-F=*)",
                  "Bash(gh api *-H *)", "Bash(gh api *--header*)", "Bash(gh *--hostname*)",
                  "Bash(git *--output*)",
                  "Bash(curl *)", "Bash(wget *)"
                ]
              }
            }
          prompt: |
            You are triaging a failed scheduled test run for UKGovernmentBEIS/inspect_ai.

            # Available context (all paths relative to the workspace root)
            - `triage/failed.log` — output of failed pytest steps (may be truncated to last 2MB)
            - `triage/run.json` — metadata for the failed GitHub Actions run
            - `triage/versions/failing.txt` — the `Successfully installed ...` lines from
              the failed run's install steps (one per job; the job name comes first)
            - `triage/versions/passing.txt` and `triage/versions/passing-run.json` — the
              same lines from the last scheduled run before this one that passed, and
              that run's id, URL, `created_at` and tested inspect_ai SHA (`inspect_ai_sha`,
              empty when unknown; `{}` and a one-line note when no passing run was found)
            - `triage/versions/diff.txt` — the packages whose installed version differs
              between those two runs (tab-separated: package, passing run, failing run;
              `(absent)` when a package is in only one; `a|b` when a run's jobs
              installed different versions — then read `failing.txt` for the failed
              job's own line), or a one-line note when a side is missing
            - `inspect_ai/` — read-only clone of UKGovernmentBEIS/inspect_ai at the exact
              commit that was tested. Investigate here; do NOT modify, push or open PRs.

            Upstream run: ${{ env.UPSTREAM_RUN_URL }}
            inspect_ai checkout: ${{ steps.base.outputs.sha }}
            inspect_ai checkout is exact tested commit: ${{ steps.context.outputs.exact }}
            This (triage) repo: ${{ github.repository }}
            Issues repo (where all tracking issues live): ${{ env.ISSUES_REPO }}
            Landing directory (the ONLY place you may write): ${{ runner.temp }}/landing

            # How your actions reach GitHub and Slack
            You hold no credential that can create or comment on issues or post to
            Slack, and your tools are limited to reads plus files under the landing
            directory: the Read, Grep and Glob tools, `gh issue list/view`, `gh run
            view`, `gh api repos/...` (reads), `git -C inspect_ai log/show/blame`, and
            `grep`. Nothing else runs (no `cd`, pipes into other commands, `head`,
            `jq`, `sed`); use the Read tool for line ranges and JSON files. Do NOT try
            `gh issue create`, `gh issue comment`, `gh issue edit`, `gh issue reopen`
            or curl — they are denied, and the runner's network reaches only GitHub.
            Instead, describe the
            writes you want in a landing manifest; after your run ends, a separate job
            validates it and performs exactly those writes as the machine account.

            Write `${{ runner.temp }}/landing/manifest-extra.json`: ONE JSON object
            with at most these two keys and nothing else:
            - `issues`: an array with AT MOST ONE entry, either
              - a new tracking issue: `{"title": "Triage: <short summary>",
                "body_file": "issue.md"}`. It is assigned to `ransomr` and put on the
                Atlas board for you; do not add other assignees, and do not add
                labels: no label you name lands (see below).
              - a comment on an existing issue: `{"comment_on": <issue number>,
                "body_file": "comment.md", "reopen": true, "assignees": ["ransomr"]}`
                — `reopen` only when the issue is closed (a regression), `assignees`
                only when the issue has no assignee (the landing job adds the owner
                only to an unowned issue, and puts a reopened or newly owned issue on
                the board); omit both otherwise.
              Every entry targets ${{ env.ISSUES_REPO }}; the landing job refuses any
              other repo, drops every label and every assignee other than `ransomr`,
              and lands only the first entry. Labels are not yours to give: the fork
              reacts to some of them (`auto` starts an autonomous coding agent), and
              whether an issue you describe is handed to automation is a decision the
              maintainer takes after reading it, not one this run can make.
            - `slack`: `{"text_file": "slack.txt"}` — the reply to post in the Slack
              thread of the failed run's notification (the landing job knows the
              channel and thread; you do not choose them). Plain text with Slack
              mrkdwn, one message. When the manifest also creates a tracking issue,
              the landing job appends that issue's link to your text — do not invent
              one.
            Body files live in the landing directory next to the manifest and are
            referenced by file name only (letters, digits, `.`, `_`, `-`; not starting
            with a dot; under 64 KiB). Create the manifest with the Write tool and
            rewrite it whole when you change it, so it is valid JSON when your turn
            ends — an unparsable file lands nothing. Write nothing anywhere else.

            # Procedure overview
            1. Compute three pre-classification values: `EXISTING_ISSUE`,
               `ALREADY_FIXED_ON_MAIN` and `DEPENDENCY_CHANGES`.
            2. Classify the failure into one bucket — A, B, C, or D — picking the first
               that applies.
            3. Write the manifest and body files for that bucket.
            4. Stop (take no further actions).

            You do NOT have write access to inspect_ai — a human reads the tracking
            issue you describe and decides how its fix is made (by hand, or by handing
            the issue to the autonomous coding agent). Nothing you write commissions
            that agent.

            # Think carefully
            This triage has real downstream consequences: issues on the tracking repo,
            notifications to a team Slack channel, and humans deciding where to spend
            investigation time based on your output. Take the time to reason through
            the evidence thoroughly before classifying:

            - Before claiming Bucket A, verify the specific commit on main that fixes
              the issue — don't infer from commit titles alone; check the diff touches
              the relevant file/symbol.
            - Before claiming Bucket B, check that the error really is upstream (a 5xx
              from the provider) and not an inspect_ai bug that happens to surface as
              a request failure.
            - Before claiming Bucket C, walk through the failing test once more and
              confirm your proposed fix would actually make it pass — don't just pattern-
              match on the error message.
            - Before claiming Bucket D, consider whether more investigation would
              promote this to C; it's fine to still pick D, but document what you tried.

            A wrong classification is more costly than a slower one. Err toward more
            thinking, not less.

            # Pre-classification lookups

            ## EXISTING_ISSUE — existing tracking issue for this failure
            The same test can fail repeatedly until a fix lands; we never want multiple
            open issues for the same failure.

            1. Extract the failing test node id(s) from `triage/failed.log` (e.g.
               `tests/foo/test_bar.py::test_baz`). Use the most specific identifier you can.
            2. Search for existing tracking issues in the issues repo:
                 gh issue list --repo ${{ env.ISSUES_REPO }} --state all \
                   --search "Triage <test-name-or-key-fragment> in:title,body" --limit 20
               Try the full node id, then the test name alone, then the module. Also scan
               recent `Triage:` issues regardless of state. `gh issue view` shows one.
            3. Set `EXISTING_ISSUE`:
               - **Open issue matches** → record its number and URL.
               - **Closed issue matches, closed within the last 30 days** → record its
                 number and URL; treat as a regression (you'll set `reopen` when
                 commenting).
               - **Closed >30 days ago, OR no match** → `EXISTING_ISSUE` is empty.

            ## ALREADY_FIXED_ON_MAIN — has main already moved past this bug?
            If `inspect_ai checkout is exact tested commit` is `false`, skip this check
            entirely and set `ALREADY_FIXED_ON_MAIN = false` (you have no "since tested
            SHA" range to diff against).

            Otherwise, check whether inspect_ai main has moved past the tested commit in
            a way that likely fixes the failure. The `inspect_ai/` clone has all history;
            `origin/main` refs the current main. Run git with `-C inspect_ai` (you cannot
            `cd`):

              git -C inspect_ai log --oneline -50 ${{ steps.base.outputs.sha }}..origin/main

            If there are commits since the tested SHA:
              - Identify the files implicated in the failure (from `triage/failed.log`).
              - Run `git -C inspect_ai log --oneline ${{ steps.base.outputs.sha }}..origin/main -- <file>`
                for each to see whether those files have been modified on main.
              - Skim commit messages on main for keywords matching the failure (test name,
                error message substring, module involved); `git -C inspect_ai show <sha>`
                for a commit's diff.

            Set `ALREADY_FIXED_ON_MAIN = true` only with specific evidence: file + commit
            + plausible mechanism. If evidence is weak, set it to false and mention the
            uncertainty in the issue body (if one is created).

            ## DEPENDENCY_CHANGES — did a package release land, not an inspect_ai commit?
            Dependency versions float in the tested job: it installs inspect_ai with
            `pip install -e ".[dev]"`, so every third-party package is whatever PyPI
            served that day, NOT the version pinned in `inspect_ai/uv.lock`. A failure
            that appears with no relevant inspect_ai commit is therefore often a
            dependency release: inspect_ai#499 spent five comments on a correct
            mechanism analysis and never noticed that the only difference between the
            last passing run and the first failing run was openai 3.14.0 -> 3.14.1,
            a release that stopped wrapping non-httpx exceptions and unmasked a latent
            bug. Do this lookup before concluding that the cause is in inspect_ai.

            1. From the traceback in `triage/failed.log`, list the third-party packages
               implicated (every non-inspect_ai module in the stack, plus the package
               whose exception type or API is involved).
            2. Read `triage/versions/failing.txt` for the versions the failed run
               installed (the job that failed matters most; the jobs normally agree).
               For each implicated package, find the locked version in
               `inspect_ai/uv.lock` — for example
                 grep -n -A1 '^name = "openai"$' inspect_ai/uv.lock
               (the `version = "..."` line follows) — and note where installed and
               locked differ.
            3. Read `triage/versions/diff.txt`: it is the diff of installed versions
               between the last passing scheduled run and this one (or a note saying
               why there is none). Read `triage/versions/passing-run.json` for that
               run's id, URL, time and tested inspect_ai SHA (a passing run days
               older than this one makes the diff long; weigh it accordingly); when
               the SHA is set,
                 git -C inspect_ai log --oneline <inspect_ai_sha>..${{ steps.base.outputs.sha }}
               shows what changed in inspect_ai between the two runs (nothing, or
               nothing near the failure, points at a dependency). When
               `triage/versions/passing.txt` holds no install log, say so and compare
               installed against locked only.
            4. For every implicated package that changed between the two runs (or
               that is ahead of uv.lock when there is no passing run), check its
               release notes for a plausible trigger before blaming inspect_ai:
               `gh api repos/<owner>/<repo>/releases?per_page=10` on the package's
               GitHub repository (for example `openai/openai-python`), and
               `gh api repos/<owner>/<repo>/compare/v<old>...v<new>` for the commits
               (tag names vary; check the releases list first). You have no other
               network access; if you cannot find the repository, say so.

            Set `DEPENDENCY_CHANGES` to the list of implicated packages whose version
            differs (package, locked, installed in the passing run, installed in the
            failing run, and what its release notes say), or to "none". When you
            describe a new issue (bucket C or D), put this in its `## Dependency
            versions` section as a small table:

              | package | locked (uv.lock) | last passing run | failing run |
              |---------|------------------|------------------|-------------|

            with a line per implicated package (differing or not), a link to the
            passing run, and the release-notes finding under the table; write
            "no version differences among the implicated packages" when there are
            none. When a release is the plausible trigger, say so in `## Root cause`
            and in the Slack text, and let it steer the bucket: a fix that pins or
            adapts to the new version in inspect_ai is bucket C only when it is
            small and you are sure; a release that unmasked a latent bug you do not
            fully understand is bucket D.

            # Buckets
            Pick the first bucket that applies.

            ## Bucket A — Already fixed on main
            Condition: `ALREADY_FIXED_ON_MAIN == true`.
            Action:
              1. Slack text with:
                 - The likely fixing commit (https://github.com/UKGovernmentBEIS/inspect_ai/commit/<sha>)
                 - A one-line explanation of why you believe it fixes the failure
                 - Note that the next scheduled run should pass
              2. If `EXISTING_ISSUE` is set, add a `comment_on` entry for it noting that
                 the failure appears to be fixed by the identified commit on main, and
                 suggest it can be closed after the next scheduled run passes.
              3. Do not describe a new issue.
            Then stop.

            ## Bucket B — Provider outage / intermittent infrastructure failure
            Symptoms: HTTP 5xx from Anthropic / Google / OpenAI / Grok APIs, connection resets,
            DNS failures, provider-side rate limits, socket timeouts talking to external services.
            Action:
              1. Slack text naming the provider and the specific symptom, noting that the
                 failure appears intermittent and will likely clear on the next scheduled
                 run.
              2. If `EXISTING_ISSUE` is set, add a brief `comment_on` entry for it noting
                 this new intermittent occurrence with a link to the failed run.
              3. Do not describe a new issue.
            Then stop.

            ## Bucket C — Diagnosable bug with a clear, minimal fix
            You understand the root cause AND can describe a targeted fix (usually <30 lines).
            Action:
              **If `EXISTING_ISSUE` is set**: do NOT describe a new issue. Instead:
                - Add a `comment_on` entry for it whose body contains: the new failed run
                  link, a one-line "still failing on run <id>" note, and — if your
                  analysis has refined or changed since the original issue was opened —
                  an updated root cause and/or proposed fix. Otherwise keep the comment
                  brief. If the issue is closed, set `reopen: true`; if it has no
                  assignee, set `assignees: ["ransomr"]` — an issue filed by another
                  automation (e.g. the recurring ci-perf run) may be unowned, and the
                  board's working views filter on assignee, so unassigned means
                  invisible to the maintainer (observed: inspect_ai#444).
                - Slack text with the existing-issue URL (not a new one).
                - Stop.

              **Otherwise** (no existing issue):
              1. Describe a new tracking issue in the issues repo (${{ env.ISSUES_REPO }}):
                 - Title: `Triage: <short summary>`
                 - Assignee: `ransomr` (the landing job adds it)
                 - No labels. The maintainer who reads the issue may hand it to the
                   autonomous pipeline (the fork's agent implements the Proposed fix
                   and opens a PR into the automated review loop) by labelling it
                   themselves, so write the Proposed fix section as a brief an
                   implementer can follow verbatim. Bucket C is the
                   well-understood-fix bucket; if your confidence wavers while
                   writing the issue, drop back to bucket D instead.
                 - Body (`issue.md`) structured as:
                   ## Summary
                   <one-line description>

                   ## Failing tests
                   <test names / node ids>

                   ## Root cause
                   <analysis, referencing specific files and lines in inspect_ai>

                   ## Dependency versions
                   <the table from DEPENDENCY_CHANGES, or "no version differences among
                    the implicated packages">

                   ## Proposed fix
                   <concrete description of the change, including a unified diff in a
                    ```diff fenced block if small enough, or per-file pseudocode if larger.
                    Reference absolute paths under inspect_ai/ so a human can apply it.>

                   ## Suggested follow-up
                   The fix above is written as a brief the autonomous agent can
                   follow: a maintainer who agrees with it can apply the `auto`
                   label to this issue, and the fork's agent implements it and
                   opens a PR into the automated review loop. Otherwise a PR can
                   be created manually:
                   ```
                   cd <path-to-inspect_ai-clone>
                   git checkout -b claude/triage-<UPSTREAM_RUN_ID>
                   claude "Read this issue in ${{ env.ISSUES_REPO }} and open a PR
                           against UKGovernmentBEIS/inspect_ai main that implements the
                           proposed fix."
                   ```

                   ## Links
                   - Failed run: ${{ env.UPSTREAM_RUN_URL }}
                   - Triage run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
              2. Slack text summarizing the failure and the fix (the landing job appends
                 the tracking-issue link).

            ## Bucket D — Unclear, non-obvious, or risky
            You cannot confidently diagnose, OR the fix would be speculative, OR it touches
            more than ~30 lines, OR multiple tests failed for different reasons.
            Action: same dedup logic as bucket C (if `EXISTING_ISSUE` is set, a
            `comment_on` entry with `reopen` / `assignees` as needed; otherwise a new
            issue). Say plainly in the body that the fix is not yet understood, so
            nobody hands a speculative brief to the autonomous pipeline. If describing
            a new issue, body has:
              ## Root cause
              <"not yet determined" + what you examined>

              ## Hypotheses considered
              <list, with evidence for/against each>

              ## Dependency versions
              <the table from DEPENDENCY_CHANGES, or "no version differences among the
               implicated packages">

              ## Suggested follow-up
              Needs human investigation before any fix. Once a direction is chosen, the
              issue can be updated and a PR opened manually.

              ## Links
              (same as above)

            **When in doubt between C and D, pick D.** An unconfident fix proposal wastes
            more time than "here's what I found, please advise."

            # Guardrails
            - Issues live in ${{ env.ISSUES_REPO }} only — never in this (triage) repo
              or in UKGovernmentBEIS/inspect_ai. The landing job enforces this; every
              `gh issue list/view` you run passes `--repo ${{ env.ISSUES_REPO }}`.
            - At most one issue-related action per run: either one new issue OR one
              comment on one existing issue (its `reopen` and `assignees` are part of
              that single action). Never both, and never a new issue when
              `EXISTING_ISSUE` is set.
            - Never modify files in `inspect_ai/` — treat it as read-only reference.
            - Every run ends with Slack text; the manifest is how it gets posted.
            - If you hit any error you cannot resolve, still follow bucket-D behavior
              (a comment on EXISTING_ISSUE if set, otherwise a new D issue) and
              include the error in the body so a human can follow up.

      # The broker runs as model-broker, so the runner user cannot signal it:
      # it exits when this file appears. From here on the runner is the
      # agent's; this step is diagnostics (the broker's log names each
      # forwarded call by method and path) and authorizes nothing.
      - name: Stop the model broker
        if: always() && steps.broker.outcome == 'success'
        env:
          STOP_FILE: ${{ steps.broker.outputs.stop-file }}
        run: |
          touch "$STOP_FILE"
          for _ in $(seq 1 20); do
            pgrep -u model-broker -x python3 >/dev/null 2>&1 || break
            sleep 0.5
          done
          cat /var/lib/model-broker/broker.log

      # The agent's `manifest-extra.json` supplies `issues` and `slack` — those
      # two keys and nothing else: every other manifest field is the
      # workflow's, so unknown keys are dropped, not merged. Values are
      # normalized rather than passed through: a mistyped entry would make the
      # validator refuse the WHOLE manifest, so dropping it with a warning is
      # the proportionate failure. Every issue entry is pinned to ISSUES_REPO
      # (the agent's `repo`, if any, is ignored), its labels are dropped
      # entirely, its assignees reduced to ISSUE_ASSIGNEE (a new issue is
      # always assigned; an existing one only when the agent asks and the
      # land job finds it unowned), `reopen` is kept only on a comment, and
      # only the first entry survives — one issue action per run, the
      # prompt's rule, enforced here. No label because a label can be an
      # authorization: `auto` on a fork issue starts the autonomous coding
      # agent, and until 2026-09-22 this step forwarded it on the agent's
      # say-so — an agent that had just read test output anyone can shape,
      # so the label was a privilege the untrusted principal granted itself
      # and marvin merely wrote (Claude Security finding 4628345). The
      # maintainer who reads the issue applies `auto` if the brief deserves
      # it; that human's label is what the fork's kickoff accepts.
      # What is valid still lands, but a failed agent step,
      # an unparsable manifest, any entry or key that was dropped, or a run
      # without Slack text (every triage owes the thread a reply) becomes
      # the manifest's `error` (fail_run), so the land job fails loudly
      # instead of ending a triage green with part of it missing.
      #
      # Three of the four triage policies — no labels, assignees limited to
      # ISSUE_ASSIGNEE, one issue action — are enforced twice: here, for the
      # proportionate warning-and-drop, and again by the land job's
      # validator on its fresh runner, from land's `allowed-issue-labels`,
      # `allowed-issue-assignees` and `max-issues` inputs, where a manifest
      # forged past this step (a shim on $GITHUB_PATH, a line in
      # $GITHUB_ENV after the agent ran) is refused whole rather than
      # landed. The fourth — a failed agent step carried into
      # `error.fail_run` — is enforced here only; a forged manifest could
      # drop that `error`, but could not make an already failed agent job
      # green: the job result is the runner's, not the manifest's, and land
      # runs under always() either way. The validator also enforces the
      # generic contract (schema and known keys, file references, the
      # allowed issue repository, no bundle under refuse-bundle); the Slack
      # destination is a land input, not a manifest field.
      - name: Compose landing manifest
        id: landing
        if: always()
        env:
          DIR: ${{ runner.temp }}/landing
          EXTRA: ${{ runner.temp }}/landing-extra.json
          # The isolated-agent action's `conclusion` output: "success" when
          # the agent exited 0, "failure" when it did not, and empty when the
          # action failed before the agent ran (setup or isolation check). Any
          # value but "success" makes this a failed triage that land reports.
          CLAUDE_OUTCOME: ${{ steps.claude.outputs.conclusion }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          mkdir -p "$DIR"
          extra='{}'
          agent='{}'
          problem=""
          if [ -f "$DIR/manifest-extra.json" ]; then
            if ! agent=$(jq -c 'if type=="object" then . else error("not an object") end' "$DIR/manifest-extra.json" 2>&1); then
              echo "::error::landing: the agent's manifest-extra.json is not a JSON object ($agent); nothing it described lands."
              problem="the agent's manifest-extra.json is not valid JSON (an object), so nothing it described was landed"
              agent='{}'
            fi
          fi
          norm=$(jq -c --arg repo "$ISSUES_REPO" --arg owner "$ISSUE_ASSIGNEE" '{
              issues: [((.issues // []) | if type == "array" then . else [] end)[] | select(type == "object"
                          and (.body_file | type) == "string" and (.body_file | test("^[A-Za-z0-9_-][A-Za-z0-9._-]*$"))
                          and ((.comment_on == null)
                               or ((.comment_on | type) == "number" and .comment_on == (.comment_on | floor) and .comment_on > 0))
                          and (.comment_on != null or ((.title | type) == "string" and .title != "")))
                        | {repo: $repo,
                           title: (if (.title | type) == "string" and .title != "" then .title[0:256] else "Comment on #\(.comment_on)" end),
                           body_file,
                           assignees: (if .comment_on == null then [$owner]
                                       else [(.assignees // [])[]? | strings | select(. == $owner)] | unique end),
                           reopen: (.comment_on != null and .reopen == true),
                           comment_on}
                        | if .comment_on == null then del(.comment_on) else . end
                        | if .assignees == [] then del(.assignees) else . end
                        | if .reopen then . else del(.reopen) end],
              slack: ((.slack.text_file? // "") | if type == "string" and test("^[A-Za-z0-9_-][A-Za-z0-9._-]*$") then . else "" end),
              had_slack: (has("slack")),
              bad_issues: (has("issues") and .issues != null and (.issues | type) != "array"),
              dropped_issues: ((.issues // []) | if type == "array" then length else 0 end),
              unknown: [keys[] | select(. != "issues" and . != "slack")]
            } | .dropped_issues -= (.issues | length)' <<<"$agent" 2>/dev/null) \
            || norm='{"issues":[],"slack":"","had_slack":false,"bad_issues":false,"dropped_issues":0,"unknown":[]}'
          n=$(jq -r '.issues | length' <<<"$norm")
          if [ "$(jq -r '.bad_issues' <<<"$norm")" = "true" ]; then
            echo "::error::landing: the agent's manifest has an \`issues\` value that is not an array; no issue action lands."
            problem="${problem:+$problem; and }its \`issues\` value is not an array, so no issue action was landed"
          fi
          dropped=$(jq -r '.dropped_issues' <<<"$norm")
          if [ "$dropped" != "0" ]; then
            echo "::error::landing: dropped $dropped malformed issues entr(ies) from the agent's manifest (need a body_file name and either a non-empty title or a positive integer comment_on)."
            problem="${problem:+$problem; and }$dropped malformed issue entr(ies) in its manifest were dropped"
          fi
          if [ "$(jq -r '.unknown | length' <<<"$norm")" != "0" ]; then
            echo "::error::landing: ignored keys the agent may not set in its manifest: $(jq -r '.unknown | join(", ")' <<<"$norm")."
            problem="${problem:+$problem; and }its manifest carried keys it may not set ($(jq -r '.unknown | join(", ")' <<<"$norm")), which were ignored"
          fi
          if [ "$n" -gt 1 ]; then
            echo "::error::landing: the agent described $n issue actions; only the first lands (one issue action per run)."
            problem="${problem:+$problem; and }it described $n issue actions where one is allowed; only the first was landed"
            norm=$(jq -c '.issues |= .[0:1]' <<<"$norm")
            n=1
          fi
          [ "$n" = "0" ] || extra=$(jq -c --argjson i "$(jq -c '.issues' <<<"$norm")" '.issues = $i' <<<"$extra")
          slack=$(jq -r '.slack' <<<"$norm")
          if [ -n "$slack" ]; then
            extra=$(jq -c --arg f "$slack" '.slack = {text_file: $f}' <<<"$extra")
          elif [ "$(jq -r '.had_slack' <<<"$norm")" = "true" ]; then
            echo "::error::landing: the agent's slack entry has no valid text_file name; no Slack message lands."
            problem="${problem:+$problem; and }its slack entry names no valid text_file, so no Slack reply was posted"
          elif [ "${CLAUDE_OUTCOME:-}" = "success" ]; then
            echo "::error::landing: the agent described no Slack message; every triage owes the thread a reply."
            problem="${problem:+$problem; and }it described no Slack reply"
          fi
          if [ "${CLAUDE_OUTCOME:-}" != "success" ]; then
            problem="${problem:+$problem; and }the triage agent step ended with outcome '${CLAUDE_OUTCOME:-unknown}'"
          fi
          if [ -n "$problem" ]; then
            echo "::error::landing: $problem."
            extra=$(jq -c --arg m "⚠️ Triage of the failed run did not complete: $problem. See the run log: $RUN_URL" \
              '.error = {message: $m, fail_run: true}' <<<"$extra")
          fi
          printf '%s\n' "$extra" >"$EXTRA"
          echo "landing: issues=$n slack=${slack:-none} $(jq -c 'if .error then .error.message = "<\(.error.message | length) chars>" else . end' <<<"$extra")"

      # Last, always: package the manifest for the land job. read-only: the
      # agent commits nothing (there is no repo at the workspace root), so no
      # git runs and head_sha is the start SHA — the inspect_ai commit the
      # agent investigated (github.sha, always 40 hex, when the checkout
      # failed). `branch` is a fixed name the land job's branch-prefix pins
      # to; under refuse-bundle it is never pushed to.
      - name: Emit landing manifest
        if: always()
        uses: meridianlabs-ai/agents/.github/actions/emit-landing@main
        with:
          start-sha: ${{ steps.base.outputs.sha || github.sha }}
          branch: triage
          manifest-extra: ${{ runner.temp }}/landing-extra.json
          read-only: "true"

  # TRUSTED, last: a fresh runner that checks out nothing and installs
  # nothing. The `land` composite is the whole landing — download, validate
  # (refusing any manifest that carries commits or pull-request fields:
  # nothing here may push, open, adopt or label a PR, or post `@review`; or
  # that names a label, another assignee or a second issue action, whatever
  # the agent job uploaded), create, comment on, reopen and assign the fork's tracking issues as
  # marvin (created and adopted issues go on Atlas at Todo by node ID; the
  # assignee is added only to an unowned issue), post the Slack message to the
  # destination the agent job validated, report the manifest's error and
  # fail the run when it says so. Skipped when the agent job was skipped
  # (trigger not met: no artifact) or cancelled.
  land:
    needs: agent
    if: always() && needs.agent.result != 'skipped' && needs.agent.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read           # artifact download
    env:
      # A step-level `if` cannot read secrets; this carries the one fact the
      # mint step needs: whether both app secrets are configured.
      MARVIN_APP_CONFIGURED: ${{ secrets.MARVIN_APP_CLIENT_ID != '' && secrets.MARVIN_APP_PRIVATE_KEY != '' }}
    steps:
      # The marvin identity for this job's writes: a one-hour installation
      # token of the meridian-marvin GitHub App (Phase 2 of the credential
      # separation), minted for the one repository the job writes to and
      # only the permissions it uses, revoked by the action's post step at
      # job end. Falls back to the MARVIN_TOKEN PAT until the app secrets
      # reach every caller; the PAT read goes with the retirement item. Only
      # this job may mint: the private key and the minted token never reach
      # a job that runs the agent.
      # The action's `app-id` input takes the App ID or the Client ID; v2 has
      # no `client-id` input.
      - name: Mint a fork-scoped marvin token
        id: mint
        if: env.MARVIN_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MARVIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
          owner: meridianlabs-ai
          repositories: inspect_ai
          permission-issues: write
          permission-organization-projects: write

      - name: Land
        uses: meridianlabs-ai/agents/.github/actions/land@main
        with:
          # The machine account: writes on $ISSUES_REPO (create, comment,
          # reopen, assign) and Atlas (organization projects). Under
          # refuse-bundle nothing is pushed and no PR is touched, so the
          # token needs neither contents nor pull-requests. The only job
          # that names it.
          token: ${{ steps.mint.outputs.token || secrets.MARVIN_TOKEN }}
          refuse-bundle: "true"
          # No PR either: a manifest carrying `pr` (open or adopt a PR for
          # a branch that already exists on origin and label it — `auto`
          # opts a PR into the autonomous loops, whose gates accept the
          # machine account as the labeler) or `handback` (the live
          # `@review`) is refused whole. refuse-bundle alone does not close
          # this: `pr.open` needs no push, and while the minted token
          # reaches only the fork's issues, the MARVIN_TOKEN fallback above
          # reaches this repository's pull requests (review round 1, B1).
          refuse-pr: "true"
          # The one repo the manifest's issues[] may name; the validator
          # refuses every other.
          allowed-issue-repos: ${{ env.ISSUES_REPO }}
          # The triage policies the compose step applies on the agent's
          # runner, enforced again here where that runner cannot reach: no
          # labels (an empty list — the agent job may not commission the
          # fork's `auto` pipeline, or anything else a label triggers; a
          # maintainer who reads the issue labels it), one owner, one issue
          # action. A manifest naming anything else is refused whole.
          allowed-issue-labels: ""
          allowed-issue-assignees: ${{ env.ISSUE_ASSIGNEE }}
          max-issues: "1"
          # The run names no PR; pin the manifest's (never pushed) branch to
          # the fixed name the agent job's emit-landing used.
          branch-prefix: triage
          # Slack destination from the agent job's VALIDATED outputs (the
          # channel the scheduled run's notification went to, else the
          # default channel; the thread of that notification, else the
          # channel root) — never from the manifest, which only supplies
          # the text.
          slack-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel: ${{ needs.agent.outputs.channel || secrets.SLACK_CHANNEL_ID }}
          slack-thread-ts: ${{ needs.agent.outputs.thread_ts }}
