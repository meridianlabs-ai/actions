name: Release Please — VS Code extension (reusable)

# Reusable workflow: Release Please and the build for a VS Code extension
# repo. The PUBLISH happens in the caller's own job, with the
# meridianlabs-ai/actions/vscode-publish composite action (see its
# action.yml for why: the Marketplace's Trusted Publishing matches the
# workflow file the token's job comes from, and for a job in a reusable
# workflow that is this file, never the caller's).
#
# On push to main, release-please maintains a rolling release PR (release-type
# node — it owns the package.json version). Merging the PR creates the tag and
# triggers the build job, and then the caller's publish job:
#
#   build   — checks out the release commit, installs, lints, builds, tests and
#             packages the extension, then uploads the single .vsix as the
#             `vsix` artifact. Runs with NO secrets and NO environment, and
#             only a read-only token. Restores and saves no Actions cache and
#             persists no checkout credential.
#   publish — the CALLER's job, gated by its `environment`. Runs
#             vscode-publish, which downloads the .vsix artifact, verifies
#             that it names the extension and version this release authorizes
#             and publishes it to the VS Code Marketplace + Open VSX. It does
#             not attach the .vsix to the GitHub release: callers turn on
#             immutable releases, which lock a release once published (the CI
#             artifact and the marketplaces hold the build). It never checks
#             out the repo or runs pnpm install, so no code from the consuming
#             repo (package.json scripts, dependency install hooks,
#             vscode:prepublish) executes there.
#
# The split exists so that code authored in the consuming repo — or in any of
# its dependencies — never runs in a job that can obtain the publish
# credentials (both registries' OIDC token exchanges). The environment
# reviewer gate controls who can START a publish; it cannot stop a compromised
# release commit from minting those tokens in the job that runs it, so the job
# that runs it must not be able to. vscode-publish pins vsce and ovsx
# and verifies the package before publishing; see its action.yml.
#
# The consuming repo must provide these pnpm scripts: lint, build,
# build:production, test, vsce:package. `vsce:package` must produce exactly one
# .vsix in the repo root. Add required reviewers to the publish job's
# `environment` (e.g. `marketplace`) to gate who can ship, name that
# environment in both registries' trusted publishers, and restrict its
# deployment branches to the release branch: the caller's release.yml is
# repo-authored code, and the Marketplace's policy names the workflow file and
# environment but no branch. The caller workflow file
# itself therefore stays inside the trust boundary —
# before approving, reviewers should confirm the run's workflow file is the
# expected one and unchanged.
#
# Both registries: Trusted Publishing only, with no stored token
# (`vsce publish --oidc`, `ovsx publish --trusted-publishing`). Register the
# caller's repository, its workflow file (release.yml) and the publish job's
# environment as a trusted publisher on each: the Marketplace publisher's
# Trusted Publishing policy, and open-vsx.org/user-settings/trusted-publishers
# for the Open VSX namespace. If a token exchange fails, the release is already
# tagged; fix the registration and publish the tag again with `publish-tag`
# (below) from a workflow_dispatch.
#
# `publish-tag` (from the caller's workflow_dispatch input): publish an
# EXISTING release tag that never reached the marketplaces. The release-please
# job then also outputs that tag as created (after checking that it names a
# published GitHub release the Release Please App created at the tag's current
# commit, that the commit is on the run's release branch, which must be
# protected, and that this run created no other), and the build job checks out
# the tag's commit, as it does for a release this run creates. Leave it empty
# for normal runs. A hotfix tag is retried from its hotfix branch, which must
# be protected for the retry to pass.
#
# Caller (in a consuming repo, .github/workflows/release.yml):
#   name: Release
#   on:
#     push: { branches: [main] }
#     workflow_dispatch:
#       inputs:
#         publish-tag:
#           description: "Publish an existing release tag that failed to publish (e.g. v1.2.3). Leave empty for a normal run."
#           type: string
#           default: ""
#   jobs:
#     release:
#       permissions:
#         contents: write
#         pull-requests: write
#       uses: meridianlabs-ai/actions/.github/workflows/release-please-vscode.yml@<commit SHA on main> # main
#       with:
#         publish-tag: ${{ inputs.publish-tag }}
#       # Name the secrets, not `secrets: inherit`, which would hand this
#       # workflow every repository and organization secret.
#       secrets:
#         RELEASE_PLEASE_APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
#         RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
#         SLACK_APPROVALS_WEBHOOK_URL: ${{ secrets.SLACK_APPROVALS_WEBHOOK_URL }}
#     publish:
#       needs: release
#       if: ${{ needs.release.outputs.release_created == 'true' }}
#       runs-on: ubuntu-latest
#       environment: marketplace
#       permissions:
#         contents: read
#         id-token: write # Trusted Publishing (Marketplace and Open VSX)
#       steps:
#         - uses: meridianlabs-ai/actions/vscode-publish@<same commit SHA> # main
#           with:
#             extension-id: ukaisi.inspect-ai
#             tag: ${{ needs.release.outputs.tag_name }}

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      config-file:
        type: string
        default: ".release-please-config.json"
      manifest-file:
        type: string
        default: ".release-please-manifest.json"
      approvers:
        description: "Space/comma-separated GitHub logins to @-mention in the Slack approval ping (resolved via slack-ids.json). Optional."
        type: string
        default: ""
      target-branch:
        description: "Branch Release Please manages. Leave empty for the default branch (normal releases); set to a maintenance branch (e.g. hotfix/1.4.x) to cut a hotfix release from a released tag."
        type: string
        default: ""
      publish-tag:
        description: "Build and output an EXISTING release tag (e.g. v1.2.3) for the caller's publish job, to publish a release that never reached the marketplaces. Leave empty for normal runs."
        type: string
        default: ""
    secrets:
      RELEASE_PLEASE_APP_ID:
        required: true
      RELEASE_PLEASE_APP_PRIVATE_KEY:
        required: true
      SLACK_APPROVALS_WEBHOOK_URL:
        required: false # if set, posts a Slack ping to a dedicated approvals channel when a release awaits publish approval
    outputs:
      release_created:
        description: "'true' when this run created a release (or `publish-tag` named one); the caller's publish job runs only then."
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: "The release tag the caller's publish job passes to vscode-publish as `tag`."
        value: ${{ jobs.release-please.outputs.tag_name }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.existing.outputs.release_created || steps.release.outputs.release_created }}
      tag_name: ${{ steps.existing.outputs.tag_name || steps.release.outputs.tag_name }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # The release PR, its branch, the release and the tag need these two.
          # Without them the token gets every permission the App is ever given.
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          # No release-type here: in manifest mode it must come from the
          # config-file. Setting it as an input puts the action in simple mode
          # and silently overrides the config's per-package options (versioning
          # strategy, include-v-in-tag, changelog-sections).
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          # Default to the branch the run was triggered from (github.ref_name):
          # push to main → main; a workflow_dispatch from a maintenance branch →
          # that branch. This keeps the Release Please target on the run's
          # branch, so a hotfix is driven solely by the "Use workflow from"
          # branch selector — no separate input to mismatch. The build checks
          # out the commit Release Please releases (the Release commit step).
          # The target-branch input remains an optional explicit override.
          target-branch: ${{ inputs.target-branch != '' && inputs.target-branch || github.ref_name }}

      # Release Please's changelog template hard-codes "### ⚠ BREAKING CHANGES"
      # (no config option changes it) and rewrites the release PR on every
      # update. Rename it to "### Breaking Changes" in the open release PR's
      # body, which becomes the GitHub Release notes when the PR is merged, and
      # in the newest section of CHANGELOG.md on its branch. Changes nothing
      # when the heading is absent or already renamed. The commit is made with
      # the App token, so it starts the release PR's pull_request checks. A
      # failure must not block a release, so the step continues on error; the
      # next run renames what it missed.
      - name: Rename the breaking changes heading
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ inputs.target-branch != '' && inputs.target-branch || github.ref_name }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, subprocess, sys, tempfile

          HEADING_RE = re.compile(r"^### \u26a0 BREAKING CHANGES(?=\r?$)", re.MULTILINE)
          HEADING = "### Breaking Changes"
          SECTION_RE = re.compile(r"^## ", re.MULTILINE)
          CHANGELOG = "CHANGELOG.md"
          CREATE_COMMIT = "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }"


          def gh(*args, payload=None):
              """Run gh; with `payload`, send it as the JSON request body."""
              if payload is None:
                  return subprocess.run(["gh", *args], check=True, capture_output=True, text=True).stdout
              with tempfile.NamedTemporaryFile("w", suffix=".json", delete=False) as f:
                  json.dump(payload, f)
              try:
                  return gh(*args, "--input", f.name)
              finally:
                  os.unlink(f.name)


          def rename(text):
              return HEADING_RE.sub(HEADING, text)


          def rename_newest_section(changelog):
              starts = [m.start() for m in SECTION_RE.finditer(changelog)]
              if not starts:
                  return changelog
              end = starts[1] if len(starts) > 1 else len(changelog)
              return changelog[: starts[0]] + rename(changelog[starts[0] : end]) + changelog[end:]


          def release_prs(repo, target):
              """Open release PRs on `target` from this repository's Release Please branches."""
              prs = json.loads(gh("pr", "list", "--repo", repo, "--base", target, "--state", "open", "--label", "autorelease: pending", "--limit", "100", "--json", "number,body,headRefName,isCrossRepository"))
              branch = f"release-please--branches--{target}"
              return [pr for pr in prs if not pr["isCrossRepository"] and (pr["headRefName"] == branch or pr["headRefName"].startswith(branch + "--components--"))]


          def read_changelog(repo, sha):
              try:
                  blob = gh("api", f"repos/{repo}/contents/{CHANGELOG}?ref={sha}", "-H", "Accept: application/vnd.github.object", "--jq", ".sha").strip()
              except subprocess.CalledProcessError as e:
                  if "(HTTP 404)" in (e.stderr or ""):
                      return None
                  raise
              return base64.b64decode(gh("api", f"repos/{repo}/git/blobs/{blob}", "--jq", ".content")).decode("utf-8")


          def fix(repo, pr):
              branch = pr["headRefName"]
              head = gh("api", f"repos/{repo}/branches/{branch}", "--jq", ".commit.sha").strip()
              changelog = read_changelog(repo, head)
              if changelog is None:
                  print(f"{branch} has no {CHANGELOG}")
              elif (renamed := rename_newest_section(changelog)) != changelog:
                  commit = {
                      "branch": {"repositoryNameWithOwner": repo, "branchName": branch},
                      # A push after the head was read fails the commit instead of being overwritten.
                      "expectedHeadOid": head,
                      "message": {"headline": f"chore: use the Breaking Changes heading in {CHANGELOG}"},
                      "fileChanges": {"additions": [{"path": CHANGELOG, "contents": base64.b64encode(renamed.encode("utf-8")).decode("ascii")}]},
                  }
                  gh("api", "graphql", payload={"query": CREATE_COMMIT, "variables": {"input": commit}})
                  print(f"Renamed the heading in {CHANGELOG} on {branch}")
              if (body := rename(pr["body"])) != pr["body"]:
                  gh("api", "-X", "PATCH", f"repos/{repo}/pulls/{pr['number']}", payload={"body": body})
                  print(f"Renamed the heading in the body of #{pr['number']}")


          def main():
              repo, target = os.environ["REPO"], os.environ["TARGET_BRANCH"]
              prs = release_prs(repo, target)
              if not prs:
                  print(f"No open release PR on {target}")
              for pr in prs:
                  fix(repo, pr)


          if __name__ == "__main__":
              try:
                  main()
              except subprocess.CalledProcessError as e:
                  print(f"::error::{' '.join(e.cmd)} failed: {(e.stderr or '').strip()}")
                  sys.exit(1)
          PY

      # publish-tag: hand an existing release tag to the build and the caller's
      # publish job. Anyone with contents: write can create or move a tag and
      # create a release, so neither proves a release. The step requires:
      # - a published (non-draft) release of exactly this tag, authored by the
      #   Release Please App, whose recorded commit (target_commitish, a SHA
      #   for Release Please's releases) is the commit the tag points at now,
      #   so a moved tag is refused. The author check rules out a release made
      #   by hand; a workflow holding the App key could still make one, so the
      #   branch check below is the one that bounds what gets built;
      # - that commit reachable from the branch Release Please manages in this
      #   run, which must be a protected branch.
      # The tag and the branch are caller inputs: each is validated against a
      # shape that starts with a letter or digit, and reaches gh only inside an
      # API path. The build checks out the commit checked here. The job summary
      # names the tag, the commit and the branch; the approval ping names the
      # tag and the commit.
      - name: Existing release tag
        id: existing
        if: ${{ inputs.publish-tag != '' }}
        env:
          PUBLISH_TAG: ${{ inputs.publish-tag }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_BRANCH: ${{ inputs.target-branch != '' && inputs.target-branch || github.ref_name }}
          RELEASE_AUTHOR: ${{ steps.app-token.outputs.app-slug }}[bot]
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! [[ "$PUBLISH_TAG" =~ ^([A-Za-z0-9][A-Za-z0-9._-]*-)?v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::publish-tag must be a release tag such as v1.2.3, got '$PUBLISH_TAG'"
            exit 1
          fi
          if ! [[ "$RELEASE_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || [[ "$RELEASE_BRANCH" == *..* ]]; then
            echo "::error::the release branch must be a plain branch name, got '$RELEASE_BRANCH'"
            exit 1
          fi
          if [ "$RELEASE_CREATED" = "true" ]; then
            echo "::error::this run created a release; publish it from this run, not with publish-tag"
            exit 1
          fi
          # A failed lookup prints gh's error, which fails the check after it,
          # so each failure ends in that check's error annotation.
          sha="$(gh api "repos/$GH_REPO/commits/refs/tags/$PUBLISH_TAG" --jq .sha)" || true
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve publish-tag '$PUBLISH_TAG' to a commit"
            exit 1
          fi
          release="$(gh api "repos/$GH_REPO/releases/tags/$PUBLISH_TAG" --jq '"\(.tag_name) \(.draft) \(.author.login) \(.target_commitish)"')" || true
          if [ "$release" != "$PUBLISH_TAG false $RELEASE_AUTHOR $sha" ]; then
            echo "::error::publish-tag '$PUBLISH_TAG' does not name a published GitHub release created by $RELEASE_AUTHOR at $sha"
            exit 1
          fi
          branch="$(gh api "repos/$GH_REPO/branches/$RELEASE_BRANCH" --jq '"\(.protected) \(.commit.sha)"')" || true
          if ! [[ "$branch" =~ ^true\ ([0-9a-f]{40})$ ]]; then
            echo "::error::the release branch '$RELEASE_BRANCH' must be a protected branch"
            exit 1
          fi
          head="${BASH_REMATCH[1]}"
          # "identical" or "ahead": the branch head is the tagged commit or descends from it.
          status="$(gh api "repos/$GH_REPO/compare/$sha...$head" --jq .status)" || true
          if [ "$status" != "identical" ] && [ "$status" != "ahead" ]; then
            echo "::error::publish-tag '$PUBLISH_TAG' points at $sha, which is not on $RELEASE_BRANCH"
            exit 1
          fi
          {
            echo "release_created<<EOF"; echo "true"; echo "EOF"
            echo "tag_name<<EOF"; echo "$PUBLISH_TAG"; echo "EOF"
            echo "sha<<EOF"; echo "$sha"; echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing existing release $PUBLISH_TAG at $sha"
          echo "Publishing existing release \`$PUBLISH_TAG\` at \`$sha\`, on \`$RELEASE_BRANCH\`." >> "$GITHUB_STEP_SUMMARY"

      # The commit the build checks out and the ping names: the publish-tag's
      # commit, or the one Release Please released in this run (its `sha`
      # output, the release's target_commitish). Not github.sha: a push that
      # carries the release PR's merge and later commits, or a dispatch from a
      # branch that has moved on, runs at a later commit, and building it would
      # publish code the tag doesn't contain. GitHub keeps a tag that already
      # exists when a release is created for it, so the step also requires the
      # tag to point at that commit. The commit must also be the run's commit
      # or an ancestor of it: the publish environment's branch rule checks the
      # run's branch, and a target-branch override could otherwise release
      # another branch's code. No continue-on-error: an empty `sha` output
      # would make the build check out the triggering commit.
      - name: Release commit
        id: commit
        if: ${{ steps.release.outputs.release_created == 'true' || steps.existing.outputs.release_created == 'true' }}
        env:
          SHA: ${{ steps.existing.outputs.sha || steps.release.outputs.sha }}
          TAG: ${{ steps.existing.outputs.tag_name || steps.release.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.sha }}
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not determine the commit this release tagged"
            exit 1
          fi
          if ! [[ "$TAG" =~ ^([A-Za-z0-9][A-Za-z0-9._-]*-)?v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the release tag must be a release tag such as v1.2.3, got '$TAG'"
            exit 1
          fi
          tagged="$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha)" || true
          if ! [[ "$tagged" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve release tag '$TAG' to a commit"
            exit 1
          fi
          if [ "$tagged" != "$SHA" ]; then
            echo "::error::release tag '$TAG' points at $tagged, not $SHA"
            exit 1
          fi
          status="$(gh api "repos/$GH_REPO/compare/$SHA...$RUN_SHA" --jq .status)" || true
          if [ "$status" != identical ] && [ "$status" != ahead ]; then
            echo "::error::release commit $SHA is not in this run's history ($RUN_SHA)"
            exit 1
          fi
          { echo "sha<<EOF"; echo "$SHA"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      # Fetch the shared GitHub-login -> Slack-ID map so the approval ping can
      # @-mention the right people. Like the ping, it must not block a release.
      - name: Fetch Slack ID map
        continue-on-error: true
        if: ${{ steps.release.outputs.release_created == 'true' || steps.existing.outputs.release_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: meridianlabs-ai/actions
          ref: main
          sparse-checkout: slack-ids.json
          sparse-checkout-cone-mode: false
          path: _meridian_actions

      # Ping the approvals channel when a release is cut or publish-tag names
      # one, @-mentioning the approvers, so the publish awaiting approval is
      # noticed (GitHub's own deployment-review notifications are unreliable —
      # e.g. suppressed for the actor who triggered the run). The message names
      # the commit the build checks out. No-ops if the webhook secret is unset.
      # A failed or stalled ping must not block the release.
      - name: Notify Slack — release awaiting publish approval
        continue-on-error: true
        if: ${{ steps.release.outputs.release_created == 'true' || steps.existing.outputs.release_created == 'true' }}
        env:
          SLACK_APPROVALS_WEBHOOK_URL: ${{ secrets.SLACK_APPROVALS_WEBHOOK_URL }}
          APPROVERS: ${{ inputs.approvers }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.existing.outputs.tag_name || steps.release.outputs.tag_name }}
          SHA: ${{ steps.commit.outputs.sha }}
          # This run contains the gated publish job, so deep-link straight to it.
          ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_APPROVALS_WEBHOOK_URL" ]; then
            echo "SLACK_APPROVALS_WEBHOOK_URL not set — skipping Slack notification"
            exit 0
          fi
          mentions=""
          map=_meridian_actions/slack-ids.json
          if [ -f "$map" ] && [ -n "$APPROVERS" ]; then
            for login in $(echo "$APPROVERS" | tr ',' ' '); do
              id=$(jq -r --arg l "$login" '.[$l] // empty' "$map")
              if [ -n "$id" ] && [ "$id" != "TODO" ]; then
                mentions="$mentions <@$id>"
              fi
            done
          fi
          text=":rocket: *${REPO}* ${TAG} release (commit ${SHA:0:12}) — Marketplace publish is *awaiting approval*.${mentions} Review: ${ACTIONS_URL}"
          curl -sf --max-time 30 -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg t "$text" '{text: $t}')" \
            "$SLACK_APPROVALS_WEBHOOK_URL"

  # Everything that executes code from the consuming repo (dependency install
  # hooks, package.json scripts, tests, vsce:package) happens here, with no
  # secrets, no environment and a read-only token. Do NOT add `secrets.*` or
  # `environment:` to this job — see the header comment.
  # It also uses no Actions cache and persists no checkout credential: a
  # restored pnpm store would decide what this job installs and packages
  # into the published .vsix, and a cache saved after repo code ran would be
  # restored by later runs. `cache-mode: none` makes the job's cache token
  # refuse both; no step asks for a cache either.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    cache-mode: none
    permissions:
      contents: read
    outputs:
      vsix: ${{ steps.package.outputs.vsix }}
    steps:
      # An empty ref would make actions/checkout fetch the triggering commit.
      - name: Require the release commit
        env:
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::no release commit to build"
            exit 1
          fi

      # The release commit: the one Release Please tagged, or the publish-tag's.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: TypeScript compile
        run: pnpm build

      - name: Build extension (production)
        run: pnpm build:production

      - name: Setup virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run tests
        run: xvfb-run -a pnpm test

      # Require exactly one .vsix so the publish job ships the file this step
      # produced and nothing else that happens to match a glob. The publish job
      # re-checks this on the downloaded artifact and reads the version from the
      # release tag, never from anything this job produced.
      - name: Package extension
        id: package
        run: |
          pnpm vsce:package
          shopt -s nullglob
          files=(*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::vsce:package must produce exactly one .vsix in the repo root; found ${#files[@]}: ${files[*]}"
            exit 1
          fi
          echo "vsix=${files[0]}" >> "$GITHUB_OUTPUT"

      # 30 days matches the maximum time a pending environment approval can
      # wait; a shorter retention would make a late approval fail at
      # download-artifact and force a full re-run.
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix }}
          retention-days: 30
          if-no-files-found: error
