name: Release Please — VS Code extension (reusable)

# Reusable workflow: Release Please for a VS Code extension repo.
#
# On push to main, release-please maintains a rolling release PR (release-type
# node — it owns the package.json version). Merging the PR creates the tag and
# triggers two further jobs:
#
#   build   — checks out the release commit, installs, lints, builds, tests and
#             packages the extension, then uploads the single .vsix as an
#             artifact. Runs with NO secrets and NO environment, and only a
#             read-only token.
#   publish — gated by `environment`. Downloads the .vsix artifact, verifies
#             that it names the extension and version this release authorizes
#             (see below), publishes it to the VS Code Marketplace + Open VSX,
#             then attaches it to the GitHub release. It never checks out the
#             repo or runs pnpm install, so no code from the consuming repo
#             (package.json scripts, dependency install hooks,
#             vscode:prepublish) executes here.
#
# The split exists so that code authored in the consuming repo — or in any of
# its dependencies — never runs in a job that can read the publisher-wide
# VSCE_PAT / OVSX_PAT. The environment reviewer gate controls who can START a
# publish; it cannot stop a compromised release commit from reading secrets in
# the job that runs it, so the job that runs it must not hold them. The
# marketplace CLIs used by publish are pinned via `vsce-version` /
# `ovsx-version` rather than resolved from the repo's devDependencies, for the
# same reason, and are installed with --ignore-scripts in a step that holds no
# secrets. The version inputs are validated as exact x.y.z so a caller cannot
# smuggle an npm alias or git spec into the install (the caller controls the
# inputs, and the environment reviewer never sees them). Note the pins cover
# only vsce/ovsx themselves, not their transitive dependency trees (neither
# ships a lockfile), and vsce necessarily sees the PAT at run time — so this is
# hardening, not isolation, for the CLIs. Auth for release-please is a
# short-lived token from the Meridian release GitHub App.
#
# The split confines where repo code RUNS; it does not, by itself, confine
# what the publisher-wide PATs PUBLISH. vsce and ovsx publish to whatever
# publisher, name and version the .vsix's own manifests declare, and the .vsix
# is the output of the build job, i.e. of repo code. So before any step that
# holds a PAT, the publish job's "Verify VSIX" step opens the downloaded
# package (a zip; nothing in it is executed) and fails the job unless
# extension/package.json and extension.vsixmanifest agree with each other and
# name exactly `extension-id` (a caller input the build cannot change) at the
# version encoded in the release-please tag (an output of the release-please
# job, which runs no repo code). The build job's version output and the
# artifact's file name are not evidence and are not used: the tag supplies
# the version, and the artifact directory must hold exactly one regular file
# with a plain name. The validator is inline in this file rather than fetched,
# so the publish job still checks out nothing and the check moves with the
# workflow revision the caller pinned. What this binds: the identity and
# version the PATs act on for a given approved release. What it cannot do:
# stop a compromised release commit from becoming the content of that one
# extension version (that is what building is), or narrow the PATs themselves
# — a Marketplace PAT covers every extension of every publisher its account
# manages, and an Open VSX token every namespace of its account. Tokens
# scoped to the one publisher, where a marketplace allows it, are an
# administrative defence to apply separately; do not read this workflow's
# structure as providing it.
#
# The consuming repo must provide these pnpm scripts: lint, build,
# build:production, test, vsce:package. `vsce:package` must produce exactly one
# .vsix in the repo root. Add required reviewers to the `environment` (default
# `marketplace`) to gate who can ship, and store VSCE_PAT / OVSX_PAT as
# ENVIRONMENT secrets on that environment, not as repository or organisation
# secrets. The caller passes `secrets: inherit`, and the caller's own
# release.yml is repo-authored code on the release branch: if the PATs were
# repo-level, any job added to that file could read them with no approval and
# without touching this workflow. Environment-scoped secrets are only exposed to
# jobs that reference the environment, which puts the reviewer gate in the path.
# The caller workflow file itself therefore stays inside the trust boundary —
# before approving, reviewers should confirm the run's workflow file is the
# expected one and unchanged.
#
# Caller (in a consuming repo, .github/workflows/release.yml):
#   name: Release
#   on:
#     push: { branches: [main] }
#   jobs:
#     release:
#       permissions:
#         contents: write
#         pull-requests: write
#       uses: meridianlabs-ai/actions/.github/workflows/release-please-vscode.yml@v1
#       with:
#         extension-id: ukaisi.inspect-ai
#       secrets: inherit

on:
  workflow_call:
    inputs:
      extension-id:
        description: "Marketplace extension id, e.g. ukaisi.inspect-ai"
        type: string
        required: true
      node-version:
        type: string
        default: "22"
      publish-openvsx:
        description: "Also publish to Open VSX"
        type: boolean
        default: true
      environment:
        description: "Deployment environment for the publish job. Add required reviewers to gate releases, and store VSCE_PAT / OVSX_PAT as environment secrets on it (not repo secrets) so only approved jobs can read them."
        type: string
        default: "marketplace"
      config-file:
        type: string
        default: ".release-please-config.json"
      manifest-file:
        type: string
        default: ".release-please-manifest.json"
      approvers:
        description: "Space/comma-separated GitHub logins to @-mention in the Slack approval ping (resolved via slack-ids.json). Optional."
        type: string
        default: ""
      target-branch:
        description: "Branch Release Please manages. Leave empty for the default branch (normal releases); set to a maintenance branch (e.g. hotfix/1.4.x) to cut a hotfix release from a released tag."
        type: string
        default: ""
      vsce-version:
        description: "Pinned @vscode/vsce version used by the publish job (deliberately NOT taken from the repo's devDependencies). Must be an exact x.y.z version; ranges, tags and npm aliases are rejected. Keep at or above the vsce the consuming repo packages with: publish --packagePath re-validates the manifest."
        type: string
        default: "3.9.2"
      ovsx-version:
        description: "Pinned ovsx version used by the publish job (deliberately NOT taken from the repo's devDependencies). Must be an exact x.y.z version; ranges, tags and npm aliases are rejected."
        type: string
        default: "0.10.12"
    secrets:
      RELEASE_PLEASE_APP_ID:
        required: true
      RELEASE_PLEASE_APP_PRIVATE_KEY:
        required: true
      VSCE_PAT:
        required: true
      OVSX_PAT:
        required: false
      SLACK_APPROVALS_WEBHOOK_URL:
        required: false # if set, posts a Slack ping to a dedicated approvals channel when a release awaits publish approval

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          # No release-type here: in manifest mode it must come from the
          # config-file. Setting it as an input puts the action in simple mode
          # and silently overrides the config's per-package options (versioning
          # strategy, include-v-in-tag, changelog-sections).
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          # Default to the branch the run was triggered from (github.ref_name):
          # push to main → main; a workflow_dispatch from a maintenance branch →
          # that branch. This keeps the Release Please target and the build
          # checkout on the SAME branch, so a hotfix is driven solely by the
          # "Use workflow from" branch selector — no separate input to mismatch.
          # The target-branch input remains an optional explicit override.
          target-branch: ${{ inputs.target-branch != '' && inputs.target-branch || github.ref_name }}

      # Fetch the shared GitHub-login -> Slack-ID map so the approval ping can
      # @-mention the right people.
      - name: Fetch Slack ID map
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: meridianlabs-ai/actions
          ref: v1
          sparse-checkout: slack-ids.json
          sparse-checkout-cone-mode: false
          path: _meridian_actions

      # Ping the approvals channel when a release is cut, @-mentioning the
      # approvers, so the publish awaiting approval is noticed (GitHub's own
      # deployment-review notifications are unreliable — e.g. suppressed for the
      # actor who triggered the run). No-ops if the webhook secret is unset.
      - name: Notify Slack — release awaiting publish approval
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          SLACK_APPROVALS_WEBHOOK_URL: ${{ secrets.SLACK_APPROVALS_WEBHOOK_URL }}
          APPROVERS: ${{ inputs.approvers }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
          # This run contains the gated publish job, so deep-link straight to it.
          ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_APPROVALS_WEBHOOK_URL" ]; then
            echo "SLACK_APPROVALS_WEBHOOK_URL not set — skipping Slack notification"
            exit 0
          fi
          mentions=""
          map=_meridian_actions/slack-ids.json
          if [ -f "$map" ] && [ -n "$APPROVERS" ]; then
            for login in $(echo "$APPROVERS" | tr ',' ' '); do
              id=$(jq -r --arg l "$login" '.[$l] // empty' "$map")
              if [ -n "$id" ] && [ "$id" != "TODO" ]; then
                mentions="$mentions <@$id>"
              fi
            done
          fi
          text=":rocket: *${REPO}* ${TAG} release created — Marketplace publish is *awaiting approval*.${mentions} Review: ${ACTIONS_URL}"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg t "$text" '{text: $t}')" \
            "$SLACK_APPROVALS_WEBHOOK_URL"

  # Everything that executes code from the consuming repo (dependency install
  # hooks, package.json scripts, tests, vsce:package) happens here, with no
  # secrets, no environment and a read-only token. Do NOT add `secrets.*` or
  # `environment:` to this job — see the header comment.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      vsix: ${{ steps.package.outputs.vsix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: TypeScript compile
        run: pnpm build

      - name: Build extension (production)
        run: pnpm build:production

      - name: Setup virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run tests
        run: xvfb-run -a pnpm test

      # Require exactly one .vsix so the publish job ships the file this step
      # produced and nothing else that happens to match a glob. The publish job
      # re-checks this on the downloaded artifact and reads the version from the
      # release tag, never from anything this job produced.
      - name: Package extension
        id: package
        run: |
          pnpm vsce:package
          shopt -s nullglob
          files=(*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::vsce:package must produce exactly one .vsix in the repo root; found ${#files[@]}: ${files[*]}"
            exit 1
          fi
          echo "vsix=${files[0]}" >> "$GITHUB_OUTPUT"

      # 30 days matches the maximum time a pending environment approval can
      # wait; a shorter retention would make a late approval fail at
      # download-artifact and force a full re-run.
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix }}
          retention-days: 30
          if-no-files-found: error

  # Holds the marketplace PATs and the release-upload token, and is gated by the
  # `environment` reviewers. Deliberately has no checkout and no pnpm install:
  # nothing from the consuming repo runs here. Publishing a pre-built
  # --packagePath does not invoke vscode:prepublish or any other repo script.
  #
  # Nothing from `needs.build.outputs` is used here: the build job ran repo
  # code, so its outputs are repo-controlled. The extension identity comes
  # from the caller's `extension-id` input and the version from the
  # release-please tag; the Verify VSIX step binds the downloaded package to
  # both and is the only source of the VSIX path and VERSION the later steps
  # use.
  publish:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    env:
      EXTENSION_ID: ${{ inputs.extension-id }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VSCE_VERSION: ${{ inputs.vsce-version }}
      OVSX_VERSION: ${{ inputs.ovsx-version }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Download VSIX artifact
        uses: actions/download-artifact@v7
        with:
          name: vsix
          path: vsix

      # Bind the package to this release before any PAT is in the environment.
      # The validator reads the zip's central directory the way vsce, ovsx and
      # the registries do, never extracts or executes anything, parses
      # extension/package.json and extension.vsixmanifest strictly (no
      # duplicate JSON keys, no DTD or entities, one Metadata/Identity), and
      # rejects an archive whose entries could make two consumers read
      # different manifests (repeated or case-variant names, unsafe paths,
      # symlinks). Its `vsix`, `version`, `publisher` and `name` outputs are
      # what the publish and upload steps use. Inline rather than fetched: see
      # the header.
      - name: Verify VSIX
        id: verify
        env:
          VSIX_DIR: vsix
        run: |
          python3 - <<'PY'
          """Bind the downloaded .vsix to the extension identity and version this release authorizes.

          Trusted inputs: EXTENSION_ID (a caller input) and TAG (the release-please
          job's tag). Untrusted: everything under VSIX_DIR, which the build job
          produced by running repo code. Prints ::error:: and exits 1 on any doubt.
          """
          import json
          import os
          import re
          import stat
          import sys
          import xml.etree.ElementTree as ET
          import zipfile

          NAME = r"[a-z0-9][a-z0-9-]*"  # vsce's rule for a publisher or extension name
          NAME_RE = re.compile(NAME, re.IGNORECASE)
          EXTENSION_ID_RE = re.compile(rf"({NAME})\.({NAME})", re.IGNORECASE)
          SEMVER = r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)"
          VERSION_RE = re.compile(SEMVER)
          # The tag shapes release-please produces for the callers' configs:
          # vX.Y.Z (default), X.Y.Z (include-v-in-tag: false), and either with a
          # <component>- prefix (include-component-in-tag). Only the trailing
          # X.Y.Z is used; the component is not checked against anything. No
          # prerelease suffix: the Marketplace rejects those, so no intended
          # release carries one.
          TAG_RE = re.compile(rf"(?:[A-Za-z0-9][A-Za-z0-9._/-]*-)?v?({SEMVER})")
          FILENAME_RE = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]*\.vsix")
          PACKAGE_JSON = "extension/package.json"
          VSIXMANIFEST = "extension.vsixmanifest"
          VSX = "{http://schemas.microsoft.com/developer/vsx-schema/2011}"
          MAX_MANIFEST = 1 << 20


          class Rejected(Exception):
              pass


          def one_file(directory):
              entries = sorted(os.listdir(directory))
              if len(entries) != 1:
                  raise Rejected(f"expected exactly one file in {directory}/, found {entries}")
              name = entries[0]
              if not FILENAME_RE.fullmatch(name):
                  raise Rejected(f"artifact name {name!r} is not a plain <name>.vsix")
              path = os.path.join(directory, name)
              if not stat.S_ISREG(os.lstat(path).st_mode):
                  raise Rejected(f"{path} is not a regular file")
              return path


          def check_entry_name(name):
              parts = name.split("/")
              if parts and parts[-1] == "":
                  parts = parts[:-1]  # a directory entry
              if (not parts or "\\" in name or "\x00" in name or name.startswith("/")
                      or re.match(r"[A-Za-z]:", name) or any(p in ("", ".", "..") for p in parts)):
                  raise Rejected(f"unsafe archive entry name {name!r}")


          def check_extra_fields(info):
              # yauzl (vsce's reader) replaces an entry's name with the one in an
              # Info-ZIP Unicode Path field (0x7075) when the entry's UTF-8 flag is
              # off; Python and other readers keep the header name. An entry
              # could thus be one file to this check and the manifest to vsce.
              # vsce's own packager writes no such field, so reject any, and any
              # extra data that does not parse as (id, length, data) records.
              extra, offset = info.extra, 0
              while offset < len(extra):
                  if offset + 4 > len(extra):
                      raise Rejected(f"archive entry {info.filename!r} has malformed extra-field data")
                  field_id = int.from_bytes(extra[offset:offset + 2], "little")
                  length = int.from_bytes(extra[offset + 2:offset + 4], "little")
                  if offset + 4 + length > len(extra):
                      raise Rejected(f"archive entry {info.filename!r} has malformed extra-field data")
                  if field_id == 0x7075:
                      raise Rejected(f"archive entry {info.filename!r} carries a Unicode Path extra field that could rename it for some readers")
                  offset += 4 + length


          def read_manifests(path):
              try:
                  zf = zipfile.ZipFile(path)
              except Exception as e:
                  raise Rejected(f"{path} is not a readable zip archive: {e}")
              with zf:
                  by_lower = {}
                  for info in zf.infolist():
                      check_entry_name(info.filename)
                      check_extra_fields(info)
                      if stat.S_ISLNK(info.external_attr >> 16):
                          raise Rejected(f"archive entry {info.filename!r} is a symlink")
                      lower = info.filename.lower()
                      if lower in by_lower:
                          raise Rejected(f"ambiguous archive: entries {by_lower[lower]!r} and {info.filename!r} repeat or differ only in case")
                      by_lower[lower] = info.filename
                  blobs = []
                  for wanted in (PACKAGE_JSON, VSIXMANIFEST):
                      actual = by_lower.get(wanted)
                      if actual is None:
                          raise Rejected(f"{wanted} is missing from the archive")
                      if actual != wanted:
                          raise Rejected(f"{actual!r} would be read as {wanted} by vsce but not by every consumer")
                      info = zf.getinfo(wanted)
                      if info.file_size > MAX_MANIFEST:
                          raise Rejected(f"{wanted} is larger than {MAX_MANIFEST} bytes")
                      try:
                          with zf.open(info) as f:
                              data = f.read(MAX_MANIFEST + 1)
                      except Exception as e:
                          raise Rejected(f"{wanted} could not be read: {e}")
                      if len(data) > MAX_MANIFEST:
                          raise Rejected(f"{wanted} is larger than {MAX_MANIFEST} bytes")
                      blobs.append(data)
              return blobs


          def identity(publisher, name, version, source):
              for field, value, shape in (("publisher", publisher, NAME_RE), ("name", name, NAME_RE), ("version", version, VERSION_RE)):
                  if not isinstance(value, str) or not shape.fullmatch(value):
                      raise Rejected(f"{source}: {field} {value!r} is missing or malformed")
              return (publisher, name, version)


          def parse_package_json(data):
              def no_duplicates(pairs):
                  keys = [k for k, _ in pairs]
                  if len(set(keys)) != len(keys):
                      raise ValueError("duplicate keys")
                  return dict(pairs)

              def no_constants(token):
                  raise ValueError(f"{token} is not JSON")  # Python would accept NaN/Infinity; JSON.parse does not

              try:
                  manifest = json.loads(data.decode("utf-8"), object_pairs_hook=no_duplicates, parse_constant=no_constants)
              except (UnicodeDecodeError, ValueError) as e:
                  raise Rejected(f"{PACKAGE_JSON} is not strict JSON: {e}")
              if not isinstance(manifest, dict):
                  raise Rejected(f"{PACKAGE_JSON} is not a JSON object")
              return identity(manifest.get("publisher"), manifest.get("name"), manifest.get("version"), PACKAGE_JSON)


          def parse_vsixmanifest(data):
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError as e:
                  raise Rejected(f"{VSIXMANIFEST} is not UTF-8: {e}")
              if re.search(r"<!(?:DOCTYPE|ENTITY)", text, re.IGNORECASE):
                  raise Rejected(f"{VSIXMANIFEST} declares a DTD or entities")
              try:
                  root = ET.fromstring(text)
              except ET.ParseError as e:
                  raise Rejected(f"{VSIXMANIFEST} is not well-formed XML: {e}")
              if root.tag != VSX + "PackageManifest":
                  raise Rejected(f"{VSIXMANIFEST}: root element is {root.tag}, not PackageManifest")
              # vsce's xml2js reader ignores namespaces and takes the first
              # Metadata and the first Identity it meets, so an element of either
              # name in any namespace, anywhere, is a competing identity: require
              # exactly one of each in the whole document, in the vsx namespace,
              # with Identity directly under Metadata directly under the root.
              metadata = [e for e in root.iter() if e.tag.rsplit("}", 1)[-1] == "Metadata"]
              if len(metadata) != 1 or metadata[0].tag != VSX + "Metadata" or metadata[0] not in list(root):
                  raise Rejected(f"{VSIXMANIFEST}: expected one Metadata element under the root, found {[e.tag for e in metadata]}")
              identities = [e for e in root.iter() if e.tag.rsplit("}", 1)[-1] == "Identity"]
              if len(identities) != 1 or identities[0].tag != VSX + "Identity" or identities[0] not in list(metadata[0]):
                  raise Rejected(f"{VSIXMANIFEST}: expected one Identity element under Metadata, found {[e.tag for e in identities]}")
              a = identities[0].attrib
              if any(k.startswith("{") for k in a):
                  raise Rejected(f"{VSIXMANIFEST}: Identity has namespaced attributes {sorted(k for k in a if k.startswith('{'))}")
              return identity(a.get("Publisher"), a.get("Id"), a.get("Version"), VSIXMANIFEST)


          def describe(ident):
              return f"{ident[0]}.{ident[1]} {ident[2]}"


          def verify(directory, extension_id, tag):
              m = EXTENSION_ID_RE.fullmatch(extension_id)
              if not m:
                  raise Rejected(f"extension-id {extension_id!r} is not <publisher>.<name>")
              t = TAG_RE.fullmatch(tag)
              if not t:
                  raise Rejected(f"release tag {tag!r} does not end in an X.Y.Z version")
              expected = (m.group(1), m.group(2), t.group(1))
              path = one_file(directory)
              raw_json, raw_xml = read_manifests(path)
              pkg = parse_package_json(raw_json)
              xml = parse_vsixmanifest(raw_xml)
              if pkg != xml:
                  raise Rejected(f"{PACKAGE_JSON} says {describe(pkg)} but {VSIXMANIFEST} says {describe(xml)}")
              if pkg != expected:
                  raise Rejected(f"package is {describe(pkg)}; this release may only publish {describe(expected)} (extension-id {extension_id}, tag {tag})")
              return path, expected[2]


          def main():
              directory, extension_id, tag = (os.environ.get(k, "") for k in ("VSIX_DIR", "EXTENSION_ID", "TAG"))
              try:
                  path, version = verify(directory, extension_id, tag)
              except Rejected as e:
                  print(f"::error::VSIX rejected: {e}")
                  return 1
              print(f"Verified {path}: {extension_id} {version} (tag {tag})")
              output = os.environ.get("GITHUB_OUTPUT")
              if output:
                  publisher, name = extension_id.split(".")
                  with open(output, "a", encoding="utf-8") as f:
                      for key, value in (("vsix", path), ("version", version), ("publisher", publisher), ("name", name)):
                          f.write(f"{key}<<EOF\n{value}\nEOF\n")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY

      # Install both CLIs in one step that holds no secrets, so the npm install
      # (which resolves their transitive dependencies fresh from the registry —
      # the pins cover only vsce/ovsx themselves) and any lifecycle scripts run
      # without the PATs in the environment. --ignore-scripts skips those
      # scripts altogether; the only native module in the tree is vsce's
      # optional keytar, which vsce loads lazily and only when no --pat is
      # given, so publish --pat is unaffected.
      #
      # The version inputs are controlled by the caller workflow, and npm treats
      # anything after `@` as a package spec, not just a version: an alias such
      # as `npm:other-package` or a hosted-git spec like `github:user/repo`
      # would install arbitrary code as the `vsce` / `ovsx` binaries that later
      # run with the PATs. Require an exact x.y.z version so only the pinned
      # registry package can be installed.
      - name: Install marketplace CLIs
        run: |
          for v in "$VSCE_VERSION" "$OVSX_VERSION"; do
            if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::vsce-version / ovsx-version must be exact x.y.z versions, got '$v'"
              exit 1
            fi
          done
          npm install -g --ignore-scripts "@vscode/vsce@${VSCE_VERSION}" "ovsx@${OVSX_VERSION}"

      # The already-published checks are a rerun convenience, not a control:
      # they parse the CLIs' JSON and skip only when the listing's own
      # publisher and name are the verified identity and its versions include
      # the verified version, compared exactly, where before they grepped the
      # output for a version the build job supplied, interpreted as a regular
      # expression. `vsce show` prints `undefined` for an unknown extension and
      # `ovsx get` fails for one, so a first publish falls through to the
      # publish command, as does a lookup failure or a listing for anything
      # else; the CLIs themselves refuse a duplicate version.
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ steps.verify.outputs.vsix }}
          VERSION: ${{ steps.verify.outputs.version }}
          PUBLISHER: ${{ steps.verify.outputs.publisher }}
          NAME: ${{ steps.verify.outputs.name }}
        run: |
          listing="$RUNNER_TEMP/vsce-show.json"
          if vsce show "$EXTENSION_ID" --json > "$listing" 2>/dev/null \
             && jq -e --arg p "$PUBLISHER" --arg n "$NAME" --arg v "$VERSION" \
                  '.publisher.publisherName == $p and .extensionName == $n and ((.versions // []) | map(.version) | index($v) != null)' \
                  "$listing" > /dev/null 2>&1; then
            echo "v${VERSION} already on VS Code Marketplace, skipping"
          else
            vsce publish --packagePath "$VSIX" --pat "$VSCE_PAT"
          fi

      - name: Publish to Open VSX
        if: ${{ inputs.publish-openvsx }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ steps.verify.outputs.vsix }}
          VERSION: ${{ steps.verify.outputs.version }}
          PUBLISHER: ${{ steps.verify.outputs.publisher }}
          NAME: ${{ steps.verify.outputs.name }}
        run: |
          metadata="$RUNNER_TEMP/ovsx-metadata.json"
          if ovsx get "$EXTENSION_ID" --metadata > "$metadata" 2>/dev/null \
             && jq -e --arg p "$PUBLISHER" --arg n "$NAME" --arg v "$VERSION" \
                  '.namespace == $p and .name == $n and (.version == $v or ((.allVersions // {}) | has($v)))' \
                  "$metadata" > /dev/null 2>&1; then
            echo "v${VERSION} already on Open VSX, skipping"
          else
            ovsx publish "$VSIX" --pat "$OVSX_PAT"
          fi

      # No checkout in this job, so `gh` cannot infer the repository from a git
      # remote; GH_REPO tells it which repo owns the release.
      - name: Upload VSIX to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VSIX: ${{ steps.verify.outputs.vsix }}
        run: gh release upload "$TAG" "$VSIX" --clobber
