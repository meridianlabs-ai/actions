---
# Inspect AI CI performance analysis of upstream inspect_ai `main`, in four
# jobs with runner boundaries between them.
#
# resolve reads the commit upstream `main` points at, once, and runs nothing
# else. tooling, analyze and publish all check out that commit, so the three
# test, analyze and publish the same code. No job takes a ref from a person:
# the job that runs the analyzed commit's scripts holds the model credential,
# and only upstream `main` is trusted code (decision: Ransom, 2026-09-30).
#
# tooling runs upstream's ci-perf script tests. It installs pytest from PyPI,
# which is third-party code, so it runs in its own job with only a read-only
# token, not in analyze. analyze needs it: a failed test skips the analysis.
#
# analyze collects CI timings from that checkout, and runs the
# Claude agent that writes report.md and findings.json. The agent reads
# upstream CI logs, upstream PR titles and bodies, and fork issue text, so its
# runner is untrusted once the agent has run: injected text could leave a gh
# shim on $GITHUB_PATH, a variable in $GITHUB_ENV, or a .pth file in the
# ambient Python. analyze holds nothing the agent may not have: the read-only
# job token and the model credential (below). It uploads its evidence as an
# artifact.
#
# publish runs on a fresh runner the agent never had. It downloads that
# artifact, checks the collected data against the sha256 values recorded
# before the agent ran, validates report.md and findings.json, and only then
# writes fork issues and Atlas cards as marvin. The publisher never shares a
# runner with the agent, and no marvin identity (MARVIN_TOKEN, the app
# secrets, the minted token) may appear in analyze. Issue and Atlas writes
# consume the validated report.md and findings.json plus the pinned summary.
# Validation constrains the proposals' shape, not their factual correctness.
#
# The model credential (design/agent-jobs-workload-identity.md): Anthropic
# workload identity federation. claude-code-action exchanges the job's GitHub
# OIDC token (audience https://api.anthropic.com) for a short-lived Anthropic
# token under a federation rule that admits only this workflow on `main`
# (schedule and workflow_dispatch). The token acts as a service account that
# belongs only to the ci-perf workspace, which has a spend cap; it is scoped
# to workspace:inference and lives at most 600 s. The agent can read it: it
# is the declared exception, bounded by the cap, its lifetime and the rule,
# not kept secret. analyze references no long-lived Anthropic key, and
# `id-token: write` is there for this exchange alone. The rule, service
# account, workspace and organization IDs below are addresses, not secrets.
#
# The agent runs as the unprivileged claude-agent user through agents'
# launcher (create-codex-user, claude-agent-launcher, reclaim-codex-workspace
# and import-codex-final from meridianlabs-ai/agents), in its own PID and
# mount namespace with an allow-listed environment: no runner command-file
# variable, no OIDC request variable, only the job token as GH_TOKEN. The
# upstream checkout at the workspace root is read-only to it (grant: none).
# It writes only its landing directory, $RUNNER_TEMP/claude-agent, which the
# runner reads back only through import-codex-final (regular files owned by
# the agent, opened without following links, size-capped). The runner's own
# $RUNNER_TEMP/ci-perf, which the agent never sees, holds the collected data
# and the imported report.md and findings.json; Show report and the artifact
# read only that directory. github_token is the job token, so the action
# mints no Claude App token.
#
# Secrets (publish only):
# - MARVIN_APP_CLIENT_ID and MARVIN_APP_PRIVATE_KEY: the meridian-marvin
#   GitHub App, used only in publish, which mints a token scoped to the
#   inspect_ai fork with issues and organization-projects write (its only
#   writes: fork issues and comments, assignees, Atlas items).
# - MARVIN_TOKEN: the PAT the publish job falls back to while the app
#   secrets roll out; used only in publish.
#
# Egress: harden-runner runs in analyze with egress-policy block.
# allowed-endpoints is the egress observed in audit mode on run
# https://github.com/meridianlabs-ai/actions/actions/runs/34880688791:
# Anthropic (api.anthropic.com, the CLI's inference and token exchange from
# the agent's namespace; claude.ai and downloads.claude.ai are the
# launcher's Claude Code installer), GitHub (github.com and api.github.com,
# listed explicitly in case the agent's meta-domain fetch fails;
# release-assets.githubusercontent.com is the action's setup-bun) and
# registry.npmjs.org (the action's bun install). Nothing in analyze installs
# from PyPI. harden-runner allows GitHub Actions infrastructure without
# listing: the GitHub meta domains (github.com, *.github.com,
# *.githubapp.com, ghcr.io), *.actions.githubusercontent.com (the OIDC
# endpoint among them), codeload.github.com,
# productionresultssa*.blob.core.windows.net, and the Azure wire and
# metadata IPs. The agent's namespace shares the host network, so the
# firewall applies to it. Claude Code's telemetry intake (datadoghq.com) is
# not allowed; CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC in the analysis
# step's settings stops Claude Code from attempting telemetry, error
# reporting and update checks. A newly needed endpoint shows up as a blocked
# call in the harden-runner step summary and as a job annotation; add it
# only if it is clearly required, that is an Anthropic, GitHub or
# package-index host. publish needs no allow-list: its only egress is
# GitHub. resolve and tooling get no harden-runner: they hold nothing that
# reaches beyond the job.
#
# Privileges: harden-runner does NOT disable sudo here. Its hardening runs in
# a `pre` hook that GitHub runs before every job step, so a
# disable-sudo-and-containers would take sudo away before the agent-user
# setup and the launcher, which need it (review round 1, B1). Instead the
# untrusted agent runs as its own unprivileged user (not in sudo or docker),
# so it cannot alter the egress firewall or read another user's files as
# root; the launcher's isolation check fails the job before the agent if
# sudo or Docker are reachable to that user, if ptrace_scope would let it
# read another process, or if a runner process or command file is open to
# it.
#
# What the allow-list does and does not do: it stops connections to hosts
# not on the list. It does not stop an upload to an attacker's own resource
# on a listed multi-tenant host (a github.com repository or gist, an npm
# package) authenticated with a credential the attacker put in the text the
# agent reads. What the agent can move off the runner is what it can read:
# the read-only job token (this repository, expires with the job), the
# collected data, which is public, and the model credential, worth at most
# 600 s of inference in the capped workspace.
#
# Published output: this repo is public, so the job summary and the artifact
# are world-readable. They carry the agent's report.md and findings.json,
# unscreened: what it can leak there is what it can read (above), and a scan
# on a runner the agent could have shimmed would not be a control anyway.
#
# Publication result (publish job): the downloaded artifact is agent-written
# and may carry a published.json of its own. The Publish step deletes that
# path before it runs the publisher, so published.json exists afterwards only
# if this run's publisher wrote it, and Show published issues and Retain
# published issue URLs outside Git run only when that step succeeded. What
# they show and retain is therefore the publisher's result (the fork issues it
# created or reused, [] when none), also when the Atlas step fails after it; a
# failed validation or publisher reports nothing.
name: Inspect AI CI Perf

"on":
  schedule:
    - cron: "0 9 */2 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Collect and analyze without creating issues or comments"
        required: false
        default: true
        type: boolean

# Agent runs restore caches, never save them: the platform enforces this on
# every job's token (meridianlabs-ai/agents design/agent-cache-scope.md).
cache-mode: read

concurrency:
  group: inspect-ai-ci-perf
  cancel-in-progress: false

jobs:
  # The one commit every other job uses. It reads refs/heads/main and nothing
  # else, requires 40 hex, and writes the output with a heredoc delimiter.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      sha: ${{ steps.main.outputs.sha }}
    steps:
      - name: Resolve upstream main
        id: main
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/UKGovernmentBEIS/inspect_ai.git refs/heads/main \
                  | awk '$2 == "refs/heads/main" {print $1}')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not resolve UKGovernmentBEIS/inspect_ai main"; exit 1; }
          { echo "sha<<EOF"; echo "$sha"; echo "EOF"; } >>"$GITHUB_OUTPUT"

  # Third-party code (pytest from PyPI) runs here, with only a read-only
  # token, never in the job that holds the model key.
  tooling:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout upstream source at the resolved commit
        uses: actions/checkout@v7
        with:
          repository: UKGovernmentBEIS/inspect_ai
          ref: ${{ needs.resolve.outputs.sha }}
          path: inspect_ai
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Test CI tooling
        run: |
          python -m pip install pytest
          python -m pytest -c /dev/null -p no:cacheprovider inspect_ai/.claude/skills/ci-perf/scripts/test_ci_perf.py -q

  analyze:
    needs: [resolve, tooling]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      id-token: write  # the Anthropic WIF exchange only (see the header)
    env:
      CI_PERF_RUN_ATTEMPT: ${{ github.run_attempt }}
      CI_PERF_SCHEDULED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CI_PERF_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    outputs:
      raw_sha: ${{ steps.data.outputs.raw_sha }}
      measurements_sha: ${{ steps.data.outputs.measurements_sha }}
      summary_sha: ${{ steps.data.outputs.summary_sha }}
      analysis_conclusion: ${{ steps.analysis.outputs.conclusion }}

    steps:
      # egress-policy block only. sudo and containers are deliberately NOT
      # disabled here: harden-runner does that in its `pre` hook, which runs
      # before every step including the agent-user setup and the launcher,
      # both of which need sudo (review round 1, B1). Instead the untrusted
      # agent runs as its own unprivileged user, which is not in sudo or
      # docker and so cannot alter the firewall or read another user's files
      # as root; the launcher's isolation check fails the job before the
      # agent if that boundary does not hold.
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            api.github.com:443
            github.com:443
            claude.ai:443
            downloads.claude.ai:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      # The runner's own directory: the collected data, and later the
      # agent's imported report.md and findings.json. The agent never sees it.
      - name: Initialize output directory
        run: echo "CI_PERF_OUTPUT_DIR=$RUNNER_TEMP/ci-perf" >> "$GITHUB_ENV"

      # At the workspace root: the launcher's composites need a git checkout
      # there, and mount it read-only into the agent's namespace.
      - name: Checkout upstream source for analysis
        uses: actions/checkout@v7
        with:
          repository: UKGovernmentBEIS/inspect_ai
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # previous-summaries.json is analysis context, not a --publish input;
      # the hashes below protect the collected measurements used at publication.
      - name: Collect timings and prior summaries
        id: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .claude/skills/ci-perf/scripts/collect_ci_data.py \
            --out "$CI_PERF_OUTPUT_DIR/raw.json"
          python .claude/skills/ci-perf/scripts/summarize_ci_data.py \
            "$CI_PERF_OUTPUT_DIR/raw.json" \
            --out "$CI_PERF_OUTPUT_DIR/summary.json" \
            --markdown "$CI_PERF_OUTPUT_DIR/measurements.md"
          python .claude/skills/ci-perf/scripts/publish_ci_findings.py \
            --directory "$CI_PERF_OUTPUT_DIR" --read-history
          echo "raw_sha=$(sha256sum "$CI_PERF_OUTPUT_DIR/raw.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "measurements_sha=$(sha256sum "$CI_PERF_OUTPUT_DIR/measurements.md" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "summary_sha=$(sha256sum "$CI_PERF_OUTPUT_DIR/summary.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # The agent user, its landing directory $RUNNER_TEMP/claude-agent and
      # /opt/meridian-agent. grant: none leaves the checkout runner-owned
      # and read-only to the agent. The reclaim after the agent gates on
      # this step's id.
      - name: Create agent user
        id: agentuser
        uses: meridianlabs-ai/agents/.github/actions/create-codex-user@main
        with:
          user: claude-agent
          grant: none

      # The agent's namespace binds this directory in grant: none mode and
      # requires it; nothing here uses it.
      - name: Create the scratch directory
        run: sudo install -d -o claude-agent -g claude-agent -m 0700 "$RUNNER_TEMP/scratch"

      # Claude Code root-owned at the version claude-code-action pins, the
      # wrapper the action spawns as the CLI, the pre-agent isolation check,
      # a kill of every claude-agent process and an emptied landing
      # directory.
      - name: Prepare the agent launch
        id: launcher
        uses: meridianlabs-ai/agents/.github/actions/claude-agent-launcher@main
        with:
          grant: none

      # After the launcher, which empties the landing directory. The agent
      # reads these copies; the runner keeps its own in $CI_PERF_OUTPUT_DIR,
      # and those are what the artifact carries.
      - name: Stage the collected data for the agent
        run: |
          for file in raw.json summary.json measurements.md previous-summaries.json; do
            sudo install -o claude-agent -g claude-agent -m 0644 "$CI_PERF_OUTPUT_DIR/$file" "$RUNNER_TEMP/claude-agent/$file"
          done

      # claude-code-action in agent mode (the prompt input). The wrapper the
      # launcher installed starts the CLI as claude-agent in its namespace,
      # with an allow-listed environment, so the two values the prompt names
      # travel as settings env. --setting-sources user loads no settings,
      # hooks, CLAUDE.md or skills from the checkout. A failed CLI run fails
      # this step; `conclusion` (set on success) drives the publish job.
      # --model opus pins the model to the Opus alias, which Claude Code
      # resolves to the latest Opus release. No anthropic_api_key: the
      # action ignores WIF when a key is set. --permission-mode default:
      # with no mode given, the release @v1 pins on 2026-10-01 (2.1.287)
      # starts a headless run in auto mode, which hands every call no rule
      # matches to a model classifier instead of refusing it. In default
      # mode a headless run refuses whatever would prompt, so the tools in
      # --allowedTools are the whole list. Those include Bash, Write and
      # Edit without a path rule, so the mode does not confine the agent's
      # writes; the read-only checkout and its namespace do.
      - name: Analyze CI performance
        id: analysis
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: fdrl_011HrZrxamS56HuRWRMbqYBH
          anthropic_organization_id: be5d0086-bc43-45d2-9184-20ecdd647aa7
          anthropic_service_account_id: svac_01GhGfdWv1dYwL9WEPE2esoV
          anthropic_workspace_id: wrkspc_0111jFg7osvhUziZXCNh5sfB
          # The job token, so the action mints no Claude App token.
          github_token: ${{ github.token }}
          path_to_claude_code_executable: ${{ steps.launcher.outputs.executable }}
          # Nothing may be posted from the action's buffered post-step.
          classify_inline_comments: "false"
          claude_args: >-
            --model opus
            --permission-mode default
            --allowedTools Bash,Read,Edit,Write,Grep,Glob
            --setting-sources user
            --add-dir ${{ runner.temp }}/claude-agent
          settings: |
            {
              "env": {
                "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1",
                "CI_PERF_OUTPUT_DIR": "${{ runner.temp }}/claude-agent",
                "CI_PERF_RUN_URL": "${{ env.CI_PERF_RUN_URL }}"
              }
            }
          prompt: |
            Run the scheduled analysis described in
            .claude/skills/ci-perf/SKILL.md.
            Collection is already complete in CI_PERF_OUTPUT_DIR. Read the
            raw snapshot, summary.json and previous-summaries.json there.
            The one-time baseline and archived report/ledger are under
            design/ci-perf/. The source being analyzed is the working directory.

            Write report.md and findings.json in CI_PERF_OUTPUT_DIR.
            Analyze only: do not edit the checkout, implement fixes,
            commit, push, create PRs, or write GitHub issues or comments.
            Use gh only to read evidence and find duplicate issues and PRs
            on meridianlabs-ai/inspect_ai. A separate publisher handles writes.
            Link CI_PERF_RUN_URL in the report and use upstream run URLs for
            measurements. Write [] in findings.json if nothing is actionable.
            Missing observations are not zero. Do not retry known permission
            blockers. Do not run the collector again.

      # First after the agent, whatever its outcome: kills any survivor,
      # removes the WIF ACL entries and the agent's config directory, and
      # restores .git/config. The import is gated on it.
      - name: Reclaim workspace from the agent
        id: agentreclaim
        if: always() && steps.agentuser.outcome == 'success'
        uses: meridianlabs-ai/agents/.github/actions/reclaim-codex-workspace@main
        with:
          user: claude-agent

      # The only runner-side read of the landing directory: each regular,
      # single-link file owned by claude-agent, opened without following
      # links and within the size caps, copied into a fresh runner-only
      # directory. Anything else is skipped with a warning.
      - name: Import the agent's files
        id: import
        if: always() && steps.agentreclaim.outcome == 'success'
        uses: meridianlabs-ai/agents/.github/actions/import-codex-final@main
        with:
          mode: dir
          dest: ${{ runner.temp }}/ci-perf-agent

      # Only the two files the agent was asked for join the collected data.
      # Its staged copies of the data are not used: the runner's own are.
      - name: Assemble the evidence
        if: always() && steps.import.outcome == 'success'
        env:
          AGENT_FILES: ${{ runner.temp }}/ci-perf-agent
        run: |
          for file in report.md findings.json; do
            if test -f "$AGENT_FILES/$file"; then
              cp -- "$AGENT_FILES/$file" "$CI_PERF_OUTPUT_DIR/$file"
            fi
          done

      # Both read only $CI_PERF_OUTPUT_DIR, which the agent never had.
      - name: Show report
        if: always()
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "Dry-run: $DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          for file in report.md measurements.md; do
            if test -f "$CI_PERF_OUTPUT_DIR/$file"; then
              cat "$CI_PERF_OUTPUT_DIR/$file" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Retain CI evidence outside Git
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-perf/
          retention-days: 90
          if-no-files-found: warn

  # The checkout SHA and the artifact name come from resolve and from this
  # job, not from analyze, whose runner the agent had. The artifact name is
  # this attempt's, so a re-run of publish alone does not find an earlier
  # attempt's evidence: re-run all jobs instead.
  publish:
    needs: [resolve, analyze]
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI_PERF_OUTPUT_DIR: ${{ github.workspace }}/ci-perf
      CI_PERF_RUN_ATTEMPT: ${{ github.run_attempt }}
      PYTHONDONTWRITEBYTECODE: "1"
      CI_PERF_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # A step-level `if` cannot read secrets; this carries the one fact the
      # mint step needs: whether both app secrets are configured.
      MARVIN_APP_CONFIGURED: ${{ secrets.MARVIN_APP_CLIENT_ID != '' && secrets.MARVIN_APP_PRIVATE_KEY != '' }}

    steps:
      # The marvin identity for this job's writes: a one-hour installation
      # token of the meridian-marvin GitHub App (Phase 2 of the credential
      # separation), minted for the one repository the job writes to and
      # only the permissions it uses, revoked by the action's post step at
      # job end. Falls back to the MARVIN_TOKEN PAT until the app secrets
      # reach every caller; the PAT read goes with the retirement item. Only
      # this job may mint: the private key and the minted token never reach
      # a job that runs the agent.
      # The action's `app-id` input takes the App ID or the Client ID; v2 has
      # no `client-id` input.
      - name: Mint a fork-scoped marvin token
        id: mint
        if: env.MARVIN_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MARVIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
          owner: meridianlabs-ai
          repositories: inspect_ai
          permission-issues: write
          permission-organization-projects: write

      - name: Checkout the upstream source the analysis used
        uses: actions/checkout@v7
        with:
          repository: UKGovernmentBEIS/inspect_ai
          ref: ${{ needs.resolve.outputs.sha }}
          path: inspect_ai
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download CI evidence
        uses: actions/download-artifact@v7
        with:
          name: ci-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_PERF_OUTPUT_DIR }}

      - name: Validate proposed findings
        env:
          ANALYSIS_CONCLUSION: ${{ needs.analyze.outputs.analysis_conclusion }}
          RAW_SHA: ${{ needs.analyze.outputs.raw_sha }}
          MEASUREMENTS_SHA: ${{ needs.analyze.outputs.measurements_sha }}
          SUMMARY_SHA: ${{ needs.analyze.outputs.summary_sha }}
        run: |
          test "$ANALYSIS_CONCLUSION" = "success" || { echo "Analysis did not succeed"; exit 1; }
          echo "$RAW_SHA  $CI_PERF_OUTPUT_DIR/raw.json" | sha256sum --check
          echo "$MEASUREMENTS_SHA  $CI_PERF_OUTPUT_DIR/measurements.md" | sha256sum --check
          echo "$SUMMARY_SHA  $CI_PERF_OUTPUT_DIR/summary.json" | sha256sum --check
          python inspect_ai/.claude/skills/ci-perf/scripts/publish_ci_findings.py \
            --directory "$CI_PERF_OUTPUT_DIR"

      # Upstream publisher contract at the resolved commit: --publish reads findings.json,
      # summary.json and report.md, never previous-summaries.json or an existing
      # published.json. Success overwrites published.json with the active issue
      # URLs, including [] when none remain. Preserve this contract when changing
      # the tooling; the downloaded directory can contain an agent-written result,
      # which this step deletes first (a file, a directory or a link, whatever
      # the artifact carried) so that a published.json after this step is this
      # run's publisher result and nothing else.
      - name: Publish fork issues and trend summary
        id: publish
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token || secrets.MARVIN_TOKEN }}
        run: |
          rm -rf -- "$CI_PERF_OUTPUT_DIR/published.json"
          python inspect_ai/.claude/skills/ci-perf/scripts/publish_ci_findings.py \
            --directory "$CI_PERF_OUTPUT_DIR" --publish \
            --run-url "$CI_PERF_RUN_URL" --run-attempt "$CI_PERF_RUN_ATTEMPT"

      # Keep the default success() gate: a failed validation skips the publisher
      # and leaves a downloaded published.json on disk. Only a successful
      # publisher's freshly written result may drive these issue and project
      # writes.
      - name: Add published issues to Atlas and assign unowned ones to Eric
        id: atlas
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token || secrets.MARVIN_TOKEN }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          urls = json.loads((Path(os.environ["CI_PERF_OUTPUT_DIR"]) / "published.json").read_text())
          if not isinstance(urls, list) or any(
              not isinstance(url, str)
              or re.fullmatch(r"https://github\.com/meridianlabs-ai/inspect_ai/issues/[1-9][0-9]*", url) is None
              for url in urls
          ):
              raise ValueError("Expected published fork issue URLs")
          for url in dict.fromkeys(urls):
              number = url.rsplit("/", 1)[1]
              endpoint = f"repos/meridianlabs-ai/inspect_ai/issues/{number}"
              issue = json.loads(subprocess.check_output(["gh", "api", endpoint], text=True))
              subprocess.run([
                  "gh", "api", "graphql",
                  "-f", "query=mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}",
                  "-f", "p=PVT_kwDOC7YMCM4BU68p", "-f", f"c={issue['node_id']}", "--silent",
              ], check=True)
              if issue["assignees"]:
                  print(f"Issue {number} already assigned to {', '.join(a['login'] for a in issue['assignees'])}; leaving as is")
                  continue
              subprocess.run([
                  "gh", "api", f"{endpoint}/assignees", "--method", "POST", "--input", "-", "--silent",
              ], input=json.dumps({"assignees": ["epatey"]}), text=True, check=True)
          PYTHON

      # The two reporting steps run only when the publisher succeeded (and so
      # wrote published.json), whatever the Atlas step did after it; a skipped
      # or failed publisher reports nothing, so a result the artifact carried
      # is never shown or retained as this run's publication.
      - name: Show published issues
        if: always() && steps.publish.outcome == 'success'
        env:
          ATLAS_OUTCOME: ${{ steps.atlas.outcome }}
        run: |
          {
            echo "Published fork issues (the publisher's result for this run):"
            echo
            cat "$CI_PERF_OUTPUT_DIR/published.json"
            echo
            if test "$ATLAS_OUTCOME" != "success"; then
              echo
              echo "Atlas step outcome: $ATLAS_OUTCOME. The list is what the publisher created or reused, not proof that every issue reached Atlas or was assigned."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain published issue URLs outside Git
        if: always() && steps.publish.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ci-perf-${{ github.run_id }}-${{ github.run_attempt }}-published
          path: ${{ env.CI_PERF_OUTPUT_DIR }}/published.json
          retention-days: 90
          if-no-files-found: error
