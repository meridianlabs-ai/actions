---
# Inspect AI CI performance analysis, in two jobs with a runner boundary
# between them.
#
# analyze checks out upstream inspect_ai, collects CI timings, and runs the
# Claude agent that writes report.md and findings.json. The agent reads
# upstream CI logs, upstream PR titles and bodies, and fork issue text, so its
# runner is untrusted once the agent has run: injected text could leave a gh
# shim on $GITHUB_PATH, a variable in $GITHUB_ENV, or a .pth file in the
# ambient Python. analyze holds only read tokens (the capped Anthropic key is
# in the model broker, a process the agent cannot read) and uploads its
# evidence as an artifact.
#
# publish runs on a fresh runner the agent never had. It downloads that
# artifact, checks the collected data against the sha256 values recorded
# before the agent ran, validates report.md and findings.json, and only then
# writes fork issues and Atlas cards as marvin. The publisher never shares a
# runner with the agent, and no marvin identity (MARVIN_TOKEN, the app
# secrets, the minted token) may appear in analyze. Issue and Atlas writes
# consume the validated report.md and findings.json plus the pinned summary.
# Validation constrains the proposals' shape, not their factual correctness.
#
# Secrets:
# - CI_PERF_ANTHROPIC_API_KEY: a key from a dedicated Anthropic Console
#   workspace with a monthly spend cap, added as an org secret scoped to this
#   repository. The agent never holds it. Two Unix users besides the runner
#   carry the separation: the model broker (.github/actions/model-broker)
#   reads the key into a process running as the model-broker user and
#   forwards Messages API calls, and nothing else, to api.anthropic.com; the
#   agent (.github/actions/isolated-agent) runs the whole Claude process as a
#   third, unprivileged user whose ANTHROPIC_API_KEY is only the broker's
#   per-run token (good only for 127.0.0.1 while the broker is alive) and
#   whose ANTHROPIC_BASE_URL is the broker. The agent cannot read the broker
#   user's key file or memory, cannot read the runner process's memory or its
#   .NET diagnostic socket (where the runner keeps every job secret for
#   masking), and cannot sudo. The cap bounds what the agent can spend through
#   the broker during the job. Until the secret exists the broker step fails.
# - MARVIN_APP_CLIENT_ID and MARVIN_APP_PRIVATE_KEY: the meridian-marvin
#   GitHub App, used only in publish, which mints a token scoped to the
#   inspect_ai fork with issues and organization-projects write (its only
#   writes: fork issues and comments, assignees, Atlas items).
# - MARVIN_TOKEN: the PAT the publish job falls back to while the app
#   secrets roll out; used only in publish.
#
# Egress: harden-runner runs in analyze with egress-policy block.
# allowed-endpoints is the egress observed in audit mode on run
# https://github.com/meridianlabs-ai/actions/actions/runs/34880688791:
# Anthropic (api.anthropic.com, now reached only by the broker; claude.ai
# and downloads.claude.ai are the
# action's Claude Code installer), GitHub (github.com and api.github.com,
# listed explicitly in case the agent's meta-domain fetch fails;
# release-assets.githubusercontent.com is the action downloading a release
# asset) and the package indexes the action and the tooling test install
# from (registry.npmjs.org, pypi.org, files.pythonhosted.org). The agent
# allows GitHub Actions infrastructure without listing: the GitHub meta
# domains (github.com, *.github.com, *.githubapp.com, ghcr.io),
# *.actions.githubusercontent.com, codeload.github.com,
# productionresultssa*.blob.core.windows.net, and the Azure wire and
# metadata IPs. Claude Code's telemetry intake (datadoghq.com) is not
# allowed; CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC on the analysis step
# stops Claude Code from attempting telemetry, error reporting and update
# checks. A newly needed endpoint shows up as a blocked call in the
# harden-runner step summary and as a job annotation; add it only if it is
# clearly required, that is an Anthropic, GitHub or package-index host.
# publish needs no allow-list: its only egress is GitHub.
#
# Privileges: harden-runner does NOT disable sudo here. Its hardening runs in
# a `pre` hook that GitHub runs before every job step, so a
# disable-sudo-and-containers would take sudo away before the broker start
# and the agent-user setup, both of which need it (review round 1, B1).
# Instead the untrusted agent runs as its own unprivileged user (not in sudo
# or docker), so it cannot alter the egress firewall or read another user's
# files as root; the isolated-agent action's own check fails the job before
# the agent if sudo or Docker are reachable to that user, if ptrace_scope
# would let it read another process, or if the broker or runner processes are
# open to it. Nothing untrusted runs as the runner user, so the runner
# keeping sudo is not a path for the agent.
#
# What the allow-list does and does not do: it stops connections to hosts
# not on the list. It does not stop an upload to an attacker's own resource
# on a listed multi-tenant host (a github.com repository or gist, an npm
# package) authenticated with a credential the attacker put in the text the
# agent reads. So the allow-list is not what keeps the key confidential; the
# broker is. What the agent can still move off the runner is what it can
# read: the read-only job token (this repository, expires with the job) and
# the collected data, which is public.
#
# Published output: this repo is public, so the job summary and the artifact
# are world-readable. They carry whatever the agent wrote, unscreened: the
# agent holds no reusable secret (the key is in the broker, reachable only by
# the model-broker user, and the agent runs as its own unprivileged user), so
# there is nothing to screen for, and a scan on a runner the agent could have
# shimmed would not be a control anyway.
#
# Publication result (publish job): the downloaded artifact is agent-written
# and may carry a published.json of its own. The Publish step deletes that
# path before it runs the publisher, so published.json exists afterwards only
# if this run's publisher wrote it, and Show published issues and Retain
# published issue URLs outside Git run only when that step succeeded. What
# they show and retain is therefore the publisher's result (the fork issues it
# created or reused, [] when none), also when the Atlas step fails after it; a
# failed validation or publisher reports nothing.
name: Inspect AI CI Perf

"on":
  schedule:
    - cron: "0 9 */2 * *"
  workflow_dispatch:
    inputs:
      inspect_ai_ref:
        description: "Upstream inspect_ai branch/tag/commit for analysis and tooling"
        required: false
        default: "main"
        type: string
      dry_run:
        description: "Collect and analyze without creating issues or comments"
        required: false
        default: true
        type: boolean

concurrency:
  group: inspect-ai-ci-perf
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    env:
      CI_PERF_RUN_ATTEMPT: ${{ github.run_attempt }}
      CI_PERF_SCHEDULED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CI_PERF_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    outputs:
      source_sha: ${{ steps.source.outputs.commit }}
      raw_sha: ${{ steps.data.outputs.raw_sha }}
      measurements_sha: ${{ steps.data.outputs.measurements_sha }}
      summary_sha: ${{ steps.data.outputs.summary_sha }}
      analysis_conclusion: ${{ steps.analysis.outputs.conclusion }}
      artifact_name: ci-perf-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # This repo's own code at the workflow's commit, for the local model-broker
      # and isolated-agent actions. It does not matter that harden-runner's pre
      # hook (below) has already programmed the egress firewall: the fetch is to
      # github.com, which the allow-list permits.
      - name: Check out the isolation actions
        uses: actions/checkout@v7
        with:
          path: actions-repo
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Start the model broker
        id: broker
        uses: ./actions-repo/.github/actions/model-broker
        with:
          api-key: ${{ secrets.CI_PERF_ANTHROPIC_API_KEY }}
          lifetime-minutes: "90"

      # egress-policy block only. sudo and containers are deliberately NOT
      # disabled here: harden-runner does that in its `pre` hook, which runs
      # before every step including the broker start and the agent-user setup,
      # both of which need sudo (review round 1, B1). Instead the untrusted
      # agent runs as its own unprivileged user (the isolated-agent action),
      # which is not in sudo or docker and so cannot alter the firewall or read
      # another user's files as root; the isolation check inside that action
      # fails the job before the agent if that boundary does not hold.
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            api.github.com:443
            github.com:443
            claude.ai:443
            downloads.claude.ai:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Initialize output directory
        run: echo "CI_PERF_OUTPUT_DIR=$RUNNER_TEMP/ci-perf" >> "$GITHUB_ENV"

      - name: Checkout upstream source for analysis
        id: source
        uses: actions/checkout@v7
        with:
          repository: UKGovernmentBEIS/inspect_ai
          ref: ${{ inputs.inspect_ai_ref || 'main' }}
          path: inspect_ai
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Test CI tooling
        run: |
          python -m pip install pytest
          python -m pytest -c /dev/null -p no:cacheprovider inspect_ai/.claude/skills/ci-perf/scripts/test_ci_perf.py -q

      # previous-summaries.json is analysis context, not a --publish input;
      # the hashes below protect the collected measurements used at publication.
      - name: Collect timings and prior summaries
        id: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python inspect_ai/.claude/skills/ci-perf/scripts/collect_ci_data.py \
            --out "$CI_PERF_OUTPUT_DIR/raw.json"
          python inspect_ai/.claude/skills/ci-perf/scripts/summarize_ci_data.py \
            "$CI_PERF_OUTPUT_DIR/raw.json" \
            --out "$CI_PERF_OUTPUT_DIR/summary.json" \
            --markdown "$CI_PERF_OUTPUT_DIR/measurements.md"
          python inspect_ai/.claude/skills/ci-perf/scripts/publish_ci_findings.py \
            --directory "$CI_PERF_OUTPUT_DIR" --read-history
          echo "raw_sha=$(sha256sum "$CI_PERF_OUTPUT_DIR/raw.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "measurements_sha=$(sha256sum "$CI_PERF_OUTPUT_DIR/measurements.md" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "summary_sha=$(sha256sum "$CI_PERF_OUTPUT_DIR/summary.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # The entire Claude process runs as a dedicated unprivileged user (the
      # isolated-agent action), pointed at the broker on loopback with its
      # per-run token as ANTHROPIC_API_KEY; the reusable key is never in this
      # agent's environment, files or reachable processes. The action's own
      # isolation check fails the job before the agent if that does not hold.
      # `conclusion` (success/failure) drives the publish job. --model opus
      # pins the model to the Opus alias, which Claude Code resolves to the
      # latest Opus release (was the action's default). CI_PERF_OUTPUT_DIR and CI_PERF_RUN_URL are non-secret values
      # the prompt refers to, forwarded into the agent's otherwise-empty
      # environment.
      - name: Analyze CI performance
        id: analysis
        uses: ./actions-repo/.github/actions/isolated-agent
        with:
          base-url: ${{ steps.broker.outputs.base-url }}
          token: ${{ steps.broker.outputs.token }}
          github-token: ${{ github.token }}
          write-dir: ${{ env.CI_PERF_OUTPUT_DIR }}
          claude-args: "--model opus --allowedTools Bash,Read,Edit,Write,Grep,Glob"
          forward-env: |
            CI_PERF_OUTPUT_DIR=${{ env.CI_PERF_OUTPUT_DIR }}
            CI_PERF_RUN_URL=${{ env.CI_PERF_RUN_URL }}
          prompt: |
            Run the scheduled analysis described in
            inspect_ai/.claude/skills/ci-perf/SKILL.md.
            Collection is already complete in CI_PERF_OUTPUT_DIR. Read the
            raw snapshot, summary.json and previous-summaries.json there.
            The one-time baseline and archived report/ledger are under
            inspect_ai/design/ci-perf/. The source being analyzed is inspect_ai/.

            Write report.md and findings.json in CI_PERF_OUTPUT_DIR.
            Analyze only: do not edit the checkout, implement fixes,
            commit, push, create PRs, or write GitHub issues or comments.
            Use gh only to read evidence and find duplicate issues and PRs
            on meridianlabs-ai/inspect_ai. A separate publisher handles writes.
            Link CI_PERF_RUN_URL in the report and use upstream run URLs for
            measurements. Write [] in findings.json if nothing is actionable.
            Missing observations are not zero. Do not retry known permission
            blockers. Do not run the collector again.

      # The broker runs as model-broker, so the runner user cannot signal it:
      # it exits when this file appears. From here on the runner is the
      # agent's; this step is diagnostics (the broker's log names each
      # forwarded call by method and path) and authorizes nothing.
      - name: Stop the model broker
        if: always() && steps.broker.outcome == 'success'
        env:
          STOP_FILE: ${{ steps.broker.outputs.stop-file }}
        run: |
          touch "$STOP_FILE"
          for _ in $(seq 1 20); do
            pgrep -u model-broker -x python3 >/dev/null 2>&1 || break
            sleep 0.5
          done
          cat /var/lib/model-broker/broker.log

      - name: Show report
        if: always()
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "Dry-run: $DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          for file in report.md measurements.md; do
            if test -f "$CI_PERF_OUTPUT_DIR/$file"; then
              cat "$CI_PERF_OUTPUT_DIR/$file" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Retain CI evidence outside Git
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-perf/
          retention-days: 90
          if-no-files-found: warn

  publish:
    needs: analyze
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.inspect_ai_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI_PERF_OUTPUT_DIR: ${{ github.workspace }}/ci-perf
      CI_PERF_RUN_ATTEMPT: ${{ github.run_attempt }}
      PYTHONDONTWRITEBYTECODE: "1"
      CI_PERF_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # A step-level `if` cannot read secrets; this carries the one fact the
      # mint step needs: whether both app secrets are configured.
      MARVIN_APP_CONFIGURED: ${{ secrets.MARVIN_APP_CLIENT_ID != '' && secrets.MARVIN_APP_PRIVATE_KEY != '' }}

    steps:
      # The marvin identity for this job's writes: a one-hour installation
      # token of the meridian-marvin GitHub App (Phase 2 of the credential
      # separation), minted for the one repository the job writes to and
      # only the permissions it uses, revoked by the action's post step at
      # job end. Falls back to the MARVIN_TOKEN PAT until the app secrets
      # reach every caller; the PAT read goes with the retirement item. Only
      # this job may mint: the private key and the minted token never reach
      # a job that runs the agent.
      # The action's `app-id` input takes the App ID or the Client ID; v2 has
      # no `client-id` input.
      - name: Mint a fork-scoped marvin token
        id: mint
        if: env.MARVIN_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MARVIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
          owner: meridianlabs-ai
          repositories: inspect_ai
          permission-issues: write
          permission-organization-projects: write

      - name: Checkout the upstream source the analysis used
        uses: actions/checkout@v7
        with:
          repository: UKGovernmentBEIS/inspect_ai
          ref: ${{ needs.analyze.outputs.source_sha }}
          path: inspect_ai
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download CI evidence
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.analyze.outputs.artifact_name }}
          path: ${{ env.CI_PERF_OUTPUT_DIR }}

      - name: Validate proposed findings
        env:
          ANALYSIS_CONCLUSION: ${{ needs.analyze.outputs.analysis_conclusion }}
          RAW_SHA: ${{ needs.analyze.outputs.raw_sha }}
          MEASUREMENTS_SHA: ${{ needs.analyze.outputs.measurements_sha }}
          SUMMARY_SHA: ${{ needs.analyze.outputs.summary_sha }}
        run: |
          test "$ANALYSIS_CONCLUSION" = "success" || { echo "Analysis did not succeed"; exit 1; }
          echo "$RAW_SHA  $CI_PERF_OUTPUT_DIR/raw.json" | sha256sum --check
          echo "$MEASUREMENTS_SHA  $CI_PERF_OUTPUT_DIR/measurements.md" | sha256sum --check
          echo "$SUMMARY_SHA  $CI_PERF_OUTPUT_DIR/summary.json" | sha256sum --check
          python inspect_ai/.claude/skills/ci-perf/scripts/publish_ci_findings.py \
            --directory "$CI_PERF_OUTPUT_DIR"

      # Upstream publisher contract at source_sha: --publish reads findings.json,
      # summary.json and report.md, never previous-summaries.json or an existing
      # published.json. Success overwrites published.json with the active issue
      # URLs, including [] when none remain. Preserve this contract when changing
      # the tooling; the downloaded directory can contain an agent-written result,
      # which this step deletes first (a file, a directory or a link, whatever
      # the artifact carried) so that a published.json after this step is this
      # run's publisher result and nothing else.
      - name: Publish fork issues and trend summary
        id: publish
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token || secrets.MARVIN_TOKEN }}
        run: |
          rm -rf -- "$CI_PERF_OUTPUT_DIR/published.json"
          python inspect_ai/.claude/skills/ci-perf/scripts/publish_ci_findings.py \
            --directory "$CI_PERF_OUTPUT_DIR" --publish \
            --run-url "$CI_PERF_RUN_URL" --run-attempt "$CI_PERF_RUN_ATTEMPT"

      # Keep the default success() gate: a failed validation skips the publisher
      # and leaves a downloaded published.json on disk. Only a successful
      # publisher's freshly written result may drive these issue and project
      # writes.
      - name: Add published issues to Atlas and assign unowned ones to Eric
        id: atlas
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token || secrets.MARVIN_TOKEN }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          urls = json.loads((Path(os.environ["CI_PERF_OUTPUT_DIR"]) / "published.json").read_text())
          if not isinstance(urls, list) or any(
              not isinstance(url, str)
              or re.fullmatch(r"https://github\.com/meridianlabs-ai/inspect_ai/issues/[1-9][0-9]*", url) is None
              for url in urls
          ):
              raise ValueError("Expected published fork issue URLs")
          for url in dict.fromkeys(urls):
              number = url.rsplit("/", 1)[1]
              endpoint = f"repos/meridianlabs-ai/inspect_ai/issues/{number}"
              issue = json.loads(subprocess.check_output(["gh", "api", endpoint], text=True))
              subprocess.run([
                  "gh", "api", "graphql",
                  "-f", "query=mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}",
                  "-f", "p=PVT_kwDOC7YMCM4BU68p", "-f", f"c={issue['node_id']}", "--silent",
              ], check=True)
              if issue["assignees"]:
                  print(f"Issue {number} already assigned to {', '.join(a['login'] for a in issue['assignees'])}; leaving as is")
                  continue
              subprocess.run([
                  "gh", "api", f"{endpoint}/assignees", "--method", "POST", "--input", "-", "--silent",
              ], input=json.dumps({"assignees": ["epatey"]}), text=True, check=True)
          PYTHON

      # The two reporting steps run only when the publisher succeeded (and so
      # wrote published.json), whatever the Atlas step did after it; a skipped
      # or failed publisher reports nothing, so a result the artifact carried
      # is never shown or retained as this run's publication.
      - name: Show published issues
        if: always() && steps.publish.outcome == 'success'
        env:
          ATLAS_OUTCOME: ${{ steps.atlas.outcome }}
        run: |
          {
            echo "Published fork issues (the publisher's result for this run):"
            echo
            cat "$CI_PERF_OUTPUT_DIR/published.json"
            echo
            if test "$ATLAS_OUTCOME" != "success"; then
              echo
              echo "Atlas step outcome: $ATLAS_OUTCOME. The list is what the publisher created or reused, not proof that every issue reached Atlas or was assigned."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain published issue URLs outside Git
        if: always() && steps.publish.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ci-perf-${{ github.run_id }}-${{ github.run_attempt }}-published
          path: ${{ env.CI_PERF_OUTPUT_DIR }}/published.json
          retention-days: 90
          if-no-files-found: error
