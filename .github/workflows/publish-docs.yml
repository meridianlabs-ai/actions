---
name: Publish docs (reusable)

# Reusable workflow: render a repo's Quarto docs site at a release tag and
# deploy it to GitHub Pages, so the published docs match the released package
# and docs fixes go live with the next release. Callers run it as a job after
# their PyPI publish job: on `release: published`, where the run's ref is the
# release tag, or in the run that created the release, passing its tag as
# `tag` (the run's ref is then a branch).
#
# Jobs:
# - build: first refuses any ref that is not the tag of a published release
#   (`tag` when given, else the run's ref), so docs for unreleased code never
#   reach the site. Then it checks out that tag (the run's own commit when no
#   `tag` is given), installs the project from uv.lock and runs `quarto
#   render`. It runs the repo's code, so
#   it holds only the read-only job token, persists no checkout credential and
#   uses no Actions cache.
# - deploy: deploys the build's Pages artifact with actions/deploy-pages. It
#   checks out nothing and runs no repo code; it alone holds `pages: write` and
#   `id-token: write`.
#
# One-time setup in the calling repo (an admin), before the caller merges:
# - Settings → Pages → Source: "GitHub Actions". The `gh-pages` branch is then
#   no longer served, so `quarto publish gh-pages` stops updating the site.
# - Settings → Environments → github-pages: the deployment rules must allow
#   the run's ref, which GitHub checks rather than the checked out tag. For an
#   `on: release` caller, add a tag rule matching the release tags (for
#   example `*.*.*`). For a caller that passes `tag`, make sure the rules
#   include `main`; the environment then admits any job on main, so this
#   workflow's tag check is what keeps unreleased docs off the site. Without
#   a matching rule the deploy is refused after PyPI has already published.
#
# Caller, in a publish workflow that runs `on: release`:
#   jobs:
#     docs:
#       needs: publish
#       if: ${{ github.event_name == 'release' }}
#       permissions: { contents: read, pages: write, id-token: write }
#       uses: meridianlabs-ai/actions/.github/workflows/publish-docs.yml@<commit SHA on main> # main
#       with: { python-version: "3.12", extras: doc }
#
# Caller, in a release workflow on push to main that creates the release and
# publishes to PyPI in the same run:
#   jobs:
#     docs:
#       needs: [release-please, publish]
#       if: ${{ needs.release-please.outputs.release_created }}
#       permissions: { contents: read, pages: write, id-token: write }
#       uses: meridianlabs-ai/actions/.github/workflows/publish-docs.yml@<commit SHA on main> # main
#       with:
#         tag: ${{ needs.release-please.outputs.tag_name }}
#         python-version: "3.12"
#         extras: doc

"on":
  workflow_call:
    inputs:
      python-version:
        description: "Python for the docs build, for example '3.12'."
        type: string
        required: true
      docs-dir:
        description: "Quarto project directory. The site renders to <docs-dir>/_site."
        type: string
        default: "docs"
      extras:
        description: "Optional dependencies the docs build needs (quarto-cli and the like), one name per line."
        type: string
        default: ""
      tag:
        description: "Release tag to render, for a caller whose run is not on that tag (a release workflow on push to main). Leave empty to render the run's ref."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    cache-mode: none
    steps:
      - name: Allow only the tag of a published release
        id: ref
        # An explicit bash shell adds pipefail, so a failed release lookup
        # refuses the ref even if its output looks like a release.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            REF="refs/tags/$TAG"
          fi
          case "$REF" in
            refs/tags/*)
              tag="${REF#refs/tags/}"
              encoded="$(jq -rn --arg t "$tag" '$t | @uri')"
              if gh api "repos/$REPO/releases/tags/$encoded" \
                  | jq -e --arg t "$tag" '.tag_name == $t and .draft == false' > /dev/null; then
                # Without `tag`, the checkout's default keeps the run's own
                # commit, which a later move of the tag can't change.
                if [ -n "$TAG" ]; then
                  { echo "ref<<EOF"; echo "$REF"; echo "EOF"; } >> "$GITHUB_OUTPUT"
                fi
                exit 0
              fi
              echo "::error::Refusing to publish docs from $REF: no published release has this tag."
              exit 1
              ;;
          esac
          echo "::error::Refusing to publish docs from $REF: run this from a release tag."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      - uses: meridianlabs-ai/actions/install-python-dependencies@f4ae19412da5597fc283e3ef62db1a67384ae609 # self, re-pin after each change
        with:
          versions: locked
          python-version: ${{ inputs.python-version }}
          extras: ${{ inputs.extras }}
          actions-cache: none

      - name: Render docs
        env:
          DOCS_DIR: ${{ inputs.docs-dir }}
        run: uv run --no-sync quarto render "$DOCS_DIR"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.docs-dir }}/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Above deploy-pages' own 10-minute timeout, so the action reports and
    # cancels a stuck deployment itself.
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # A second release's deploy waits for the first rather than racing it.
    concurrency:
      group: publish-docs-deploy
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
