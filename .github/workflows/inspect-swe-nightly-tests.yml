---
name: Inspect SWE Nightly Tests

# Nightly run of the inspect_swe test suite with --runslow, so the slow and
# API-key-gated tests (docker sandbox installs, real agent evals) that are
# silently skipped by the repo's own CI actually run somewhere. Unlike the
# inspect_ai scheduled tests, there is deliberately NO skip-if-unchanged
# check: inspect_swe breaks via upstream drift (weekly inspect_ai releases,
# agent CLI churn), so re-testing an unchanged commit is the point.
#
# nightly-tests runs code this repository does not control: `pip install -e
# ".[dev]"` resolves inspect_swe's dev closure against PyPI on the day (no
# lock file, on purpose), sdist build hooks included, and pytest imports it
# with the provider keys in env. THREAT_MODEL.md names that code as an adversary
# that can take over its job's runner. So the job holds nothing that reaches
# beyond the job: the token is declared read-only (workflow-level
# `permissions`) rather than left to the repository's default setting, the
# checkout does not persist it, and no Actions cache is restored or saved
# (a cache saved after that code ran would be installed by every later
# nightly and outlive both the offending release and a key rotation; the
# same header in inspect-ai-scheduled-tests.yml has the detail). The
# workflow-level `cache-mode: read` makes the job token refuse a save, so the
# closure cannot write one with the token Runner.Worker holds.
# tests/test_scheduled_workflows.py checks this contract.
#
# When the tests fail or the run is cancelled (a timeout), the job uploads
# the run's Inspect `.eval` logs as an artifact, so the provider errors and
# transcripts behind a failure can be read rather than inferred from the
# pytest output. The logs hold model inputs and outputs, not the provider
# keys: inspect_ai records request bodies but not headers, and the agents run
# in docker sandboxes that get placeholder keys. The step before the upload
# still checks every log for the literal key values and puts only what it
# checked into a separate directory, which is what gets uploaded. An .eval
# log is rebuilt there: each member the archive lists is read with Inspect's
# own zip reader, its name and decompressed bytes are checked, and it is
# written to a fresh zip, so bytes no member lists (Inspect prunes entries
# without compacting), comments and extra fields are never uploaded. Any other
# log is copied and the copy's bytes checked. Either way what was checked is
# what goes up, even if a log changes meanwhile; a log with a key in its path
# or content, one that cannot be read, and links and special files are left
# out.
# That check guards against an accidental leak, not against the code above,
# which held the keys and the runner already. Nothing in this repository downloads the artifact; it is for
# people diagnosing the run.

"on":
  schedule:
    # Run nightly at 08:00 UTC (4am Boston)
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      inspect_swe_ref:
        description: "inspect_swe branch/tag/commit to checkout"
        required: false
        default: ""
        type: string
      pytest_args:
        description: "Additional arguments to pass to pytest (space-separated; letters, digits and _./=:,- only, so no quoting)"
        required: false
        default: ""
        type: string

# Read-only job token. The failure upload of the `.eval` logs goes through
# the runner's own artifact credential, not this token, and nothing in this
# workflow reads Actions data back.
permissions:
  contents: read

# The job token can restore caches but not save them, so code that runs here
# cannot plant a cache for a later run (see the header). Workflow level covers
# every job; tests forbid job-level overrides.
cache-mode: read

jobs:
  nightly-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      sha: ${{ steps.swe_commit.outputs.sha }}
      short_sha: ${{ steps.swe_commit.outputs.short_sha }}
      ref: ${{ steps.swe_commit.outputs.ref }}
      # A boolean the report job only compares, so nothing this job writes
      # reaches the Slack payload as text.
      eval_logs: ${{ steps.eval_logs.outputs.artifact-id != '' }}

    steps:
      # Fail before the checkout so an invalid ref gets this message rather
      # than a fetch error, and so the ref that later becomes a step output
      # (and a Slack payload field) can hold nothing but ref characters.
      - name: Validate inspect_swe_ref input
        env:
          INSPECT_SWE_REF: ${{ inputs.inspect_swe_ref }}
        run: |
          if [ -n "$INSPECT_SWE_REF" ] && { ! [[ "$INSPECT_SWE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$INSPECT_SWE_REF" == -* || "$INSPECT_SWE_REF" == *..* ]]; }; then
            echo "::error::inspect_swe_ref must be a branch, tag or commit: letters, digits and ._/- only, no leading '-' and no '..'"
            exit 1
          fi

      - name: Checkout inspect_swe repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: meridianlabs-ai/inspect_swe
          ref: ${{ inputs.inspect_swe_ref || '' }}
          # The dependency closure and the tests run in this tree; the job
          # token stays out of its .git/config.
          persist-credentials: false

      - name: Get inspect_swe commit info
        id: swe_commit
        env:
          INSPECT_SWE_REF: ${{ inputs.inspect_swe_ref }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "ref=${INSPECT_SWE_REF:-main}" >> "$GITHUB_OUTPUT"

      # No pip cache (`cache:` on setup-python or actions/cache on
      # ~/.cache/pip): see the header. Fresh resolution on a fresh runner.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Not in the dev extras; mirrors the inspect_ai scheduled tests
          # (xdist for docker/API latency, per-test timeouts).
          pip install pytest-timeout pytest-xdist
          # The gemini_cli tests are gated on GOOGLE_API_KEY (which we set)
          # but inspect_ai's Google provider needs google-genai installed —
          # without it they fail with PrerequisiteError instead of skipping.
          pip install google-genai
          # inspect_ai 0.3.259 raised its OpenAI provider's runtime floor to
          # openai>=3.1.0, but litellm (pulled in by mini_swe_agent) still
          # declares openai<3.0.0, so the resolver lands on 2.54.0 and every
          # openai/* test dies with:
          #   PrerequisiteError: OpenAI API requires at least version 3.1.0 of
          #   package openai (you have version 2.54.0 installed)
          # The litellm cap is stale metadata rather than a real
          # incompatibility — with openai 3.1.0 forced, litellm and
          # minisweagent both import and the fast suite is green — so override
          # it here. Drop this once litellm ships a release allowing openai 3.
          pip install --upgrade 'openai>=3.1.0'

      - name: Run tests (fast + slow)
        timeout-minutes: 120
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Plain-text eval output: no rich box-drawing panels or animated
          # progress bars in the CI log (they render as thousands of wrapped
          # junk lines when 20 tests dump captured output).
          INSPECT_DISPLAY: plain
          # Every eval() in the suite takes its log directory from here (none
          # passes log_dir), so the upload below knows where the logs are.
          INSPECT_LOG_DIR: ${{ runner.temp }}/inspect-logs
          PYTEST_ARGS: ${{ inputs.pytest_args }}
        run: |
          # pytest_args reaches this step through env: and is split on
          # spaces into an array, so bash never parses it as syntax in a
          # step that holds the provider keys. The allowlist admits flags,
          # node ids and -k names but no quotes, so a -k expression with
          # spaces is not supported (use node ids or --deselect).
          allowed='^[A-Za-z0-9 _./=:,-]*$'
          if ! [[ "$PYTEST_ARGS" =~ $allowed ]]; then
            echo "::error::pytest_args may only contain letters, digits, spaces and _./=:,-"
            exit 1
          fi
          read -ra extra_args <<< "$PYTEST_ARGS"
          # --runslow also keeps the fast suite in the same invocation, so
          # this is "CI tests + slow tests" in one pass. k8s and
          # terminal-bench tests skip via their conftest guards; flaky tests
          # stay excluded (no --runflaky).
          # --tb=short + log_level=warning keep failure dumps readable:
          # inspect_ai's TRACE-level subprocess logging (~3k lines in the
          # first run) otherwise lands in every failed test's captured-log
          # section.
          #
          # --timeout-method=signal (not thread): the thread method dumps
          # stacks to the worker's stderr and then os._exit()s it, which
          # xdist can only report as "worker 'gwN' crashed" — the stack dump
          # naming the hung await is lost. SIGALRM instead raises inside the
          # test, so a stall is reported as `Failed: Timeout >600.0s` with a
          # traceback, and the worker survives. These are asyncio evals, so
          # the signal always lands (the thread method's one advantage —
          # interrupting a blocking C call — doesn't apply).
          #
          # --timeout=900 (was 1500): a healthy full run is ~27 min, so a
          # 25-minute per-test timeout meant a single hung test could sit
          # silent for nearly the length of the whole suite.
          #
          # 900s is deliberately generous rather than tight. Measured by
          # --durations in run 31970591224, the slowest passing test is
          # test_mini_swe_attempts[docker] at 440s -- and that was five tests
          # on two workers, with far less docker contention than the full
          # suite. This ceiling is the last-resort backstop; the real bound
          # belongs in the evals themselves (inspect_swe#129 adds a 300s
          # per-sample time limit), so it should be clear of honest runs
          # rather than racing them.
          #
          # --durations=15 keeps that measurement coming, so the ceiling can
          # be re-tuned from data instead of guesswork.
          pytest --runslow -n auto --timeout=900 --timeout-method=signal --durations=15 --tb=short -o log_level=warning "${extra_args[@]}"

      # See the header. The keys are read from the environment inside Python,
      # never passed as arguments or written to a file, and never printed.
      # Nor is a log's name: it is one of the things checked, so the step
      # reports counts only, and any error (a directory it cannot list, a copy
      # that fails, a missing zstd reader) prints a fixed message, fails the
      # step, and so stops the upload. The upload takes CHECKED_LOG_DIR, never
      # INSPECT_LOG_DIR: upload-artifact follows links, and only checked
      # regular-file content is in it. Each log is opened once, without
      # following a link, and read only through that descriptor: an .eval is
      # rebuilt from the member bytes as they are checked, any other log is
      # copied and the copy checked, so a log rewritten or replaced meanwhile
      # changes nothing that is uploaded. Nothing is deleted from the logs.
      # This is the job's own Python, the one that ran the tests, so
      # inspect_ai is installed: inspect_ai._util.zipfile gives zipfile zstd
      # (zipfile_zstd before 3.14) and the multi-frame zstd members Inspect
      # writes for large logs (inspect_ai 0.3.211; inspect_swe needs 0.3.261).
      - name: Copy the logs that hold no provider key for upload
        id: log_scan
        if: failure() || cancelled()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INSPECT_LOG_DIR: ${{ runner.temp }}/inspect-logs
          CHECKED_LOG_DIR: ${{ runner.temp }}/inspect-logs-checked
        run: |
          python -I - <<'PY'
          import os
          import sys


          def main():
              import errno
              import stat
              import warnings
              import zipfile

              # Inspect's zip reader: zstd on every Python, and its
              # multi-frame zstd members. Importing it patches zipfile.
              import inspect_ai._util.zipfile  # noqa: F401

              # A warning names what it is about (a duplicate member name, say),
              # and a name can hold a key.
              warnings.simplefilter("ignore")

              log_dir = os.environ["INSPECT_LOG_DIR"]
              checked_dir = os.environ["CHECKED_LOG_DIR"]
              # A fresh directory, so it holds nothing but what this run checked.
              os.mkdir(checked_dir, 0o700)
              if os.path.islink(log_dir):
                  raise RuntimeError("the log directory is a link")
              if not os.path.isdir(log_dir):
                  print("::warning::No Inspect logs were written; there is nothing to upload.")
                  return

              # A key that is not set is left out: an empty pattern would
              # match every log.
              names = ("ANTHROPIC_API_KEY", "GOOGLE_API_KEY", "OPENAI_API_KEY")
              keys = [os.environ[name].encode() for name in names if os.environ.get(name)]
              overlap = max((len(key) for key in keys), default=1) - 1

              class HoldsKey(Exception):
                  pass

              def chunks(read):
                  # Yield chunks until read() returns nothing, raising
                  # HoldsKey once a key appears. The end of each chunk is
                  # carried into the next, so a key split across two chunks
                  # is still found.
                  tail = b""
                  while chunk := read(1 << 20):
                      window = tail + chunk
                      if any(key in window for key in keys):
                          raise HoldsKey
                      tail = window[len(window) - overlap :]
                      yield chunk

              def check(copy):
                  # A copied log (not an .eval): its bytes.
                  with open(copy, "rb") as stream:
                      for _ in chunks(stream.read):
                          pass

              def create(copy):
                  return os.open(copy, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)

              def rebuild(source, copy):
                  """Rebuild the .eval open at source as copy from its checked members.

                  Only the members the archive lists are read, through
                  Inspect's reader, and each is written to the new archive as
                  its bytes are checked; nothing else of the original is
                  copied. Returns None, "keyed" or "unreadable".
                  """
                  stream = os.fdopen(source, "rb", closefd=False)
                  try:
                      archive = zipfile.ZipFile(stream)
                  except Exception:
                      stream.close()
                      return "unreadable"
                  with stream, archive, os.fdopen(create(copy), "wb") as out:
                      with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED) as rebuilt:
                          for info in archive.infolist():
                              if any(key in info.filename.encode() for key in keys):
                                  return "keyed"
                              if info.is_dir():
                                  continue
                              try:
                                  member = archive.open(info)
                                  entry = zipfile.ZipInfo(info.filename, info.date_time)
                              except Exception:
                                  return "unreadable"
                              entry.compress_type = zipfile.ZIP_DEFLATED
                              with member, rebuilt.open(entry, "w", force_zip64=True) as target:
                                  try:
                                      for chunk in chunks(member.read):
                                          target.write(chunk)
                                  except HoldsKey:
                                      return "keyed"
                                  except OSError:
                                      raise
                                  except Exception:
                                      # zipfile's CRC and format errors.
                                      return "unreadable"
                  return None

              # O_NOFOLLOW: a link is refused, not followed. O_NONBLOCK: a
              # fifo opens without waiting for a writer, and fstat then
              # refuses it.
              flags = os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | getattr(os, "O_CLOEXEC", 0)

              def snapshot(path, copy):
                  """Put the log at path into copy, reading it through one descriptor.

                  Returns None once copied (an .eval also checked), "keyed",
                  "other" for a link or special file, or "unreadable" when the
                  log cannot be opened or read (it may have gone). A failure
                  to write the copy raises.
                  """
                  try:
                      source = os.open(path, flags)
                  except OSError as error:
                      return "other" if error.errno == errno.ELOOP else "unreadable"
                  try:
                      if not stat.S_ISREG(os.fstat(source).st_mode):
                          return "other"
                      os.makedirs(os.path.dirname(copy), mode=0o700, exist_ok=True)
                      if path.endswith(".eval"):
                          return rebuild(source, copy)
                      target = create(copy)
                      try:
                          while True:
                              try:
                                  chunk = os.read(source, 1 << 20)
                              except OSError:
                                  return "unreadable"
                              if not chunk:
                                  return None
                              view = memoryview(chunk)
                              while view:
                                  view = view[os.write(target, view) :]
                      finally:
                          os.close(target)
                  finally:
                      os.close(source)

              def refuse(error):
                  raise error

              checked = keyed = unreadable = other = 0
              # Links are not followed; a directory that cannot be listed
              # raises (onerror), which fails the step.
              for root, dirs, files in os.walk(log_dir, onerror=refuse):
                  for name in list(dirs):
                      if os.path.islink(os.path.join(root, name)):
                          dirs.remove(name)
                          checked += 1
                          other += 1
                  for name in files:
                      path = os.path.join(root, name)
                      relative = os.path.relpath(path, log_dir)
                      checked += 1
                      # The artifact keeps the path, so it is checked too.
                      if any(key in os.fsencode(relative) for key in keys):
                          keyed += 1
                          continue
                      copy = os.path.join(checked_dir, relative)
                      outcome = snapshot(path, copy)
                      if outcome is None and not path.endswith(".eval"):
                          try:
                              check(copy)
                          except HoldsKey:
                              outcome = "keyed"
                      if outcome is None:
                          continue
                      if os.path.lexists(copy):
                          os.remove(copy)
                      if outcome == "keyed":
                          keyed += 1
                      elif outcome == "unreadable":
                          unreadable += 1
                      else:
                          other += 1

              withheld = keyed + unreadable + other
              if withheld:
                  print(
                      f"::warning::Withheld {withheld} of {checked} log entries from the upload: "
                      f"{keyed} held a provider key, {unreadable} could not be read, "
                      f"{other} were links or special files."
                  )
              print(f"Checked {checked} log entries; withheld {withheld}.")


          try:
              main()
          except BaseException:
              # The exception would name the path it failed on, and a path can
              # hold a key: say only that the check failed.
              print("::error::The log check did not complete, so no logs will be uploaded.")
              sys.exit(1)
          PY

      - name: Upload Inspect logs
        id: eval_logs
        if: (failure() || cancelled()) && steps.log_scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One name per attempt: a re-run uploads again rather than colliding
          # with the first attempt's artifact.
          name: inspect-swe-eval-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inspect-logs-checked/
          retention-days: 14
          if-no-files-found: warn

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker system prune -f
          docker volume prune -f

  report:
    needs: nightly-tests
    if: always() && needs.nightly-tests.result != 'cancelled'
    runs-on: ubuntu-latest

    steps:
      - name: Report test results to Slack
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID_INSPECT_SWE }}",
              "text": "${{ needs.nightly-tests.result == 'success' && '✅ Inspect SWE Nightly Tests Passed' || '🚨 Inspect SWE Nightly Tests Failed' }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ needs.nightly-tests.result == 'success' && '✅ Inspect SWE Nightly Tests Passed' || '🚨 Inspect SWE Nightly Tests Failed' }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Trigger:*\n${{ github.event_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Tested:*\n<https://github.com/meridianlabs-ai/inspect_swe/commit/${{ needs.nightly-tests.outputs.sha }}|inspect_swe@${{ needs.nightly-tests.outputs.ref }}#${{ needs.nightly-tests.outputs.short_sha }}>"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.nightly-tests.result == 'success' && 'All tests completed successfully! 🎉' || needs.nightly-tests.outputs.eval_logs == 'true' && format('<!channel> The nightly tests have failed. Please investigate. The Inspect logs are attached to the run: <https://github.com/{0}/actions/runs/{1}#artifacts|Artifacts>', github.repository, github.run_id) || '<!channel> The nightly tests have failed. Please investigate.' }}"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Actor: ${{ github.actor }}"
                    }
                  ]
                }
              ]
            }
