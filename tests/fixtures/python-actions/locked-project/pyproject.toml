[project]
name = "ipd-fixture"
version = "0.0.1"
description = "Fixture project for the install-python-dependencies self-test."
requires-python = ">=3.9"
dependencies = ["six==1.16.0"]

[project.optional-dependencies]
extra-dateutil = ["python-dateutil==2.8.2"]

[dependency-groups]
dev = ["iniconfig==2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# This table makes the fixture the uv config root, so uv does not walk up to
# the repository root's [tool.uv] (and its exclude-newer) during the self-test.
[tool.uv]
